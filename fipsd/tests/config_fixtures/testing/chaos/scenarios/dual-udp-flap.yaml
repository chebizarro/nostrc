
scenario:
  name: "dual-udp-flap"
  seed: 42
  duration_secs: 180

topology:
  algorithm: explicit
  num_nodes: 2
  default_transport: udp
  params:
    adjacency:
      - [n01, n02, udp-veth+udp]

netem:
  enabled: true
  default_policy:
    delay_ms: [1, 3]
    jitter_ms: [0, 1]
    loss_pct: [0, 0.2]
  bridge_policy:
    delay_ms: [40, 40]
    jitter_ms: [0, 1]
    loss_pct: [0, 0.2]

link_flaps:
  enabled: true
  only_transport: udp-veth
  interval_secs: {min: 35, max: 45}
  max_down_links: 1
  down_duration_secs: {min: 12, max: 18}
  protect_connectivity: false

traffic:
  enabled: true
  max_concurrent: 1
  interval_secs: {min: 5, max: 10}
  duration_secs: {min: 20, max: 30}
  parallel_streams: 2
  udp_mbps: 1

node_churn:
  enabled: false

fips_overrides:
  node:
    path:
      enabled: true
    mmp:
      log_interval_secs: 1

assertions:
  baseline:
    min_nodes_reporting: 2
    max_roots: 1
    min_nodes_parented: 1

  min_traffic:
    min_sessions_ok: 2

  switch_latency:
    max_ms: 1300
    each_end: true

  path_switches:
    min_total: 4
    per_flap: 4
    extra: 2
  active_timeouts: {}

  max_promotions:
    per_node: 1
  max_dials: 0
  max_stall:
    max_secs: 2
    stream: udp
  paths_live:
    min: 2

  max_errors:
    max_total: 0

logging:
  rust_log: "info,fips::node::handlers::path=debug,fips::node::handlers::mmp=debug,fips::node::bloom=debug,fips::node::lifecycle=debug,fips::node::dataplane::wait=debug"
  output_dir: "./sim-results"
