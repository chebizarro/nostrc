
scenario:
  name: "ethernet-only"
  seed: 42
  duration_secs: 30

topology:
  algorithm: explicit
  num_nodes: 4
  default_transport: ethernet
  params:
    adjacency:
      - [n01, n02]
      - [n02, n03]
      - [n03, n04]
      - [n04, n01]

netem:
  enabled: true
  default_policy:
    delay_ms: [1, 5]
    jitter_ms: [0, 1]
    loss_pct: [0, 0.5]

link_flaps:
  enabled: false

traffic:
  enabled: false

assertions:
  baseline:
    min_nodes_reporting: 4
    max_roots: 1
    min_nodes_parented: 3

logging:
  rust_log: "info"
  output_dir: "./sim-results"
