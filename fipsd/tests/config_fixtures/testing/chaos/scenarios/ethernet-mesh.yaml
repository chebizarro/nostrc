
scenario:
  name: "ethernet-mesh"
  seed: 42
  duration_secs: 120

topology:
  algorithm: explicit
  num_nodes: 6
  params:
    adjacency:
      - [n01, n02, udp]
      - [n02, n03, udp]
      - [n03, n06, udp]
      - [n05, n06, udp]
      - [n01, n04, ethernet]
      - [n02, n05, ethernet]
      - [n04, n05, ethernet]

netem:
  enabled: true
  default_policy:
    delay_ms: [1, 10]
    jitter_ms: [0, 2]
    loss_pct: [0, 1]
  mutation:
    interval_secs: {min: 20, max: 40}
    fraction: 0.3
    policies:
      normal:
        delay_ms: [1, 10]
        loss_pct: [0, 1]
      degraded:
        delay_ms: [30, 80]
        jitter_ms: [5, 20]
        loss_pct: [3, 8]

link_flaps:
  enabled: true
  interval_secs: {min: 20, max: 40}
  max_down_links: 1
  down_duration_secs: {min: 10, max: 20}
  protect_connectivity: true

traffic:
  enabled: false

assertions:
  baseline:
    min_nodes_reporting: 6
    max_roots: 1
    min_nodes_parented: 5
  delivery:
    pairs: [[n04, n06], [n06, n04], [n04, n05]]
    payload_bytes: [0, 1200]
    min_replies: 3
    deadline_secs: 60
    require_transport: ethernet
    transport_node: n04

logging:
  rust_log: "info"
  output_dir: "./sim-results"
