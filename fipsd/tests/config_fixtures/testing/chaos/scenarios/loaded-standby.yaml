
scenario:
  name: "loaded-standby"
  seed: 42
  duration_secs: 105

topology:
  algorithm: explicit
  num_nodes: 2
  default_transport: udp
  params:
    adjacency:
      - [n01, n02, ethernet+udp]

netem:
  enabled: true
  default_policy:
    delay_ms: [1, 3]
    jitter_ms: [0, 0]
    loss_pct: [0, 0]
  bridge_policy:
    delay_ms: [2000, 2000]
    jitter_ms: [0, 0]
    loss_pct: [0, 0]

link_flaps:
  enabled: false

traffic:
  enabled: false

schedule:
  - {at: 10, load: [n01, n02], secs: 65, streams: 4, bidir: true}
  - {at: 50, down: [n01, n02], mode: admin, end: n01, secs: 20}

node_churn:
  enabled: false

fips_overrides:
  node:
    path:
      enabled: true
    mmp:
      log_interval_secs: 1

assertions:
  baseline:
    min_nodes_reporting: 2
    max_roots: 1
    min_nodes_parented: 1

  rescue:
    delay_ms: 2000

  max_promotions:
    per_node: 1
  max_dials: 0
  paths_live:
    min: 2

logging:
  rust_log: "info,fips::node::handlers::path=debug,fips::node::handlers::mmp=debug,fips::node::bloom=debug,fips::node::lifecycle=debug,fips::node::dataplane::encrypted=debug"
  output_dir: "./sim-results"
