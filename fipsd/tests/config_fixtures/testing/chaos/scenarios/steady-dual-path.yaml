
scenario:
  name: "steady-dual-path"
  seed: 42
  duration_secs: 300

topology:
  algorithm: explicit
  num_nodes: 2
  default_transport: udp
  params:
    adjacency:
      - [n01, n02, ethernet+udp]

netem:
  enabled: true
  default_policy:
    delay_ms: [1, 3]
    jitter_ms: [0, 1]
    loss_pct: [0, 0]
  bridge_policy:
    delay_ms: [1, 3]
    jitter_ms: [0, 1]
    loss_pct: [0, 0]

link_flaps:
  enabled: false

traffic:
  enabled: true
  max_concurrent: 1
  interval_secs: {min: 15, max: 30}
  duration_secs: {min: 10, max: 20}
  parallel_streams: 1

node_churn:
  enabled: false

transport_overrides:
  ethernet:
    role: preferred

fips_overrides:
  node:
    path:
      enabled: true
    mmp:
      log_interval_secs: 1

assertions:
  baseline:
    min_nodes_reporting: 2
    max_roots: 1
    min_nodes_parented: 1

  max_promotions:
    per_node: 1
  path_switches:
    max_total: 2
  active_timeouts: {}
  max_dials: 0
  paths_live:
    min: 2
  max_kernel_drops:
    max_pct: 0.3
    min_nodes: 2

  max_errors:
    max_total: 0

logging:
  rust_log: "info,fips::node::handlers::path=debug,fips::node::handlers::mmp=debug,fips::node::bloom=debug,fips::node::lifecycle=debug,fips::node::dataplane::wait=debug"
  output_dir: "./sim-results"
