
scenario:
  name: "dual-path-carrier"
  seed: 42
  duration_secs: 180

topology:
  algorithm: explicit
  num_nodes: 2
  default_transport: udp
  params:
    adjacency:
      - [n01, n02, ethernet+udp]

netem:
  enabled: true
  default_policy:
    delay_ms: [1, 3]
    jitter_ms: [0, 1]
    loss_pct: [0, 0]
  bridge_policy:
    delay_ms: [40, 40]
    jitter_ms: [0, 1]
    loss_pct: [0, 0]

link_flaps:
  enabled: false

schedule:
  - {at: 20, down: [n01, n02], mode: admin, end: n01, secs: 15, capture: [n02], counters: [n02]}
  - {at: 75, down: [n01, n02], mode: admin, end: n02, secs: 20, capture: [n01], counters: [n01]}
  - {at: 135, down: [n01, n02], mode: admin, end: n01, secs: 25, capture: [n02], counters: [n02]}

traffic:
  enabled: true
  max_concurrent: 1
  interval_secs: {min: 10, max: 20}
  duration_secs: {min: 10, max: 20}
  parallel_streams: 1

node_churn:
  enabled: false

fips_overrides:
  node:
    path:
      enabled: true
    mmp:
      log_interval_secs: 1

assertions:
  baseline:
    min_nodes_reporting: 2
    max_roots: 1
    min_nodes_parented: 1

  switch_latency:
    max_ms: 1000
    each_end: true
    signalled_ms: 500

  path_floor: true
  discovery_limit: true

  max_promotions:
    per_node: 1
  max_dials: 0
  paths_live:
    min: 2

  max_errors:
    max_total: 0

logging:
  rust_log: "info,fips::node::handlers::path=debug,fips::node::handlers::mmp=debug,fips::node::bloom=debug,fips::node::lifecycle=debug"
  output_dir: "./sim-results"
