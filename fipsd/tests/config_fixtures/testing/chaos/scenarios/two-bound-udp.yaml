
scenario:
  name: "two-bound-udp"
  seed: 42
  duration_secs: 120

topology:
  algorithm: explicit
  num_nodes: 2
  default_transport: udp
  params:
    adjacency:
      - [n01, n02, udp-veth, {lanes: 2}]

netem:
  enabled: true
  default_policy:
    delay_ms: [1, 3]
    jitter_ms: [0, 0]
    loss_pct: [0, 0]

link_flaps:
  enabled: false

traffic:
  enabled: true
  max_concurrent: 1
  interval_secs: {min: 10, max: 20}
  duration_secs: {min: 10, max: 15}
  parallel_streams: 1
  rate_mbps: 8

node_churn:
  enabled: false

fips_overrides:
  node:
    path:
      enabled: true
    mmp:
      log_interval_secs: 1

assertions:
  baseline:
    min_nodes_reporting: 2
    max_roots: 1
    min_nodes_parented: 1

  lanes:
    cross_arrival: true
    stable: true
  paths_live:
    min: 4
    configured: true
    within_secs: 30

  max_promotions:
    per_node: 1
  max_dials: 0

  max_errors:
    max_total: 0

logging:
  rust_log: "info,fips::node::handlers::path=debug,fips::node::handlers::mmp=debug,fips::node::bloom=debug,fips::node::lifecycle=debug"
  output_dir: "./sim-results"
