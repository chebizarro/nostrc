
scenario:
  name: "forward-only"
  seed: 42
  duration_secs: 160

topology:
  algorithm: explicit
  num_nodes: 2
  default_transport: udp
  params:
    adjacency:
      - [n01, n02, udp-veth+udp]

netem:
  enabled: true
  default_policy:
    delay_ms: [1, 3]
    jitter_ms: [0, 1]
    loss_pct: [0, 0]
  bridge_policy:
    delay_ms: [40, 40]
    jitter_ms: [0, 1]
    loss_pct: [0, 0]

link_flaps:
  enabled: false

traffic:
  enabled: false

schedule:
  - {at: 15, load: [n01, n02], secs: 45, streams: 4, bidir: true}
  - {at: 20, down: [n01, n02], mode: oneway, from: n02, to: n01, secs: 30, capture: [n01, n02]}
  - {at: 85, load: [n01, n02], secs: 45, streams: 4, bidir: true}
  - {at: 90, down: [n01, n02], mode: oneway, from: n01, to: n02, secs: 30, capture: [n01, n02]}

node_churn:
  enabled: false

fips_overrides:
  node:
    path:
      enabled: true
    mmp:
      log_interval_secs: 1

assertions:
  baseline:
    min_nodes_reporting: 2
    max_roots: 1
    min_nodes_parented: 1

  switch_latency:
    max_ms: 1300
    sender_ms: 2600
    each_end: true

  reverse_heard: true
  path_floor: true
  discovery_limit: true

  max_promotions:
    per_node: 1
  max_dials: 0
  paths_live:
    min: 2

  max_errors:
    max_total: 0

logging:
  rust_log: "info,fips::node::handlers::path=debug,fips::node::handlers::mmp=debug,fips::node::bloom=debug,fips::node::lifecycle=debug"
  output_dir: "./sim-results"
