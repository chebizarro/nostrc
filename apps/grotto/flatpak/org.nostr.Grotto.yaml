# EXPERIMENTAL: not a release-supported signer. See ../packaging/flatpak/README.md.
# Caller attestation, trusted approver, Secret portal, activation and browser gates open.
# Flatpak manifest for Grotto
# Build with: flatpak-builder --user --install build-dir org.nostr.Grotto.yaml
#
# Prerequisites:
#   flatpak install flathub org.gnome.Platform//51 org.gnome.Sdk//51
#
app-id: org.nostr.Grotto
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: grotto

finish-args:
  # D-Bus IPC for desktop integration
  - --share=ipc
  # Display protocols
  - --socket=fallback-x11
  - --socket=wayland
  # Secret Service access (GNOME Keyring/libsecret) for secure key storage
  - --talk-name=org.freedesktop.secrets
  # Own the org.nostr.Signer D-Bus name for NIP-55L interface
  - --own-name=org.nostr.Signer
  # Network access for Nostr relay connections (NIP-46 bunker, profile fetching)
  - --share=network
  # GSettings/DConf access for persistent settings
  - --metadata=X-DConf=migrate-path=/org/nostr/Grotto/
  # Desktop notifications for signing requests and alerts
  - --talk-name=org.freedesktop.Notifications
  # Portal access for file chooser (backup/restore) and other portals
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.FileChooser
  # Background portal for daemon auto-start
  - --talk-name=org.freedesktop.portal.Background

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /lib/*.a
  - /lib/*.la
  - /share/man
  - /share/doc
  - /share/gtk-doc
  - /share/aclocal


modules:
  # Shared with the gnostr manifest: packaging/flatpak/modules/.
  # Configuring the tree needs gnostr's dependencies too.
  - ../../../packaging/flatpak/modules/blueprint-compiler.yml
  - ../../../packaging/flatpak/modules/libpeas.yml
  - ../../../packaging/flatpak/modules/libsecp256k1.yml
  - ../../../packaging/flatpak/modules/libsodium.yml
  - ../../../packaging/flatpak/modules/libqrencode.yml
  - ../../../packaging/flatpak/modules/zbar.yml
  - ../../../packaging/flatpak/modules/nsync.yml
  - ../../../packaging/flatpak/modules/jansson.yml
  - ../../../packaging/flatpak/modules/libwebsockets.yml

  # Grotto and grotto-daemon, built with the flags every release job uses
  # (scripts/ci/configure-release.sh) and the in-tree nostrdb/nsync submodules.
  - name: grotto
    buildsystem: simple
    build-commands:
      - scripts/ci/configure-release.sh build -DCMAKE_INSTALL_PREFIX=/app -DCMAKE_INSTALL_LIBDIR=lib
      - cmake --build build --target apps/grotto/all -j
      # Install the app subtree, including panels, private DSOs, locales and RPATHs.
      - cmake --install build/apps/grotto
      - glib-compile-schemas /app/share/glib-2.0/schemas/
      # D-Bus service file (Flatpak-specific with /app/bin path)
      - install -Dm644 apps/grotto/flatpak/org.nostr.Signer.service /app/share/dbus-1/services/org.nostr.Signer.service
      # The desktop file is D-Bus activatable: export its service too.
      - install -Dm644 build/apps/grotto/org.nostr.Grotto.service /app/share/dbus-1/services/org.nostr.Grotto.service
    sources:
      - type: dir
        path: ../../..
        skip:
          - .git
          - .beads
          - .claude
          - build
          - build-flatpak
          - flatpak-build
          - .flatpak-builder
