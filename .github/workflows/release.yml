  build-macos-signer-dmg:
    name: Build macOS DMG (gnostr-signer)
    needs: detect-component
    if: ${{ needs.detect-component.outputs.component == 'global' || needs.detect-component.outputs.component == 'gnostr-signer' }}
    runs-on: macos-latest
    env:
      RELEASE_VERSION: ${{ needs.detect-component.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          brew update
          brew install gtk4 libadwaita glib json-glib cmake ninja pkg-config librsvg \
            jansson secp256k1 libwebsockets libsodium openssl@3 libsoup@3 nsync || true
          echo "PKG_CONFIG_PATH=/opt/homebrew/opt/openssl@3/lib/pkgconfig:/opt/homebrew/opt/libsoup@3/lib/pkgconfig:${PKG_CONFIG_PATH}" >> $GITHUB_ENV
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_MACOS_BUNDLE=ON \
            -DGNOSTR_SIGNER_VERSION="${RELEASE_VERSION}"
      - name: Build
        run: cmake --build build -j
      - name: Create DMG
        run: |
          cd apps/gnostr-signer/packaging/macos
          ./create-dmg.sh --build-dir ../../../../build --version "${RELEASE_VERSION}" --output-dir ../../../../dist
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-signer
          path: dist/*.dmg

  build-macos-tarball:
    name: Build macOS tarball (gnostr)
    needs: detect-component
    if: ${{ needs.detect-component.outputs.component == 'global' || needs.detect-component.outputs.component == 'gnostr' }}
    runs-on: macos-latest
    env:
      RELEASE_VERSION: ${{ needs.detect-component.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          brew update
          brew install gtk4 libadwaita glib json-glib cmake ninja pkg-config \
            jansson secp256k1 libwebsockets libsodium openssl@3 libsoup@3 nsync || true
          echo "PKG_CONFIG_PATH=/opt/homebrew/opt/openssl@3/lib/pkgconfig:/opt/homebrew/opt/libsoup@3/lib/pkgconfig:${PKG_CONFIG_PATH}" >> $GITHUB_ENV
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Create tarball
        env:
          COMPONENT: ${{ needs.detect-component.outputs.component }}
        run: |
          set -e
          VERSION="${RELEASE_VERSION}"
          ARCH=$(uname -m)
          ROOT="gnostr-${VERSION}"
          mkdir -p "tar/${ROOT}/bin"
          cp build/apps/gnostr/gnostr "tar/${ROOT}/bin/"
          if [[ "${COMPONENT}" == "global" ]]; then
            cp build/apps/gnostr-signer/gnostr-signer "tar/${ROOT}/bin/"
            cp build/apps/gnostr-signer/gnostr-signer-daemon "tar/${ROOT}/bin/"
          fi
          tar -C tar -czf "${ROOT}-macos-${ARCH}.tar.gz" "${ROOT}"
          mkdir -p dist
          mv "${ROOT}-macos-${ARCH}.tar.gz" dist/
      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: macos-tarball
          path: dist/*.tar.gz
