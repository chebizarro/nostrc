name: Release Packages

# Linux packages are built natively for x86_64 (ubuntu-latest) and aarch64
# (ubuntu-24.04-arm, no QEMU). x86_64 file names are unchanged; aarch64 ones
# carry each format's tag (_arm64 deb, .aarch64 rpm, -aarch64 AppImage,
# tarball and flatpak, _arm64 snap). Run workflow (dry_run on, the default)
# builds everything as run artifacts without publishing.

on:
  push:
    tags:
      - 'v*'
      - 'libgo-v*'
      - 'libnostr-v*'
      - 'nostr-gobject-v*'
      - 'nostr-gtk-v*'
      - 'libmarmot-v*'
      - 'marmot-gobject-v*'
      - 'gnostr-v*'
      - 'grotto-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test only; never publish a release
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  detect-component:
    name: Detect release component
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.detect.outputs.component }}
      version: ${{ steps.detect.outputs.version }}
      sha: ${{ steps.detect.outputs.sha }}
      tag: ${{ steps.detect.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release identity and peel tag
        id: detect
        env:
          DRY_RUN: ${{ !startsWith(github.ref, 'refs/tags/') || inputs.dry_run }}
        run: |
          args=()
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          python3 .github/workflows/dependency_contract.py release-identity \
            --sha "$GITHUB_SHA" --publisher main "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: main-release-identity
          path: ${{ runner.temp }}/dependency/release.json
          if-no-files-found: error

  # NOSTRC_DEPENDENCY_RELEASE_MODE: disabled (default), shadow, enforce.
  # Only enable enforce after real checked-in-lane/broad evidence; no validation pass is synthesized.
  validation:
    if: vars.NOSTRC_DEPENDENCY_RELEASE_MODE == 'shadow' || vars.NOSTRC_DEPENDENCY_RELEASE_MODE == 'enforce'
    needs: detect-component
    uses: ./.github/workflows/release-validation.yml
    with:
      sha: ${{ needs.detect-component.outputs.sha }}
      tag: ${{ needs.detect-component.outputs.tag }}
      component: ${{ needs.detect-component.outputs.component }}
      dry_run: ${{ !startsWith(github.ref, 'refs/tags/') || inputs.dry_run }}

  release-aggregate:
    name: Require validation and every applicable main package
    if: always()
    needs: [detect-component, validation, build-source, build-linux, build-linux-daemon-tcp, build-appimage-gnostr, build-snap-gnostr, build-snap-signer, build-snap-daemon, build-flatpak, build-flatpak-gnostr, build-macos-signer-dmg, build-macos-tarball]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      artifact_ids: ${{ steps.gate.outputs.artifact_ids }}
    steps:
      - name: Require identity and validation
        env:
          IDENTITY: ${{ needs.detect-component.result }}
          VALIDATION: ${{ needs.validation.result }}
          RELEASE_MODE: ${{ vars.NOSTRC_DEPENDENCY_RELEASE_MODE || 'disabled' }}
        run: |
          test "$IDENTITY" = success
          if [[ "$RELEASE_MODE" == enforce ]]; then test "$VALIDATION" = success; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect-component.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: main-release-identity
          path: ${{ runner.temp }}/dependency
      - uses: actions/download-artifact@v4
        if: needs.validation.result == 'success'
        with:
          name: ${{ needs.validation.outputs.validation_artifact }}
          path: ${{ runner.temp }}/dependency
      - name: Verify exact validation, applicable jobs and expected assets
        id: gate
        env:
          RESULTS: ${{ toJSON(needs) }}
          REQUESTED_SHA: ${{ needs.detect-component.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ vars.NOSTRC_DEPENDENCY_RELEASE_MODE || 'disabled' }}
        run: |
          printf '%s' "$RESULTS" > "$RUNNER_TEMP/package-needs.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" > "$RUNNER_TEMP/package-artifacts.json"
          python3 .github/workflows/dependency_contract.py publish-gate --sha "$REQUESTED_SHA" \
            --publisher main --release-mode "$RELEASE_MODE" --needs "$RUNNER_TEMP/package-needs.json" --artifacts "$RUNNER_TEMP/package-artifacts.json"
      - name: Retain publication decision (not a validation receipt)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-publication-decision-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency/publication.json
          if-no-files-found: warn

  build-source:
    name: Build source archive
    needs: detect-component
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.detect-component.outputs.sha }}
          persist-credentials: false
      - name: Verify package checkout
        env:
          REQUESTED_SHA: ${{ needs.detect-component.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
      # git archive leaves submodules out, and the tree does not build
      # without nostrdb and nsync (nostrc-y5cv): archive every tracked file
      # of the superproject and its submodules.
      - name: Create source archive
        run: |
          set -euo pipefail
          name="${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          git ls-files -z --recurse-submodules |
            tar --null -T - --transform "s,^,${name}/," -czf "dist/${name}-source.tar.gz"
          tar -tzf "dist/${name}-source.tar.gz" > dist/contents.txt
          grep -qx "${name}/third_party/nostrdb/src/nostrdb.c" dist/contents.txt
          grep -q "^${name}/third_party/nsync/" dist/contents.txt
          rm dist/contents.txt
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/*-source.tar.gz
          if-no-files-found: error

  # One build per architecture feeds every native Linux format: deb, rpm,
  # the Linux and daemon tarballs and the Grotto AppImage, so they all ship
  # the same binaries. Packages are only made for the released component.
  build-linux:
    name: Build Linux packages (${{ matrix.arch }})
    needs: detect-component
    if: ${{ needs.detect-component.outputs.component == 'global' || needs.detect-component.outputs.component == 'gnostr' || needs.detect-component.outputs.component == 'grotto' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    env:
      COMPONENT: ${{ needs.detect-component.outputs.component }}
      RELEASE_VERSION: ${{ needs.detect-component.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.detect-component.outputs.sha }}
          persist-credentials: false
      - name: Verify package checkout
        env:
          REQUESTED_SHA: ${{ needs.detect-component.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
      - name: Install build deps
        run: scripts/ci/install-linux-build-deps.sh --fpm --appimage
      - name: Configure
        run: scripts/ci/configure-release.sh build
      - name: Build
        run: cmake --build build -j
      - name: Stage install tree
        run: cmake --install build --prefix "$PWD/stage/usr"
      - name: Build DEBs and RPMs
        run: |
          set -e
          scripts/ci/fpm-packages.sh deb "$COMPONENT" "$RELEASE_VERSION" stage dist
          scripts/ci/fpm-packages.sh rpm "$COMPONENT" "$RELEASE_VERSION" stage dist
      - name: Build Linux tarball
        run: |
          set -e
          if [[ "${COMPONENT}" == "grotto" ]]; then
            ROOT="grotto-${RELEASE_VERSION}"
          else
            ROOT="gnostr-${RELEASE_VERSION}"
          fi
          mkdir -p "tar/${ROOT}/bin" "tar/${ROOT}/share/applications" "tar/${ROOT}/share/icons"
          if [[ "${COMPONENT}" == "global" || "${COMPONENT}" == "gnostr" ]]; then
            cp build/apps/gnostr/gnostr "tar/${ROOT}/bin/"
            cp stage/usr/share/applications/org.gnostr.gnostr.desktop "tar/${ROOT}/share/applications/"
            cp -r apps/gnostr/data/icons/* "tar/${ROOT}/share/icons/"
          fi
          if [[ "${COMPONENT}" == "global" || "${COMPONENT}" == "grotto" ]]; then
            mkdir -p "tar/${ROOT}/share/systemd/user"
            cp build/apps/grotto/grotto build/apps/grotto/grotto-daemon "tar/${ROOT}/bin/"
            cp stage/usr/share/applications/org.nostr.Grotto.desktop "tar/${ROOT}/share/applications/"
            cp -r apps/grotto/data/icons/* "tar/${ROOT}/share/icons/"
            cp apps/grotto/daemon/packaging/systemd/user/*.service "tar/${ROOT}/share/systemd/user/"
          fi
          tar -C tar -czf "dist/${ROOT}-linux-${ARCH}.tar.gz" "${ROOT}"
      - name: Build daemon tarball
        if: ${{ env.COMPONENT != 'gnostr' }}
        run: |
          set -e
          d=tar/grotto-daemon
          install -D build/apps/grotto/grotto-daemon "$d/bin/grotto-daemon"
          install -D -m644 apps/grotto/daemon/packaging/systemd/user/grotto-daemon.service "$d/share/systemd/user/grotto-daemon.service"
          install -D apps/grotto/daemon/packaging/tar/install.sh "$d/scripts/install.sh"
          tar -C tar -czf "dist/grotto-daemon-${RELEASE_VERSION}-linux-${ARCH}.tar.gz" grotto-daemon
      - name: Build Grotto AppImage
        if: ${{ env.COMPONENT != 'gnostr' }}
        run: |
          set -e
          mkdir -p AppDir/usr
          cp -a stage/usr/lib AppDir/usr/ 2>/dev/null || true
          install -D build/apps/grotto/grotto AppDir/usr/bin/grotto
          install -D -m644 apps/grotto/packaging/appimage/grotto.desktop AppDir/usr/share/applications/grotto.desktop
          install -D -m644 apps/grotto/data/icons/hicolor/256x256/apps/org.nostr.Grotto.png \
            AppDir/usr/share/icons/hicolor/256x256/apps/org.nostr.Grotto.png
          install -D -m644 stage/usr/share/glib-2.0/schemas/org.nostr.Grotto.gschema.xml \
            AppDir/usr/share/glib-2.0/schemas/org.nostr.Grotto.gschema.xml
          glib-compile-schemas AppDir/usr/share/glib-2.0/schemas
          scripts/ci/make-appimage.sh AppDir usr/bin/grotto usr/share/applications/grotto.desktop \
            "dist/grotto-${RELEASE_VERSION}-${ARCH}.AppImage" --gtk
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.AppImage
          if-no-files-found: error

  # grotto-daemon with TCP IPC: deb, rpm, tarball and AppImage of one build.
  build-linux-daemon-tcp:
    name: Build grotto-daemon TCP packages (${{ matrix.arch }})
    needs: detect-component
    if: ${{ needs.detect-component.outputs.component == 'global' || needs.detect-component.outputs.component == 'grotto' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    env:
      RELEASE_VERSION: ${{ needs.detect-component.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.detect-component.outputs.sha }}
          persist-credentials: false
      - name: Verify package checkout
        env:
          REQUESTED_SHA: ${{ needs.detect-component.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
      - name: Install build deps
        run: scripts/ci/install-linux-build-deps.sh --fpm --appimage
      - name: Configure (TCP enabled)
        run: scripts/ci/configure-release.sh build -DENABLE_TCP_IPC=ON
      - name: Build (daemon only)
        run: cmake --build build -j --target grotto-daemon
      - name: Stage daemon
        run: |
          set -e
          install -D build/apps/grotto/grotto-daemon stage/usr/bin/grotto-daemon
          install -D -m644 apps/grotto/daemon/packaging/systemd/user/grotto-daemon.service \
            stage/usr/share/systemd/user/grotto-daemon.service
      - name: Build DEB and RPM
        run: |
          set -e
          scripts/ci/fpm-packages.sh deb grotto-daemon-tcp "$RELEASE_VERSION" stage dist
          scripts/ci/fpm-packages.sh rpm grotto-daemon-tcp "$RELEASE_VERSION" stage dist
      - name: Build tarball
        run: |
          set -e
          d=tar/grotto-daemon-tcp
          install -D stage/usr/bin/grotto-daemon "$d/bin/grotto-daemon"
          install -D -m644 stage/usr/share/systemd/user/grotto-daemon.service "$d/share/systemd/user/grotto-daemon.service"
          install -D apps/grotto/daemon/packaging/tar/install.sh "$d/scripts/install.sh"
          tar -C tar -czf "dist/grotto-daemon-tcp-${RELEASE_VERSION}-linux-${ARCH}.tar.gz" grotto-daemon-tcp
      - name: Build AppImage
        run: |
          set -e
          install -D stage/usr/bin/grotto-daemon AppDir/usr/bin/grotto-daemon
          mkdir -p AppDir/usr/share/applications
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=Grotto Daemon (TCP)' \
            'Exec=grotto-daemon' 'Icon=grotto-daemon' 'Terminal=true' 'Categories=Utility;' \
            > AppDir/usr/share/applications/grotto-daemon.desktop
          install -D -m644 apps/grotto/data/icons/hicolor/256x256/apps/org.nostr.Grotto.png \
            AppDir/usr/share/icons/hicolor/256x256/apps/grotto-daemon.png
          scripts/ci/make-appimage.sh AppDir usr/bin/grotto-daemon usr/share/applications/grotto-daemon.desktop \
            "dist/grotto-daemon-tcp-${RELEASE_VERSION}-${ARCH}.AppImage"
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-daemon-tcp-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.AppImage
          if-no-files-found: error

  build-appimage-gnostr:
    name: Build AppImage (gnostr)
    needs: detect-component
    if: ${{ needs.detect-component.outputs.component == 'global' || needs.detect-component.outputs.component == 'gnostr' }}
    uses: ./.github/workflows/gnostr-appimage.yml
    with:
      version: ${{ needs.detect-component.outputs.version }}
      sha: ${{ needs.detect-component.outputs.sha }}

  build-snap-gnostr:
    name: Build Snap (gnostr) (${{ matrix.arch }})
    needs: detect-component
    if: ${{ needs.detect-component.outputs.component == 'global' || needs.detect-component.outputs.component == 'gnostr' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.detect-component.outputs.sha }}
          persist-credentials: false
      - name: Verify package checkout
        env:
          REQUESTED_SHA: ${{ needs.detect-component.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
      # Snapcraft only sees its project directory, so the snap is built
      # from the repository root with this snap's recipe in place.
      - name: Select the gnostr recipe
        run: cp snap/gnostr/snapcraft.yaml snap/snapcraft.yaml
      - name: Build snap
        id: snap
        uses: snapcore/action-build@v1
      - name: Upload snap
        uses: actions/upload-artifact@v4
        with:
          name: snap-gnostr-${{ matrix.arch }}
          path: ${{ steps.snap.outputs.snap }}

  build-snap-signer:
    name: Build Snap (grotto) (${{ matrix.arch }})
    needs: detect-component
    if: ${{ needs.detect-component.outputs.component == 'global' || needs.detect-component.outputs.component == 'grotto' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.detect-component.outputs.sha }}
          persist-credentials: false
      - name: Verify package checkout
        env:
          REQUESTED_SHA: ${{ needs.detect-component.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
      # Snapcraft only sees its project directory, so the snap is built
      # from the repository root with this snap's recipe in place.
      - name: Select the grotto recipe
        run: cp snap/grotto/snapcraft.yaml snap/snapcraft.yaml
      - name: Build snap
        id: snap
        uses: snapcore/action-build@v1
      - name: Upload snap
        uses: actions/upload-artifact@v4
        with:
          name: snap-grotto-${{ matrix.arch }}
          path: ${{ steps.snap.outputs.snap }}

  build-snap-daemon:
    name: Build Snap (grotto-daemon) (${{ matrix.arch }})
    needs: detect-component
    if: ${{ needs.detect-component.outputs.component == 'global' || needs.detect-component.outputs.component == 'grotto' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.detect-component.outputs.sha }}
          persist-credentials: false
      - name: Verify package checkout
        env:
          REQUESTED_SHA: ${{ needs.detect-component.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
      # Snapcraft only sees its project directory, so the snap is built
      # from the repository root with this snap's recipe in place.
      - name: Select the grotto-daemon recipe
        run: cp snap/grotto-daemon/snapcraft.yaml snap/snapcraft.yaml
      - name: Build snap
        id: snap
        uses: snapcore/action-build@v1
      - name: Upload snap
        uses: actions/upload-artifact@v4
        with:
          name: snap-grotto-daemon-${{ matrix.arch }}
          path: ${{ steps.snap.outputs.snap }}

  create-release:
    name: Create GitHub Release and upload artifacts
    needs: [detect-component, release-aggregate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # A workflow_dispatch run publishes only for a tag with dry_run unticked.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && !inputs.dry_run && needs.release-aggregate.result == 'success' && needs.release-aggregate.outputs.publish == 'true' }}
    steps:
      - name: Download only attested package artifacts from this run
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.release-aggregate.outputs.artifact_ids }}
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**
          prerelease: ${{ contains(needs.detect-component.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-flatpak:
    name: Build Flatpak (grotto) (${{ matrix.arch }})
    needs: detect-component
    if: ${{ needs.detect-component.outputs.component == 'global' || needs.detect-component.outputs.component == 'grotto' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.detect-component.outputs.sha }}
          persist-credentials: false
      - name: Verify package checkout
        env:
          REQUESTED_SHA: ${{ needs.detect-component.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
      # Same runtime as the Groundhog Flatpak (groundhog-release.yml).
      - name: Install flatpak-builder and the GNOME 51 SDK
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder elfutils >/dev/null
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Sdk//51 org.gnome.Platform//51
      - name: Build flatpak bundle
        run: |
          mkdir -p flatpak-build
          flatpak-builder --user --arch=${{ matrix.arch }} --force-clean --repo=repo flatpak-build apps/grotto/flatpak/org.nostr.Grotto.yaml
          # x86_64 keeps its historical name; other arches get a suffix.
          name="grotto${{ matrix.arch != 'x86_64' && format('-{0}', matrix.arch) || '' }}.flatpak"
          flatpak build-bundle --arch=${{ matrix.arch }} repo "$name" org.nostr.Grotto \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          mkdir -p dist
          mv "$name" dist/
      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: dist/*.flatpak

  build-flatpak-gnostr:
    name: Build Flatpak (gnostr) (${{ matrix.arch }})
    needs: detect-component
    if: ${{ needs.detect-component.outputs.component == 'global' || needs.detect-component.outputs.component == 'gnostr' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.detect-component.outputs.sha }}
          persist-credentials: false
      - name: Verify package checkout
        env:
          REQUESTED_SHA: ${{ needs.detect-component.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
      # Same runtime as the Groundhog Flatpak (groundhog-release.yml).
      - name: Install flatpak-builder and the GNOME 51 SDK
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder elfutils >/dev/null
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Sdk//51 org.gnome.Platform//51
      - name: Build flatpak bundle
        run: |
          mkdir -p flatpak-build
          flatpak-builder --user --arch=${{ matrix.arch }} --force-clean --repo=repo flatpak-build apps/gnostr/flatpak/org.gnostr.Client.yaml
          # x86_64 keeps its historical name; other arches get a suffix.
          name="gnostr${{ matrix.arch != 'x86_64' && format('-{0}', matrix.arch) || '' }}.flatpak"
          flatpak build-bundle --arch=${{ matrix.arch }} repo "$name" org.gnostr.Client \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          mkdir -p dist
          mv "$name" dist/
      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-gnostr-${{ matrix.arch }}
          path: dist/*.flatpak

  build-macos-signer-dmg:
    name: Build macOS DMG (grotto)
    needs: detect-component
    if: ${{ needs.detect-component.outputs.component == 'global' || needs.detect-component.outputs.component == 'grotto' }}
    runs-on: macos-latest
    env:
      RELEASE_VERSION: ${{ needs.detect-component.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.detect-component.outputs.sha }}
          persist-credentials: false
      - name: Verify package checkout
        env:
          REQUESTED_SHA: ${{ needs.detect-component.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
      - name: Install dependencies
        run: |
          brew update
          brew install gtk4 libadwaita glib json-glib cmake ninja pkg-config librsvg \
            jansson secp256k1 libwebsockets libsodium openssl@3 libsoup@3 nsync \
            libpeas qrencode sqlite blueprint-compiler
          echo "PKG_CONFIG_PATH=/opt/homebrew/opt/openssl@3/lib/pkgconfig:/opt/homebrew/opt/sqlite/lib/pkgconfig:/opt/homebrew/opt/libsoup@3/lib/pkgconfig:${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
      - name: Configure
        run: |
          scripts/ci/configure-release.sh build \
            -DBUILD_MACOS_BUNDLE=ON \
            -DGNOSTR_SIGNER_VERSION="${RELEASE_VERSION}"
      - name: Build
        run: cmake --build build -j
      - name: Create DMG
        run: |
          cd apps/grotto/packaging/macos
          ./create-dmg.sh --build-dir ../../../../build --version "${RELEASE_VERSION}" --output-dir ../../../../dist
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-signer
          path: dist/*.dmg

  build-macos-tarball:
    name: Build macOS tarball (gnostr)
    needs: detect-component
    if: ${{ needs.detect-component.outputs.component == 'global' || needs.detect-component.outputs.component == 'gnostr' }}
    runs-on: macos-latest
    env:
      RELEASE_VERSION: ${{ needs.detect-component.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ needs.detect-component.outputs.sha }}
          persist-credentials: false
      - name: Verify package checkout
        env:
          REQUESTED_SHA: ${{ needs.detect-component.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
      - name: Install dependencies
        run: |
          brew update
          brew install gtk4 libadwaita glib json-glib cmake ninja pkg-config \
            jansson secp256k1 libwebsockets libsodium openssl@3 libsoup@3 nsync \
            libpeas qrencode sqlite blueprint-compiler
          echo "PKG_CONFIG_PATH=/opt/homebrew/opt/openssl@3/lib/pkgconfig:/opt/homebrew/opt/sqlite/lib/pkgconfig:/opt/homebrew/opt/libsoup@3/lib/pkgconfig:${PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
      - name: Configure
        run: |
          scripts/ci/configure-release.sh build
      - name: Build
        run: cmake --build build -j
      - name: Create tarball
        env:
          COMPONENT: ${{ needs.detect-component.outputs.component }}
        run: |
          set -e
          VERSION="${RELEASE_VERSION}"
          ARCH=$(uname -m)
          ROOT="gnostr-${VERSION}"
          mkdir -p "tar/${ROOT}/bin"
          cp build/apps/gnostr/gnostr "tar/${ROOT}/bin/"
          if [[ "${COMPONENT}" == "global" ]]; then
            cp build/apps/grotto/grotto "tar/${ROOT}/bin/"
            cp build/apps/grotto/grotto-daemon "tar/${ROOT}/bin/"
          fi
          tar -C tar -czf "${ROOT}-macos-${ARCH}.tar.gz" "${ROOT}"
          mkdir -p dist
          mv "${ROOT}-macos-${ARCH}.tar.gz" dist/
      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: macos-tarball
          path: dist/*.tar.gz
