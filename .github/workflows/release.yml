name: Release Packages

on:
  push:
    tags:
      - 'v*'
      - 'libgo-v*'
      - 'libnostr-v*'
      - 'nostr-gobject-v*'
      - 'nostr-gtk-v*'
      - 'libmarmot-v*'
      - 'marmot-gobject-v*'
      - 'gnostr-v*'
      - 'gnostr-signer-v*'
  workflow_dispatch:

jobs:
  detect-component:
    name: Detect release component
    runs-on: ubuntu-latest
    outputs:
      component: ${{ steps.detect.outputs.component }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - name: Parse release tag
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          if [[ "${tag}" =~ ^v(.+)$ ]]; then
            component="global"
            version="${BASH_REMATCH[1]}"
          elif [[ "${tag}" =~ ^(.+)-v(.+)$ ]]; then
            component="${BASH_REMATCH[1]}"
            version="${BASH_REMATCH[2]}"
          else
            # Preserve workflow_dispatch behavior on branches.
            component="global"
            version="${tag//\//-}"
          fi

          echo "component=${component}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Detected component '${component}' at version '${version}'"

  build-source:
    name: Build source archive
    needs: detect-component
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Create source archive
        run: |
          archive="${GITHUB_REF_NAME//\//-}-source.tar.gz"
          git archive --format=tar.gz --prefix="${GITHUB_REF_NAME}/" HEAD > "${archive}"
          mkdir -p dist
          mv "${archive}" dist/
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/*-source.tar.gz
          if-no-files-found: error

  build-deb:
    name: Build .deb packages
    needs: detect-component
    if: ${{ needs.detect-component.outputs.component == 'global' || needs.detect-component.outputs.component == 'gnostr' || needs.detect-component.outputs.component == 'gnostr-signer' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libgtk-4-dev libadwaita-1-dev libjansson-dev libwebsockets-dev libsecret-1-dev libssl-dev \
            libnsync-dev \
            ruby ruby-dev rubygems \
            git ca-certificates
          sudo gem install --no-document fpm
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Stage install tree
        run: |
          cmake --install build --prefix "$PWD/stage/usr"
      - name: Build DEBs with fpm
        env:
          COMPONENT: ${{ needs.detect-component.outputs.component }}
          RELEASE_VERSION: ${{ needs.detect-component.outputs.version }}
        run: |
          set -e
          mkdir -p dist package-roots
          if [[ "${COMPONENT}" == "global" || "${COMPONENT}" == "gnostr" ]]; then
            root="package-roots/gnostr"
            mkdir -p "${root}/usr/bin" \
              "${root}/usr/share/applications" \
              "${root}/usr/share/icons/hicolor/scalable/apps" \
              "${root}/usr/share/icons/hicolor/scalable/actions"
            cp stage/usr/bin/gnostr "${root}/usr/bin/"
            cp stage/usr/share/applications/org.gnostr.gnostr.desktop "${root}/usr/share/applications/"
            cp stage/usr/share/icons/hicolor/scalable/apps/org.gnostr.gnostr.svg "${root}/usr/share/icons/hicolor/scalable/apps/"
            cp stage/usr/share/icons/hicolor/scalable/actions/gnostr-*.svg "${root}/usr/share/icons/hicolor/scalable/actions/"
            fpm -s dir -t deb -n gnostr -v "${RELEASE_VERSION}" \
              -C "${root}" -p dist/gnostr_VERSION_ARCH.deb .
          fi
          if [[ "${COMPONENT}" == "global" || "${COMPONENT}" == "gnostr-signer" ]]; then
            signer_root="package-roots/gnostr-signer"
            mkdir -p "${signer_root}/usr/bin" \
              "${signer_root}/usr/share/glib-2.0/schemas" \
              "${signer_root}/usr/share/dbus-1/services" \
              "${signer_root}/usr/share/applications" \
              "${signer_root}/usr/share/icons/hicolor/scalable/apps"
            cp stage/usr/bin/gnostr-signer "${signer_root}/usr/bin/"
            cp stage/usr/share/glib-2.0/schemas/org.gnostr.Signer.gschema.xml "${signer_root}/usr/share/glib-2.0/schemas/"
            glib-compile-schemas "${signer_root}/usr/share/glib-2.0/schemas"
            cp stage/usr/share/dbus-1/services/org.nostr.Signer.service "${signer_root}/usr/share/dbus-1/services/"
            cp stage/usr/share/applications/org.gnostr.Signer.desktop "${signer_root}/usr/share/applications/"
            cp stage/usr/share/icons/hicolor/scalable/apps/org.gnostr.Signer.svg "${signer_root}/usr/share/icons/hicolor/scalable/apps/"
            fpm -s dir -t deb -n gnostr-signer -v "${RELEASE_VERSION}" \
              -C "${signer_root}" -p dist/gnostr-signer_VERSION_ARCH.deb .

            daemon_root="package-roots/gnostr-signer-daemon"
            mkdir -p "${daemon_root}/usr/bin"
            cp stage/usr/bin/gnostr-signer-daemon "${daemon_root}/usr/bin/"
            fpm -s dir -t deb -n gnostr-signer-daemon -v "${RELEASE_VERSION}" \
              -C "${daemon_root}" -p dist/gnostr-signer-daemon_VERSION_ARCH.deb .
          fi
      - name: Upload DEBs
        uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          path: dist/*.deb

  build-appimage:
    name: Build AppImage (gnostr-signer)
    needs: detect-component
    if: ${{ needs.detect-component.outputs.component == 'global' || needs.detect-component.outputs.component == 'gnostr-signer' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.detect-component.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libgtk-4-dev libadwaita-1-dev libjansson-dev libwebsockets-dev libsecret-1-dev libssl-dev \
            libnsync-dev \
            wget file patchelf desktop-file-utils
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j --target gnostr-signer
      - name: Download AppImage tools
        run: |
          mkdir -p appimage-tools
          cd appimage-tools
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-gtk/releases/download/continuous/linuxdeploy-plugin-gtk.sh
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh appimagetool-x86_64.AppImage
      - name: Prepare AppDir
        run: |
          set -e
          APPDIR=$PWD/AppDir
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/scalable/apps"
          cp build/apps/gnostr-signer/gnostr-signer "$APPDIR/usr/bin/gnostr-signer"
          # Desktop file and metadata
          cp apps/gnostr-signer/packaging/appimage/gnostr-signer.desktop "$APPDIR/usr/share/applications/"
          # Icon
          if [ -f apps/gnostr-signer/data/icons/hicolor/scalable/apps/org.gnostr.Signer.svg ]; then
            cp apps/gnostr-signer/data/icons/hicolor/scalable/apps/org.gnostr.Signer.svg "$APPDIR/usr/share/icons/hicolor/scalable/apps/"
          fi
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          set -e
          export NO_APPSTREAM=1
          ./appimage-tools/linuxdeploy-x86_64.AppImage --appdir AppDir \
            -d AppDir/usr/share/applications/gnostr-signer.desktop \
            --executable AppDir/usr/bin/gnostr-signer \
            --plugin gtk
          ./appimage-tools/appimagetool-x86_64.AppImage AppDir gnostr-signer-${RELEASE_VERSION}-x86_64.AppImage
          mkdir -p dist
          mv gnostr-signer-*.AppImage dist/
      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage

  build-appimage-daemon-tcp:
    name: Build AppImage (gnostr-signer-daemon TCP)
    needs: detect-component
    if: ${{ needs.detect-component.outputs.component == 'global' || needs.detect-component.outputs.component == 'gnostr-signer' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.detect-component.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config wget file patchelf
      - name: Configure (TCP enabled)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_TCP_IPC=ON
      - name: Build (daemon only)
        run: cmake --build build -j --target gnostr-signer-daemon
      - name: Download AppImage tools
        run: |
          mkdir -p appimage-tools
          cd appimage-tools
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage appimagetool-x86_64.AppImage
      - name: Prepare AppDir
        run: |
          set -e
          APPDIR=$PWD/AppDir
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications"
          cp build/apps/gnostr-signer/gnostr-signer-daemon "$APPDIR/usr/bin/gnostr-signer-daemon"
          # Minimal desktop (optional for CLI); enables AppImage metadata
          cat > "$APPDIR/usr/share/applications/gnostr-signer-daemon.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=GNostr Signer Daemon (TCP)
          Exec=gnostr-signer-daemon
          Terminal=true
          Categories=Utility;
          EOF
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          set -e
          export NO_APPSTREAM=1
          ./appimage-tools/linuxdeploy-x86_64.AppImage --appdir AppDir \
            -d AppDir/usr/share/applications/gnostr-signer-daemon.desktop \
            --executable AppDir/usr/bin/gnostr-signer-daemon
          ./appimage-tools/appimagetool-x86_64.AppImage AppDir gnostr-signer-daemon-tcp-${RELEASE_VERSION}-x86_64.AppImage
          mkdir -p dist
          mv gnostr-signer-daemon-tcp-*.AppImage dist/
      - name: Upload AppImage (daemon TCP)
        uses: actions/upload-artifact@v4
        with:
          name: appimage-daemon-tcp
          path: dist/*.AppImage

  build-appimage-gnostr:
    name: Build AppImage (gnostr)
    needs: detect-component
    if: ${{ needs.detect-component.outputs.component == 'global' || needs.detect-component.outputs.component == 'gnostr' }}
    uses: ./.github/workflows/gnostr-appimage.yml
    with:
      version: ${{ needs.detect-component.outputs.version }}

  build-snap-gnostr:
    name: Build Snap (gnostr)
    needs: detect-component
    if: ${{ needs.detect-component.outputs.component == 'global' || needs.detect-component.outputs.component == 'gnostr' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build snap
        uses: snapcore/action-build@v1
        with:
          path: ./snap/gnostr
      - name: Upload snap
        uses: actions/upload-artifact@v4
        with:
          name: snap-gnostr
          path: snap/gnostr/*.snap

  build-snap-signer:
    name: Build Snap (gnostr-signer)
    needs: detect-component
    if: ${{ needs.detect-component.outputs.component == 'global' || needs.detect-component.outputs.component == 'gnostr-signer' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build snap
        uses: snapcore/action-build@v1
        with:
          path: ./snap/gnostr-signer
      - name: Upload snap
        uses: actions/upload-artifact@v4
        with:
          name: snap-gnostr-signer
          path: snap/gnostr-signer/*.snap

  build-snap-daemon:
    name: Build Snap (gnostr-signer-daemon)
    needs: detect-component
    if: ${{ needs.detect-component.outputs.component == 'global' || needs.detect-component.outputs.component == 'gnostr-signer' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build snap
        uses: snapcore/action-build@v1
        with:
          path: ./snap/gnostr-signer-daemon
      - name: Upload snap
        uses: actions/upload-artifact@v4
        with:
          name: snap-gnostr-signer-daemon
          path: snap/gnostr-signer-daemon/*.snap

  create-release:
    name: Create GitHub Release and upload artifacts
    needs: [detect-component, build-source, build-deb, build-deb-tcp, build-rpm, build-rpm-tcp, build-tarball-daemon, build-tarball-daemon-tcp, build-tarball-linux, build-appimage, build-appimage-gnostr, build-appimage-daemon-tcp, build-snap-gnostr, build-snap-signer, build-snap-daemon, build-flatpak, build-flatpak-gnostr, build-macos-signer-dmg, build-macos-tarball]
    runs-on: ubuntu-latest
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') && (needs.build-source.result == 'success' || needs.build-deb.result == 'success' || needs.build-deb-tcp.result == 'success' || needs.build-rpm.result == 'success' || needs.build-rpm-tcp.result == 'success' || needs.build-tarball-daemon.result == 'success' || needs.build-tarball-daemon-tcp.result == 'success' || needs.build-tarball-linux.result == 'success' || needs.build-appimage.result == 'success' || needs.build-appimage-gnostr.result == 'success' || needs.build-appimage-daemon-tcp.result == 'success' || needs.build-snap-gnostr.result == 'success' || needs.build-snap-signer.result == 'success' || needs.build-snap-daemon.result == 'success' || needs.build-flatpak.result == 'success' || needs.build-flatpak-gnostr.result == 'success' || needs.build-macos-signer-dmg.result == 'success' || needs.build-macos-tarball.result == 'success') }}
    steps:
      - name: Download artifacts from this workflow run
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-rpm:
    name: Build RPM packages
    needs: detect-component
    if: ${{ needs.detect-component.outputs.component == 'global' || needs.detect-component.outputs.component == 'gnostr' || needs.detect-component.outputs.component == 'gnostr-signer' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libgtk-4-dev libadwaita-1-dev libjansson-dev libwebsockets-dev libsecret-1-dev libssl-dev \
            libnsync-dev ruby ruby-dev rubygems git ca-certificates
          sudo gem install --no-document fpm
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Stage install tree
        run: cmake --install build --prefix "$PWD/stage/usr"
      - name: Build RPMs with fpm
        env:
          COMPONENT: ${{ needs.detect-component.outputs.component }}
          RELEASE_VERSION: ${{ needs.detect-component.outputs.version }}
        run: |
          set -e
          mkdir -p dist package-roots
          if [[ "${COMPONENT}" == "global" || "${COMPONENT}" == "gnostr" ]]; then
            root="package-roots/gnostr"
            mkdir -p "${root}/usr/bin" \
              "${root}/usr/share/applications" \
              "${root}/usr/share/icons/hicolor/scalable/apps" \
              "${root}/usr/share/icons/hicolor/scalable/actions"
            cp stage/usr/bin/gnostr "${root}/usr/bin/"
            cp stage/usr/share/applications/org.gnostr.gnostr.desktop "${root}/usr/share/applications/"
            cp stage/usr/share/icons/hicolor/scalable/apps/org.gnostr.gnostr.svg "${root}/usr/share/icons/hicolor/scalable/apps/"
            cp stage/usr/share/icons/hicolor/scalable/actions/gnostr-*.svg "${root}/usr/share/icons/hicolor/scalable/actions/"
            fpm -s dir -t rpm -n gnostr -v "${RELEASE_VERSION}" \
              -C "${root}" -p dist/gnostr_VERSION_ARCH.rpm .
          fi
          if [[ "${COMPONENT}" == "global" || "${COMPONENT}" == "gnostr-signer" ]]; then
            signer_root="package-roots/gnostr-signer"
            mkdir -p "${signer_root}/usr/bin" \
              "${signer_root}/usr/share/glib-2.0/schemas" \
              "${signer_root}/usr/share/dbus-1/services" \
              "${signer_root}/usr/share/applications" \
              "${signer_root}/usr/share/icons/hicolor/scalable/apps"
            cp stage/usr/bin/gnostr-signer "${signer_root}/usr/bin/"
            cp stage/usr/share/glib-2.0/schemas/org.gnostr.Signer.gschema.xml "${signer_root}/usr/share/glib-2.0/schemas/"
            glib-compile-schemas "${signer_root}/usr/share/glib-2.0/schemas"
            cp stage/usr/share/dbus-1/services/org.nostr.Signer.service "${signer_root}/usr/share/dbus-1/services/"
            cp stage/usr/share/applications/org.gnostr.Signer.desktop "${signer_root}/usr/share/applications/"
            cp stage/usr/share/icons/hicolor/scalable/apps/org.gnostr.Signer.svg "${signer_root}/usr/share/icons/hicolor/scalable/apps/"
            fpm -s dir -t rpm -n gnostr-signer -v "${RELEASE_VERSION}" \
              -C "${signer_root}" -p dist/gnostr-signer_VERSION_ARCH.rpm .

            daemon_root="package-roots/gnostr-signer-daemon"
            mkdir -p "${daemon_root}/usr/bin" "${daemon_root}/usr/share/systemd/user"
            cp stage/usr/bin/gnostr-signer-daemon "${daemon_root}/usr/bin/"
            cp stage/usr/share/systemd/user/gnostr-signer-daemon.service "${daemon_root}/usr/share/systemd/user/"
            fpm -s dir -t rpm -n gnostr-signer-daemon -v "${RELEASE_VERSION}" \
              -C "${daemon_root}" -p dist/gnostr-signer-daemon_VERSION_ARCH.rpm .
          fi
      - name: Upload RPMs
        uses: actions/upload-artifact@v4
        with:
          name: rpm-packages
          path: dist/*.rpm

  build-tarball-daemon:
    name: Build tarball (daemon + systemd + installer)
    needs: detect-component
    if: ${{ needs.detect-component.outputs.component == 'global' || needs.detect-component.outputs.component == 'gnostr-signer' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.detect-component.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j --target gnostr-signer-daemon
      - name: Assemble tarball tree
        run: |
          set -e
          mkdir -p tar/gnostr-signer-daemon/bin
          mkdir -p tar/gnostr-signer-daemon/share/systemd/user
          mkdir -p tar/gnostr-signer-daemon/scripts
          cp build/apps/gnostr-signer/gnostr-signer-daemon tar/gnostr-signer-daemon/bin/
          cp apps/gnostr-signer/daemon/packaging/systemd/user/gnostr-signer-daemon.service tar/gnostr-signer-daemon/share/systemd/user/
          cp apps/gnostr-signer/daemon/packaging/tar/install.sh tar/gnostr-signer-daemon/scripts/
          tar -C tar -czf gnostr-signer-daemon-${RELEASE_VERSION}-linux-x86_64.tar.gz gnostr-signer-daemon
          mkdir -p dist
          mv gnostr-signer-daemon-*.tar.gz dist/
      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: tarball-daemon
          path: dist/*.tar.gz

  build-tarball-linux:
    name: Build Linux tarball
    needs: detect-component
    if: ${{ needs.detect-component.outputs.component == 'global' || needs.detect-component.outputs.component == 'gnostr' || needs.detect-component.outputs.component == 'gnostr-signer' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.detect-component.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libgtk-4-dev libadwaita-1-dev libjansson-dev libwebsockets-dev libsecret-1-dev libssl-dev \
            libnsync-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Assemble tarball tree
        env:
          COMPONENT: ${{ needs.detect-component.outputs.component }}
        run: |
          set -e
          VERSION="${RELEASE_VERSION}"
          if [[ "${COMPONENT}" == "gnostr-signer" ]]; then
            ROOT="gnostr-signer-${VERSION}"
          else
            ROOT="gnostr-${VERSION}"
          fi
          mkdir -p "tar/${ROOT}/bin" "tar/${ROOT}/share/applications" "tar/${ROOT}/share/icons"

          if [[ "${COMPONENT}" == "global" || "${COMPONENT}" == "gnostr" ]]; then
            cp build/apps/gnostr/gnostr "tar/${ROOT}/bin/"
            cp apps/gnostr/data/*.desktop "tar/${ROOT}/share/applications/" 2>/dev/null || true
            cp -r apps/gnostr/data/icons/* "tar/${ROOT}/share/icons/" 2>/dev/null || true
          fi
          if [[ "${COMPONENT}" == "global" || "${COMPONENT}" == "gnostr-signer" ]]; then
            mkdir -p "tar/${ROOT}/share/systemd/user"
            cp build/apps/gnostr-signer/gnostr-signer "tar/${ROOT}/bin/"
            cp build/apps/gnostr-signer/gnostr-signer-daemon "tar/${ROOT}/bin/"
            cp apps/gnostr-signer/data/*.desktop "tar/${ROOT}/share/applications/" 2>/dev/null || true
            cp -r apps/gnostr-signer/data/icons/* "tar/${ROOT}/share/icons/" 2>/dev/null || true
            cp apps/gnostr-signer/daemon/packaging/systemd/user/*.service "tar/${ROOT}/share/systemd/user/" 2>/dev/null || true
          fi

          tar -C tar -czf "${ROOT}-linux-x86_64.tar.gz" "${ROOT}"
          mkdir -p dist
          mv "${ROOT}-linux-x86_64.tar.gz" dist/
      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: tarball-linux
          path: dist/*.tar.gz

  build-rpm-tcp:
    name: Build RPM package (daemon TCP-enabled)
    needs: detect-component
    if: ${{ needs.detect-component.outputs.component == 'global' || needs.detect-component.outputs.component == 'gnostr-signer' }}
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.detect-component.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libgtk-4-dev libadwaita-1-dev libjansson-dev libwebsockets-dev libsecret-1-dev libssl-dev \
            libnsync-dev ruby ruby-dev rubygems git ca-certificates
          sudo gem install --no-document fpm
      - name: Configure (TCP enabled)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_TCP_IPC=ON
      - name: Build (daemon only)
        run: cmake --build build -j --target gnostr-signer-daemon
      - name: Stage install tree
        run: cmake --install build --prefix "$PWD/stage/usr"
      - name: Build RPM (daemon TCP variant)
        run: |
          set -e
          mkdir -p dist
          fpm -s dir -t rpm -n gnostr-signer-daemon-tcp -v "${RELEASE_VERSION}" \
            --prefix=/usr \
            stage/usr/bin/gnostr-signer-daemon=/usr/bin/gnostr-signer-daemon \
            stage/usr/share/systemd/user/=usr/share/systemd/user/ \
            -C . -p dist/gnostr-signer-daemon-tcp_VERSION_ARCH.rpm
      - name: Upload RPM TCP
        uses: actions/upload-artifact@v4
        with:
          name: rpm-packages-tcp
          path: dist/*.rpm

