name: Backpressure Capacity Matrix

on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      artifact_prefix:
        type: string
        default: ''
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'NipOptions.cmake'
      - 'cmake/**'
      - 'libgo/**'
      - 'libnostr/**'
      - 'libjson/**'
      - 'nips/**'
      - 'third_party/**'
      - 'components/**'
      - '.gitmodules'
      - 'apps/relayd/**'
      - 'scripts/run_bp_matrix.py'
      - 'scripts/aggregate_bp_matrix.py'
      - 'scripts/generate_bp_report.py'
      - '.github/workflows/bp-matrix.yml'
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'NipOptions.cmake'
      - 'cmake/**'
      - 'libgo/**'
      - 'libnostr/**'
      - 'libjson/**'
      - 'nips/**'
      - 'third_party/**'
      - 'components/**'
      - '.gitmodules'
      - 'apps/relayd/**'
      - 'scripts/run_bp_matrix.py'
      - 'scripts/aggregate_bp_matrix.py'
      - 'scripts/generate_bp_report.py'
      - '.github/workflows/bp-matrix.yml'

jobs:
  bp-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - name: Verify requested checkout
        if: inputs.sha != ''
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build meson pkg-config \
            libssl-dev libglib2.0-dev libgirepository1.0-dev libcjson-dev libsodium-dev \
            libsecp256k1-dev libjansson-dev libnsync-dev libwebsockets-dev libgit2-dev libmicrohttpd-dev \
            libcurl4-openssl-dev libsoup-3.0-dev libjson-glib-dev libxml2-dev \
            libgtk-4-dev libadwaita-1-dev libsecret-1-dev libpeas-2-dev libqrencode-dev libzbar-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gettext python3 python3-pip python3-gi curl ca-certificates xz-utils

      - name: Install pinned Blueprint compiler
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          curl -fL --retry 3 https://download.gnome.org/sources/blueprint-compiler/0.22/blueprint-compiler-0.22.2.tar.xz -o "$work/compiler.tar.xz"
          printf '%s  %s\n' 231d72efbac931c235ac3e022fe94982095c20d88721d9a8dcf60152f2017e07 "$work/compiler.tar.xz" | sha256sum -c
          mkdir "$work/source"
          tar -xJf "$work/compiler.tar.xz" --strip-components=1 -C "$work/source"
          meson setup "$work/build" "$work/source" --prefix=/usr/local \
            -Dpython.purelibdir="$(python3 -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          meson compile -C "$work/build"
          sudo meson install -C "$work/build"
          blueprint-compiler --version | grep -x 0.22.2

      - name: Configure (CMake)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNOSTR_ENABLE_METRICS=ON

      - name: Build
        run: cmake --build build -j2

      - name: Run capacity matrix
        run: |
          python3 scripts/run_bp_matrix.py \
            --caps "1,2,4,8,16,32,64" \
            --duration-ms 15000 \
            --burst 128 \
            --sleep-us 500 \
            --interval-ms 200 \
            --modes try,block \
            --consume-us 5000 \
            --outdir build/bp_matrix

      - name: Aggregate matrix summaries
        run: |
          python3 scripts/aggregate_bp_matrix.py \
            --base build/bp_matrix \
            --out-prefix build/bp_matrix/summary

      - name: Generate Markdown report
        run: |
          python3 scripts/generate_bp_report.py \
            --base build/bp_matrix \
            --out build/bp_matrix/REPORT.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}bp-matrix-artifacts
          path: build/bp_matrix
