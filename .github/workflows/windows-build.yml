# =============================================================================
# GitHub Actions Workflow: Windows Build
# =============================================================================
#
# Builds Grotto for Windows using MSYS2/MinGW-w64 and creates an
# NSIS installer package.
#
# Triggers:
#   - Push to main/master branch
#   - Pull requests targeting main/master
#   - Manual workflow dispatch
#   - Release tags (v*)
#
# =============================================================================

name: Windows Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'NipOptions.cmake'
      - 'cmake/**'
      - 'libgo/**'
      - 'libnostr/**'
      - 'libjson/**'
      - 'nips/**'
      - 'third_party/**'
      - 'components/**'
      - '.gitmodules'
      - 'apps/**'
      - 'nostr-gobject/**'
      - 'nostr-gtk/**'
      - 'gnome/common/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'NipOptions.cmake'
      - 'cmake/**'
      - 'libgo/**'
      - 'libnostr/**'
      - 'libjson/**'
      - 'nips/**'
      - 'third_party/**'
      - 'components/**'
      - '.gitmodules'
      - 'apps/**'
      - 'nostr-gobject/**'
      - 'nostr-gtk/**'
      - 'gnome/common/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run with debug logging'
        required: false
        default: false
        type: boolean

env:
  BUILD_TYPE: Release

permissions:
  contents: read

jobs:
  identity:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        run: python3 .github/workflows/dependency_contract.py release-identity --sha "$GITHUB_SHA" --publisher windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-identity
          path: ${{ runner.temp }}/dependency/release.json
          if-no-files-found: error
  # NOSTRC_DEPENDENCY_RELEASE_MODE defaults to disabled until real lane/broad proof.
  validation:
    if: vars.NOSTRC_DEPENDENCY_RELEASE_MODE == 'shadow' || vars.NOSTRC_DEPENDENCY_RELEASE_MODE == 'enforce'
    needs: identity
    uses: ./.github/workflows/release-validation.yml
    with:
      sha: ${{ needs.identity.outputs.sha }}
      tag: ${{ needs.identity.outputs.tag }}
      component: global
      dry_run: false
  build:
    uses: ./.github/workflows/windows-validation.yml
    with:
      sha: ${{ github.sha }}
  release-aggregate:
    if: always() && startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [identity, validation, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      artifact_ids: ${{ steps.gate.outputs.artifact_ids }}
    steps:
      - name: Require identity and validation
        env:
          IDENTITY: ${{ needs.identity.result }}
          VALIDATION: ${{ needs.validation.result }}
          RELEASE_MODE: ${{ vars.NOSTRC_DEPENDENCY_RELEASE_MODE || 'disabled' }}
        run: |
          test "$IDENTITY" = success
          if [[ "$RELEASE_MODE" == enforce ]]; then test "$VALIDATION" = success; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-identity
          path: ${{ runner.temp }}/dependency
      - uses: actions/download-artifact@v4
        if: needs.validation.result == 'success'
        with:
          name: ${{ needs.validation.outputs.validation_artifact }}
          path: ${{ runner.temp }}/dependency
      - id: gate
        env:
          RESULTS: ${{ toJSON(needs) }}
          REQUESTED_SHA: ${{ needs.identity.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ vars.NOSTRC_DEPENDENCY_RELEASE_MODE || 'disabled' }}
        run: |
          printf '%s' "$RESULTS" > "$RUNNER_TEMP/package-needs.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" > "$RUNNER_TEMP/package-artifacts.json"
          python3 .github/workflows/dependency_contract.py publish-gate --sha "$REQUESTED_SHA" \
            --publisher windows --release-mode "$RELEASE_MODE" --needs "$RUNNER_TEMP/package-needs.json" --artifacts "$RUNNER_TEMP/package-artifacts.json"

  release:
    name: Create Release
    needs: release-aggregate
    runs-on: ubuntu-latest
    if: always() && startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' && needs.release-aggregate.result == 'success' && needs.release-aggregate.outputs.publish == 'true'

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.release-aggregate.outputs.artifact_ids }}
          path: artifacts
          merge-multiple: true

      - name: Calculate checksums
        run: |
          cd artifacts
          sha256sum -- *.exe > SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: true
