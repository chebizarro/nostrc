# Fuzz testing workflow for grotto security-critical components
#
# Runs fuzzing on:
# - NIP-49 encryption/decryption
# - BIP-39 mnemonic parsing
# - JSON event parsing
#
# Issue: nostrc-p7f6
#
# This workflow runs:
# - On manual trigger (workflow_dispatch)
# - Weekly on Sundays for continuous fuzzing
# - On PRs touching security-critical files

name: grotto Fuzz Testing

# Weekly schedule retained until W11 replacement evidence is met.
on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      artifact_prefix:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      fuzz_duration:
        description: 'Fuzz duration per target (seconds)'
        required: false
        default: '300'
      target:
        description: 'Specific target (nip49, bip39, json-event, or all)'
        required: false
        default: 'all'
  schedule:
    # Run weekly on Sundays at 3:00 UTC
    - cron: '0 3 * * 0'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'apps/grotto/src/backup-recovery.c'
      - 'apps/grotto/src/backup-recovery.h'
      - 'apps/grotto/src/bunker_service.c'
      - 'apps/grotto/src/bunker_service.h'
      - 'nips/nip49/**'
      - 'libnostr/src/crypto/bip39*'
      - 'apps/grotto/tests/fuzz/**'

env:
  # Default duration for scheduled runs and PRs (shorter for PRs)
  DEFAULT_FUZZ_DURATION: 60

permissions:
  contents: read

jobs:
  select-fuzz:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.select.outputs.targets }}
      duration: ${{ steps.select.outputs.duration }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - id: select
        env:
          REQUESTED_SHA: ${{ inputs.sha || github.sha }}
          TARGET: ${{ inputs.target || 'all' }}
          DURATION: ${{ inputs.fuzz_duration }}
          MODE: ${{ inputs.sha != '' && 'broad' || github.event_name == 'pull_request' && 'affected' || 'broad' }}
        run: python3 .github/workflows/dependency_contract.py fuzz --sha "$REQUESTED_SHA" --mode "$MODE" --fuzz-target "$TARGET" --duration "$DURATION"
  fuzz-test:
    needs: select-fuzz
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    env:
      FUZZ_CORPUS: ${{ matrix.target == 'json-event' && 'json_event' || matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.select-fuzz.outputs.targets) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - name: Verify requested checkout
        if: inputs.sha != ''
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build meson pkg-config clang llvm libclang-rt-dev \
            libjansson-dev libsecp256k1-dev libwebsockets-dev libsodium-dev \
            libssl-dev libcurl4-openssl-dev libglib2.0-dev libsoup-3.0-dev \
            libnsync-dev libjson-glib-dev libgit2-dev \
            libgtk-4-dev libadwaita-1-dev libsecret-1-dev libxml2-dev libpeas-2-dev \
            libqrencode-dev libzbar-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gettext python3 python3-gi curl ca-certificates xz-utils

      - name: Install pinned Blueprint compiler
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          curl -fL --retry 3 https://download.gnome.org/sources/blueprint-compiler/0.22/blueprint-compiler-0.22.2.tar.xz -o "$work/compiler.tar.xz"
          printf '%s  %s\n' 231d72efbac931c235ac3e022fe94982095c20d88721d9a8dcf60152f2017e07 "$work/compiler.tar.xz" | sha256sum -c
          mkdir "$work/source"
          tar -xJf "$work/compiler.tar.xz" --strip-components=1 -C "$work/source"
          meson setup "$work/build" "$work/source" --prefix=/usr/local \
            -Dpython.purelibdir="$(python3 -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          meson compile -C "$work/build"
          sudo meson install -C "$work/build"
          blueprint-compiler --version | grep -x 0.22.2

      - name: Configure with fuzz targets
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_FUZZ_TARGETS=ON \
            -DFUZZ_ENGINE=LIBFUZZER \
            -DENABLE_NIP19=ON \
            -DENABLE_NIP49=ON

      - name: Build fuzz targets
        run: |
          cmake --build build --target fuzz-${{ matrix.target }}

      - name: Run fuzz-${{ matrix.target }}
        run: |
          set -euo pipefail
          FUZZ_BIN="build/apps/grotto/tests/fuzz/fuzz-${{ matrix.target }}"
          CORPUS_DIR="build/apps/grotto/tests/fuzz/corpus/${FUZZ_CORPUS}"
          ARTIFACTS_DIR="fuzz-artifacts-${{ matrix.target }}"

          mkdir -p "${ARTIFACTS_DIR}"

          echo "Running fuzz-${{ matrix.target }} for ${{ needs.select-fuzz.outputs.duration }} seconds..."

          # Run the fuzzer
          ${FUZZ_BIN} "${CORPUS_DIR}" \
            -max_total_time=${{ needs.select-fuzz.outputs.duration }} \
            -artifact_prefix="${ARTIFACTS_DIR}/" \
            -print_final_stats=1 \
            2>&1 | tee "fuzz-${{ matrix.target }}.log"

          # Check for crashes
          if ls "${ARTIFACTS_DIR}"/crash-* 1> /dev/null 2>&1; then
            echo "::error::Crashes found in fuzz-${{ matrix.target }}"
            exit 1
          fi

          echo "Fuzzing completed successfully for ${{ matrix.target }}"

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}fuzz-crashes-${{ matrix.target }}
          path: |
            fuzz-artifacts-${{ matrix.target }}/
            fuzz-${{ matrix.target }}.log
          if-no-files-found: ignore

      - name: Upload updated corpus
        if: success() && (inputs.sha != '' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}fuzz-corpus-${{ matrix.target }}
          path: build/apps/grotto/tests/fuzz/corpus/${{ env.FUZZ_CORPUS }}/
          if-no-files-found: ignore

  coverage-report:
    name: Generate coverage report
    runs-on: ubuntu-latest
    needs: fuzz-test
    if: inputs.sha != '' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - name: Verify requested checkout
        if: inputs.sha != ''
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build meson pkg-config clang llvm libclang-rt-dev \
            libjansson-dev libsecp256k1-dev libwebsockets-dev libsodium-dev \
            libssl-dev libcurl4-openssl-dev libglib2.0-dev libsoup-3.0-dev \
            libnsync-dev libjson-glib-dev libgit2-dev \
            libgtk-4-dev libadwaita-1-dev libsecret-1-dev libxml2-dev libpeas-2-dev \
            libqrencode-dev libzbar-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gettext python3 python3-gi curl ca-certificates xz-utils lcov

      - name: Download all corpus artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.artifact_prefix }}fuzz-corpus-*
          path: downloaded-corpus
          merge-multiple: false

      - name: Install pinned Blueprint compiler
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          curl -fL --retry 3 https://download.gnome.org/sources/blueprint-compiler/0.22/blueprint-compiler-0.22.2.tar.xz -o "$work/compiler.tar.xz"
          printf '%s  %s\n' 231d72efbac931c235ac3e022fe94982095c20d88721d9a8dcf60152f2017e07 "$work/compiler.tar.xz" | sha256sum -c
          mkdir "$work/source"
          tar -xJf "$work/compiler.tar.xz" --strip-components=1 -C "$work/source"
          meson setup "$work/build" "$work/source" --prefix=/usr/local \
            -Dpython.purelibdir="$(python3 -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          meson compile -C "$work/build"
          sudo meson install -C "$work/build"
          blueprint-compiler --version | grep -x 0.22.2

      - name: Configure with coverage
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_FUZZ_TARGETS=ON \
            -DFUZZ_ENGINE=LIBFUZZER \
            -DENABLE_NIP19=ON \
            -DENABLE_NIP49=ON \
            -DCMAKE_C_FLAGS="-fprofile-instr-generate -fcoverage-mapping"

      - name: Build fuzz targets
        run: cmake --build build --target fuzz-targets

      - name: Run corpus for coverage
        run: |
          for target in nip49 bip39 json-event; do
            FUZZ_BIN="build/apps/grotto/tests/fuzz/fuzz-${target}"
            CORPUS_DIR="downloaded-corpus/${{ inputs.artifact_prefix }}fuzz-corpus-${target}"
            if [ -d "${CORPUS_DIR}" ] && [ -x "${FUZZ_BIN}" ]; then
              LLVM_PROFILE_FILE="fuzz-${target}.profraw" ${FUZZ_BIN} "${CORPUS_DIR}" -runs=0 || true
            fi
          done

      - name: Merge coverage data
        run: |
          llvm-profdata merge -sparse fuzz-*.profraw -o fuzz.profdata || true

      - name: Generate coverage report
        run: |
          for target in nip49 bip39 json-event; do
            FUZZ_BIN="build/apps/grotto/tests/fuzz/fuzz-${target}"
            if [ -x "${FUZZ_BIN}" ]; then
              llvm-cov report "${FUZZ_BIN}" -instr-profile=fuzz.profdata 2>/dev/null || true
            fi
          done
