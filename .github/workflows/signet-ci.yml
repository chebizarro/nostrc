name: signet CI

# Dedicated CI for the Signet NIP-46 bunker. The main nostrc CI builds with
# -DSIGNET_ENABLE=OFF, so without this workflow signet has no coverage. This
# builds signet with both the monorepo CMake and standalone Meson routes, with a
# matrix entry that turns on the experimental FIDO2/passkeys modules so those
# code paths and their tests are exercised in CI too.

on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      artifact_prefix:
        type: string
        default: ''
  workflow_dispatch:

jobs:
  build-and-test:
    name: signet • ${{ matrix.build_type }} • passkeys=${{ matrix.passkeys }} • sqlcipher=${{ matrix.sqlcipher }} • hooks=${{ matrix.test_hooks || 'OFF' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        passkeys: [ 'OFF', 'ON' ]
        sqlcipher: [ 'OFF', 'ON' ]
        build_type: [ 'Debug' ]
        include:
          # Exercise binding-race and forced-secret regressions in one test
          # build; the Release configuration below keeps hooks disabled.
          - passkeys: 'ON'
            sqlcipher: 'OFF'
            build_type: 'Debug'
            test_hooks: 'ON'
          # fp-52iq: assurance comes from running tests the way the project is
          # shipped. Release optimizes signet_core and defines NDEBUG, so cover
          # the shipped configuration too instead of testing Debug only.
          - passkeys: 'ON'
            sqlcipher: 'ON'
            build_type: 'Release'

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - name: Verify requested checkout
        if: inputs.sha != ''
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"

      - name: Cache apt package downloads
        id: apt-cache
        uses: ./.github/actions/cache-apt

      - name: Packaging tools
        if: matrix.passkeys == 'OFF' && matrix.sqlcipher == 'OFF'
        run: sudo apt-get update && sudo apt-get install -y shellcheck python3-jsonschema python3-yaml cloud-init
      - name: Source and Compose contracts (all profiles)
        if: matrix.passkeys == 'OFF' && matrix.sqlcipher == 'OFF'
        run: |
          python3 signet/deploy/check-release.py
          python3 signet/deploy/update-inventory.py --check
          bash signet/tests/test_deployment_smoke.sh --compose
          shellcheck -x -P signet/deploy signet/deploy/*.sh signet/deploy/digitalocean/*.sh signet/tests/test_deployment_smoke.sh signet/tests/integration/test_production_roundtrip.sh
          bash signet/deploy/digitalocean/validate-cloud-init.sh
          sh signet/tests/check_test_parity.sh signet/tests
      - name: Validate Caddy configuration without serving
        if: matrix.passkeys == 'OFF' && matrix.sqlcipher == 'OFF'
        run: |
          source signet/deploy/versions.env
          docker build -f signet/deploy/Dockerfile.caddy \
            --build-arg CADDY_BUILDER_IMAGE="$CADDY_BUILDER_IMAGE" \
            --build-arg CADDY_IMAGE="$CADDY_IMAGE" -t sec-signet-caddy .
          docker run --rm --network none -e SIGNET_ENROLLMENT_HOST=enroll.example.org \
            -v "$PWD/signet/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" sec-signet-caddy \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake meson ninja-build pkg-config clang \
            libjansson-dev libsecp256k1-dev libwebsockets-dev libsodium-dev \
            libssl-dev libcurl4-openssl-dev libglib2.0-dev libsoup-3.0-dev \
            libjson-glib-dev libgit2-dev libnsync-dev libyaml-dev \
            libsqlite3-dev libmicrohttpd-dev libcbor-dev libsqlcipher-dev python3-jsonschema python3-venv python3-yaml
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      - name: Install hermetic backup-test prerequisite
        shell: bash
        run: |
          source signet/deploy/versions.env
          python3 -m venv --system-site-packages "$RUNNER_TEMP/signet-backup-cli"
          "$RUNNER_TEMP/signet-backup-cli/bin/pip" install "awscli==$AWSCLI_VERSION"
          echo "$RUNNER_TEMP/signet-backup-cli/bin" >> "$GITHUB_PATH"

      - name: Save apt package downloads even after failure
        if: always() && steps.apt-cache.outputs.key != '' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /var/cache/nostrc-apt/archives/*.deb
          key: ${{ steps.apt-cache.outputs.key }}${{ job.status != 'success' && format('-partial-{0}-{1}-{2}', github.run_id, github.run_attempt, strategy.job-index || 0) || '' }}

      - name: Configure (signet enabled)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DENABLE_NIP19=ON -DENABLE_NIP49=ON \
            -DWITH_NOSTRDB=ON -DLIBNOSTR_WITH_NOSTRDB=ON \
            -DBUILD_NOSTR_GTK=OFF -DBUILD_APPS=OFF -DBUILD_RELAYD=OFF \
            -DSIGNET_ENABLE=ON -DBUILD_TESTING=ON \
            -DSIGNET_ENABLE_PASSKEYS=${{ matrix.passkeys }} \
            -DSIGNET_ENABLE_TEST_HOOKS=${{ matrix.test_hooks || 'OFF' }} \
            -DSIGNET_USE_SQLCIPHER=${{ matrix.sqlcipher }}

      - name: Build
        run: cmake --build build -j

      # fp-52iq: this is the full signet test set. CMakeLists.txt and
      # meson.build are kept in parity, and the test_list_parity case in this
      # run fails if they drift, so a test can no longer be meson-only and
      # therefore absent from every shipped build.
      - name: Test (signet ctest suite)
        run: ctest --test-dir build/signet/tests --output-on-failure

      - name: Configure Meson (same security profile)
        shell: bash
        run: |
          build_type='${{ matrix.build_type }}'
          passkeys=false; sqlcipher=false; hooks=false
          if [[ '${{ matrix.passkeys }}' == ON ]]; then passkeys=true; fi
          if [[ '${{ matrix.sqlcipher }}' == ON ]]; then sqlcipher=true; fi
          if [[ '${{ matrix.test_hooks || 'OFF' }}' == ON ]]; then hooks=true; fi
          meson setup build-signet-meson signet --buildtype="${build_type,,}" \
            -Dnostrc_build_dir="$PWD/build" -Dsignet_require_in_tree_libs=true \
            -Dsignet_enable_tests=true -Dsignet_enable_passkeys="$passkeys" \
            -Dsignet_use_sqlcipher="$sqlcipher" -Dsignet_enable_test_hooks="$hooks" \
            -Dwerror=true

      - name: Build and test Meson suite
        run: |
          meson compile -C build-signet-meson
          meson test -C build-signet-meson --print-errorlogs
