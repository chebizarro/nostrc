name: Shared-vault syncd
on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      selection_artifact:
        type: string
        required: true
permissions:
  contents: read
jobs:
  selected:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      REQUESTED_SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Verify requested source
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.selection_artifact }}
          path: ${{ runner.temp }}/vault-plan
      - name: Cache apt package downloads
        id: apt-cache
        uses: ./.github/actions/cache-apt

      - name: Install bounded build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 \
            libjansson-dev libsecp256k1-dev libwebsockets-dev libnsync-dev \
            libsodium-dev libssl-dev libcurl4-openssl-dev libsqlite3-dev \
            libsecret-1-dev libpam0g-dev libfuse3-dev
      - name: Save apt package downloads even after failure
        if: always() && steps.apt-cache.outputs.key != '' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /var/cache/nostrc-apt/archives/*.deb
          key: ${{ steps.apt-cache.outputs.key }}${{ job.status != 'success' && format('-partial-{0}-{1}-{2}', github.run_id, github.run_attempt, strategy.job-index || 0) || '' }}

      - name: Execute the selected vault checks
        run: |
          python3 scripts/ci-selected-execution.py run \
            --plan "$RUNNER_TEMP/vault-plan/plan.json" --profile homed.vault.linux \
            --build "$RUNNER_TEMP/vault-build" --configure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vault-syncd-${{ inputs.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/vault-build/ci-selected.log
            ${{ runner.temp }}/vault-build/ci-selected.xml
            ${{ runner.temp }}/vault-build/ci-selected-registration.json
            ${{ runner.temp }}/vault-build/Testing
          if-no-files-found: warn
