name: NIP-55L libsecret refusing-session

on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      artifact_prefix:
        type: string
        default: ''
      selection_artifact:
        description: Same-run shared selection plan; empty runs the complete signer-consumer profiles
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signer-consumers:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        profile: [nostr_seal.linux, desktop.signer.linux, groundhog.identity_compat.linux]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - name: Verify requested checkout
        env:
          REQUESTED_SHA: ${{ inputs.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
      - uses: actions/download-artifact@v4
        if: inputs.selection_artifact != ''
        with:
          name: ${{ inputs.selection_artifact }}
          path: ${{ runner.temp }}/ci-selection
      - name: Validate source-bound selection
        id: selection
        env:
          SELECTION_ARTIFACT: ${{ inputs.selection_artifact }}
          PROFILE: ${{ matrix.profile }}
        run: |
          if [[ -z "$SELECTION_ARTIFACT" ]]; then
            echo 'selected=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PY'
          import importlib.util, os, pathlib, sys
          # Loading the runner by path does not add scripts/ for its sibling imports.
          sys.path.insert(0, 'scripts')
          spec = importlib.util.spec_from_file_location('runner', 'scripts/ci-selected-execution.py')
          runner = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(runner)
          plan, _, _ = runner.load_handoff(pathlib.Path(os.environ['RUNNER_TEMP']) / 'ci-selection/plan.json')
          runner.selection.write_json(pathlib.Path(os.environ['RUNNER_TEMP']) / 'signer-plan.json', plan)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('selected=' + str(os.environ['PROFILE'] in plan['expected_lane_ids']).lower() + '\n')
          PY
      - name: Install signer-consumer build prerequisites
        if: steps.selection.outputs.selected == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config gettext blueprint-compiler \
            libxml2-dev libgtk-4-dev libadwaita-1-dev libglib2.0-dev libsecret-1-dev \
            libjansson-dev libsecp256k1-dev libwebsockets-dev libsodium-dev \
            libssl-dev libcurl4-openssl-dev libsoup-3.0-dev libjson-glib-dev glib-networking \
            libgit2-dev libsqlite3-dev libnsync-dev libsqlcipher-dev libqrencode-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev dbus-bin dbus-x11 \
            xvfb xauth at-spi2-core desktop-file-utils appstream python3-gi
      - name: Execute selected signer consumers
        if: steps.selection.outputs.selected == 'true'
        env:
          REQUESTED_SHA: ${{ inputs.sha || github.sha }}
          SELECTION_ARTIFACT: ${{ inputs.selection_artifact }}
          PROFILE: ${{ matrix.profile }}
        run: |
          args=(--head "$REQUESTED_SHA" --profile "$PROFILE" --evidence-dir "$RUNNER_TEMP/signer-evidence")
          if [[ -n "$SELECTION_ARTIFACT" ]]; then
            args+=(--plan "$RUNNER_TEMP/signer-plan.json")
          else
            # Direct/manual and broad CI calls execute the entire named profile.
            args+=(--broad)
          fi
          scripts/test-gate.sh "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.artifact_prefix }}signer-consumer-${{ matrix.profile }}
          path: ${{ runner.temp }}/signer-evidence
          if-no-files-found: warn
  refusing-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - name: Verify requested checkout
        if: inputs.sha != ''
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build pinned libsecret test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: scripts
          file: scripts/nip55l-libsecret-ci.Dockerfile
          load: true
          tags: nostrc-nip55l-libsecret-ci:0.21.8
          cache-from: type=gha,scope=nip55l-libsecret-0218
          cache-to: type=gha,scope=nip55l-libsecret-0218,mode=max,ignore-error=true
      - name: Run private-bus refusing-session contract
        run: |
          docker run --rm --network none \
            --mount "type=bind,src=$PWD,dst=/src,readonly" \
            nostrc-nip55l-libsecret-ci:0.21.8 \
            bash /src/scripts/run-nip55l-libsecret-ci.sh
