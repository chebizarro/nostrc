name: NIP-55L libsecret refusing-session

on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      artifact_prefix:
        type: string
        default: ''
  push:
    branches: [main, master]
    paths:
      - 'nips/nip55l/**'
      - 'nips/nip19/**'
      - 'nips/nip44/**'
      - 'libnostr/**'
      - 'gnome/seahorse/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'scripts/nip55l-libsecret-ci.Dockerfile'
      - 'scripts/run-nip55l-libsecret-ci.sh'
      - '.github/workflows/nip55l-libsecret-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'nips/nip55l/**'
      - 'nips/nip19/**'
      - 'nips/nip44/**'
      - 'libnostr/**'
      - 'gnome/seahorse/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'scripts/nip55l-libsecret-ci.Dockerfile'
      - 'scripts/run-nip55l-libsecret-ci.sh'
      - '.github/workflows/nip55l-libsecret-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refusing-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - name: Verify requested checkout
        if: inputs.sha != ''
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build pinned libsecret test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: scripts
          file: scripts/nip55l-libsecret-ci.Dockerfile
          load: true
          tags: nostrc-nip55l-libsecret-ci:0.21.8
          cache-from: type=gha,scope=nip55l-libsecret-0218
          cache-to: type=gha,scope=nip55l-libsecret-0218,mode=max,ignore-error=true
      - name: Run private-bus refusing-session contract
        run: |
          docker run --rm --network none \
            --mount "type=bind,src=$PWD,dst=/src,readonly" \
            nostrc-nip55l-libsecret-ci:0.21.8 \
            bash /src/scripts/run-nip55l-libsecret-ci.sh
