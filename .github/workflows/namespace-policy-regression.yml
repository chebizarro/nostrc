name: Diagnostic namespace policy regressions
# Explicit diagnostics only. Not an ordinary CI requirement or delivery gate.
# Docker provisions a regression host, not a native selector/profile backend.
on:
  # Reusable only for the separately invoked diagnostic orchestration.
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      artifact_prefix:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      sha:
        description: Exact commit to diagnose (defaults to dispatched ref)
        type: string
        required: false
      artifact_prefix:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      REQUESTED_SHA: ${{ inputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Bind exact source and retain native launcher diagnosis (not acceptance)
        shell: bash
        run: |
          set -euo pipefail
          # Prove the exact checkout before executing its shared controller.
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          bash tests/selection/namespace_policy_controller.sh bind
      - name: Record explicitly provisioned disposable Docker regression policy
        shell: bash
        run: bash tests/selection/namespace_policy_controller.sh record
      - name: Provision per-job namespace-custody AppArmor profile
        shell: bash
        # An unconfined container still enters unprivileged_userns at unshare
        # on Ubuntu 24.04 (PR22 hosted evidence); only a fresh owned profile is added.
        run: bash tests/selection/namespace_apparmor_setup.sh "$RUNNER_TEMP/namespace-policy/control/apparmor"
      - name: Build dedicated nonroot regression image
        shell: bash
        run: bash tests/selection/namespace_policy_controller.sh build
      - name: Execute unchanged kernel matrix and full policy suite
        shell: bash
        run: bash tests/selection/namespace_policy_controller.sh execute
      - name: Remove only this job's recorded immutable container
        if: always()
        shell: bash
        run: bash tests/selection/namespace_policy_controller.sh remove
      - name: Remove only this job's AppArmor profile after its consumers exited
        if: always()
        shell: bash
        run: bash tests/selection/namespace_apparmor_teardown.sh "$RUNNER_TEMP/namespace-policy/control/apparmor"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.artifact_prefix }}namespace-policy-regressions-${{ inputs.sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/namespace-policy
          if-no-files-found: error
