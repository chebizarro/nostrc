# Groundhog release (W30, nostrc-4hwv): on a groundhog-v<version> tag, build
# every package target from one source archive, smoke-test each installed
# package, and publish them as a GitHub pre-release.
#
# Each job mirrors the container recipe the packages were first verified
# with (docs/designs/groundhog-packaging-plan-2026-10-05.md). The signer,
# Grotto, is built from the same tree and shipped beside Groundhog.
#
# Every Linux package is built twice, natively: x86_64 on ubuntu-24.04 and
# aarch64 on GitHub's arm64 runner (ubuntu-24.04-arm), no QEMU. File names
# carry each format's own architecture tag (_amd64/_arm64 debs,
# .x86_64/.aarch64 rpms, -x86_64/-aarch64 Arch packages and flatpaks).
#
# Dry run: Actions -> Groundhog release -> Run workflow on any branch builds
# and smoke-tests every package and keeps them as run artifacts; nothing is
# published unless the run is for a groundhog-v* tag and dry_run is off.
name: Groundhog release

on:
  push:
    tags:
      - 'groundhog-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test only; never publish a release
        type: boolean
        default: true

permissions:
  contents: read

env:
  VERSION: ${{ github.ref_name }}

jobs:
  source:
    name: Source archive
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - id: v
        run: |
          v="${GITHUB_REF_NAME#groundhog-v}"
          if [ "${GITHUB_REF_NAME}" = "$v" ]; then
            v="0.0.0-$(git rev-parse --short HEAD)"
          else
            # The tag must be the version the app shows (About, --version):
            # project() VERSION plus GROUNDHOG_PRERELEASE in gnome/groundhog/CMakeLists.txt.
            cmake_file=gnome/groundhog/CMakeLists.txt
            base=$(sed -n 's/^project(groundhog VERSION \([0-9.]*\).*/\1/p' "$cmake_file")
            pre=$(sed -n 's/^set(GROUNDHOG_PRERELEASE "\([^"]*\)")/\1/p' "$cmake_file")
            full="$base${pre:+-$pre}"
            if [ "$v" != "$full" ]; then
              echo "tag version $v does not match the app's version $full ($cmake_file)" >&2
              exit 1
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: scripts/make-desktop-source-archive.sh "${{ steps.v.outputs.version }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/groundhog-*.tar.gz
          if-no-files-found: error

  deb:
    name: ${{ matrix.distro.name }} package (${{ matrix.arch }})
    needs: source
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.distro.image }}
    strategy:
      fail-fast: false
      matrix:
        # One deb per release: library names differ (libsecp256k1-1 on
        # 24.04, -2 on Debian 13, newer on 26.04), so a 24.04 build does
        # not install elsewhere. The version carries the distribution;
        # dpkg names the file _amd64 or _arm64.
        distro:
          - { image: 'ubuntu:24.04', name: 'Ubuntu 24.04', tag: ubuntu24.04 }
          - { image: 'ubuntu:26.04', name: 'Ubuntu 26.04', tag: ubuntu26.04 }
          - { image: 'debian:13',    name: 'Debian 13',    tag: debian13 }
        arch: [x86_64, aarch64]
        include:
          - { arch: x86_64,  runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: source, path: src }
      - name: Build
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq devscripts equivs git ca-certificates xvfb dbus >/dev/null
          tar -xzf src/groundhog-*.tar.gz
          cd groundhog-*/
          # The archive carries the headless stack's debian/; the desktop
          # recipe replaces it (scripts/build-desktop-deb.sh does the same).
          rm -rf debian && cp -r packaging/debian-desktop debian
          sed -i "1s/(\([^)]*\))/(\1~${{ matrix.distro.tag }})/" debian/changelog
          mk-build-deps -i -r -t 'apt-get -y -qq' debian/control
          dpkg-buildpackage -b -us -uc
          mkdir -p ../dist && cp ../*.deb ../dist/
      - name: Install and launch
        run: |
          set -eux
          apt-get install -y -qq ./dist/*.deb
          groundhog --version
          xvfb-run -a dbus-run-session -- groundhog --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.distro.tag }}-${{ matrix.arch }}
          path: dist/*.deb

  rpm:
    name: Fedora package (${{ matrix.arch }})
    needs: source
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    container: registry.fedoraproject.org/fedora:42
    steps:
      - uses: actions/download-artifact@v4
        with: { name: source, path: src }
      - name: Build
        env:
          UPSTREAM_VERSION: ${{ needs.source.outputs.version }}
        run: |
          set -eux
          dnf install -y -q rpm-build rpmdevtools dnf-plugins-core xorg-x11-server-Xvfb dbus-daemon
          tar -xzf src/groundhog-*.tar.gz
          dnf builddep -y -q groundhog-*/packaging/rpm/groundhog.spec
          rpmdev-setuptree
          cp src/groundhog-*.tar.gz ~/rpmbuild/SOURCES/
          # The spec names the archive by its pinned release; a branch build
          # (workflow_dispatch) carries a 0.0.0-<sha> version instead. Point
          # the spec at the archive actually built, as the Arch job does.
          spec=$(echo groundhog-*/packaging/rpm/groundhog.spec)
          sed -i "s/^%global upstream_version .*/%global upstream_version ${UPSTREAM_VERSION}/" "$spec"
          rpmbuild -ba "$spec"
          mkdir -p dist && cp ~/rpmbuild/RPMS/*/*.rpm dist/
      - name: Install and launch
        run: |
          set -eux
          dnf install -y -q dist/groundhog-0*.rpm dist/grotto-0*.rpm
          groundhog --version
          xvfb-run -a dbus-run-session -- groundhog --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: dist/*.rpm

  arch:
    name: Arch package (${{ matrix.arch }})
    needs: source
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04, image: 'archlinux:latest' }
          # The official archlinux image is x86_64 only. Arch Linux ARM is
          # what Linux-on-Android setups run (Termux proot-distro archlinux,
          # chroots), so the aarch64 package is built on an Arch Linux ARM
          # root: menci/archlinuxarm is rebuilt daily from the official
          # ArchLinuxARM-aarch64 rootfs with the archlinuxarm keyring
          # initialised. Pinned by digest; bump it deliberately.
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: 'menci/archlinuxarm@sha256:57ed42430d3d3f22beb2983de1aa23396b27fcf33ebf5dd781947cdc1038a640'
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
          path: ci
      - uses: actions/download-artifact@v4
        with: { name: source, path: src }
      - name: Build
        run: ci/scripts/ci/build-arch-package.sh src/groundhog-*.tar.gz dist
      - name: Install and launch
        run: |
          set -eux
          pacman -U --noconfirm dist/groundhog-0*.pkg.tar.zst dist/grotto-0*.pkg.tar.zst
          groundhog --version
          xvfb-run -a dbus-run-session -- groundhog --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: arch-${{ matrix.arch }}
          path: dist/*.pkg.tar.zst

  flatpak:
    name: Flatpak bundle (${{ matrix.arch }})
    needs: source
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install flatpak-builder and the GNOME 51 SDK
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder elfutils xvfb >/dev/null
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Sdk//51 org.gnome.Platform//51
      - name: Build and bundle
        run: |
          set -eux
          flatpak-builder --user --arch=${{ matrix.arch }} --force-clean --repo=repo build-flatpak \
            gnome/groundhog/packaging/flatpak/org.nostr.Groundhog.yml
          mkdir -p dist
          flatpak build-bundle --arch=${{ matrix.arch }} repo "dist/org.nostr.Groundhog-${{ needs.source.outputs.version }}-${{ matrix.arch }}.flatpak" \
            org.nostr.Groundhog --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Install and launch
        run: |
          set -eux
          flatpak install --user -y --noninteractive dist/*.flatpak
          flatpak run org.nostr.Groundhog --version
          xvfb-run -a dbus-run-session -- flatpak run org.nostr.Groundhog --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: dist/*.flatpak

  nix:
    # Checks the flake builds on x86_64-linux and aarch64-linux; nothing
    # is uploaded (users build from the flake).
    name: Nix flake (${{ matrix.system }})
    needs: source
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { system: x86_64-linux,  runner: ubuntu-24.04 }
          - { system: aarch64-linux, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
      # A git checkout is a flake without its submodules unless asked.
      - run: nix build '.?submodules=1#groundhog' '.?submodules=1#grotto' --print-out-paths -L
      - run: nix run '.?submodules=1#groundhog' -- --version

  release:
    name: Publish pre-release
    needs: [source, deb, rpm, arch, flatpak, nix]
    # Publish only a complete release: a failed or cancelled package build blocks it.
    # A workflow_dispatch run publishes only for a tag with dry_run unticked.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/groundhog-v') && !inputs.dry_run && needs.source.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          prerelease: true
          generate_release_notes: false
          body: |
            Groundhog ${{ needs.source.outputs.version }} (alpha) with Grotto, its signer.
            Packages are built for x86_64 and aarch64 (amd64/arm64). Jobs that failed have no file here: deb (all releases) ${{ needs.deb.result }}, rpm ${{ needs.rpm.result }}, arch ${{ needs.arch.result }}, flatpak ${{ needs.flatpak.result }}, nix ${{ needs.nix.result }}.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
