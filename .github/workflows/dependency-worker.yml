name: Dependency profile worker
on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      profile:
        type: string
        required: true
      plan_id:
        type: string
        required: true
permissions:
  contents: read
jobs:
  execute:
    runs-on: ${{ (inputs.profile == 'libgo.macos.asan' || inputs.profile == 'core.macos.asan') && 'macos-latest' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      REQUESTED_SHA: ${{ inputs.sha }}
      PROFILE: ${{ inputs.profile }}
      PLAN_ID: ${{ inputs.plan_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Verify exact checkout
        run: python3 .github/workflows/dependency_contract.py verify --sha "$REQUESTED_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: dependency-plan-${{ inputs.plan_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency
      - name: Verify selected lane and supported runner
        run: |
          python3 - <<'PY'
          import json, os, sys, platform
          sys.path.insert(0, 'scripts')
          import test_selection as s
          p = s.read_json(os.environ['RUNNER_TEMP'] + '/dependency/plan.json')
          policy = s.load_inventory('tests/selection/inventory.json')
          s.validate_plan(p, policy)
          s.require(p['plan_id'] == os.environ['PLAN_ID'] and p['tested_sha'] == os.environ['REQUESTED_SHA'], 'worker plan identity mismatch')
          s.require(os.environ['PROFILE'] in p['expected_lane_ids'], 'worker was not selected')
          profile = policy['profiles'][os.environ['PROFILE']]
          actual_platform = {'Darwin': 'macos', 'Linux': 'linux'}.get(platform.system())
          s.require(profile['platform'] == actual_platform and profile['architecture'] == platform.machine(), 'runner/profile mismatch')
          PY
      - name: Install Linux profile prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config clang lld python3 \
            libjansson-dev libsecp256k1-dev libwebsockets-dev libsodium-dev \
            libssl-dev libcurl4-openssl-dev libglib2.0-dev libsoup-3.0-dev \
            libjson-glib-dev libgit2-dev libnsync-dev libgtk-4-dev libadwaita-1-dev \
            libsecret-1-dev libgcrypt20-dev libqrencode-dev libsqlite3-dev \
            libsqlcipher-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libzbar-dev libpeas-dev blueprint-compiler xvfb dbus-x11
      - name: Install existing native standalone libgo prerequisites
        if: runner.os == 'macOS' && inputs.profile == 'libgo.macos.asan'
        run: brew install ninja libsoup@3 nsync
      - name: Install native root ASan prerequisites
        if: runner.os == 'macOS' && inputs.profile == 'core.macos.asan'
        run: |
          brew install ninja pkg-config jansson secp256k1 libwebsockets libsodium openssl@3 libsoup@3 nsync flatcc json-glib libgit2 dbus
          command -v dbus-daemon
      - name: Resolve, audit, build and execute exact selected checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dependency/receipts/$PROFILE"
          wrapper=(env)
          if [[ "$RUNNER_OS" == Linux ]]; then wrapper=(xvfb-run -a dbus-run-session --); fi
          "${wrapper[@]}" python3 scripts/test-plan.py run \
            --plan "$RUNNER_TEMP/dependency/plan.json" --profile "$PROFILE" \
            --build-dir "$RUNNER_TEMP/dependency-build" --configure --phase all --parallel 2 \
            --evidence-dir "$RUNNER_TEMP/dependency/evidence" \
            --output "$RUNNER_TEMP/dependency/receipts/$PROFILE/receipt.json" \
            2>&1 | tee "$RUNNER_TEMP/dependency/receipts/$PROFILE/worker.log"
      # The CLI consumes the exact profile args/environment/phase metadata from the plan's
      # inventory. Unsupported runtimes/live-peer lifecycles fail only this selected lane;
      # neither a failed command nor a missing receipt is promoted to success.
      - name: Retain incomplete evidence on failure or cancellation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-receipt-${{ inputs.plan_id }}-${{ inputs.profile }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency/receipts
          if-no-files-found: warn
      - name: Retain resolved plans and raw backend evidence separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-evidence-${{ inputs.plan_id }}-${{ inputs.profile }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dependency/evidence
            ${{ runner.temp }}/dependency-build/nostrc-test-inventory*
          if-no-files-found: warn
