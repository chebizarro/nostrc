name: Dependency profile worker
on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      profile:
        type: string
        required: true
      plan_id:
        type: string
        required: true
permissions:
  contents: read
jobs:
  execute:
    runs-on: ${{ (inputs.profile == 'libgo.macos.asan' || inputs.profile == 'core.macos.asan') && 'macos-latest' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      REQUESTED_SHA: ${{ inputs.sha }}
      PROFILE: ${{ inputs.profile }}
      PLAN_ID: ${{ inputs.plan_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Verify exact checkout
        run: python3 .github/workflows/dependency_contract.py verify --sha "$REQUESTED_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: dependency-plan-${{ inputs.plan_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency
      - name: Verify selected lane and supported runner
        run: |
          python3 - <<'PY'
          import json, os, sys, platform
          sys.path.insert(0, 'scripts')
          import test_selection as s
          p = s.read_json(os.environ['RUNNER_TEMP'] + '/dependency/plan.json')
          policy = s.load_inventory('tests/selection/inventory.json')
          s.validate_plan(p, policy)
          s.require(p['plan_id'] == os.environ['PLAN_ID'] and p['tested_sha'] == os.environ['REQUESTED_SHA'], 'worker plan identity mismatch')
          s.require(os.environ['PROFILE'] in p['expected_lane_ids'], 'worker was not selected')
          profile = policy['profiles'][os.environ['PROFILE']]
          actual_platform = {'Darwin': 'macos', 'Linux': 'linux'}.get(platform.system())
          s.require(profile['platform'] == actual_platform and profile['architecture'] == platform.machine(), 'runner/profile mismatch')
          # The provisioned signer fixture exists only inside the outer pidns
          # gate: any profile authoring signer_endpoint (including sanitizer
          # variants) takes that route, never ambient wrapper services; so do
          # original MDK image/peer lanes, whose host tree only pidns owns.
          route = 'pidns' if ('signer_endpoint' in profile.get('capabilities', [])
                              or profile.get('execution_domain') == 'mdk_original_linux_v1') else 'plan'
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('DEPENDENCY_ROUTE=' + route + '\n')
          PY
      - name: Install Linux profile prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build meson pkg-config clang lld python3 python3-pip curl \
            libjansson-dev libsecp256k1-dev libwebsockets-dev libsodium-dev \
            libssl-dev libcurl4-openssl-dev libglib2.0-dev libsoup-3.0-dev \
            libjson-glib-dev libgit2-dev libnsync-dev libgtk-4-dev libadwaita-1-dev \
            libsecret-1-dev libgcrypt20-dev libqrencode-dev libsqlite3-dev libmicrohttpd-dev \
            libsqlcipher-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libzbar-dev libpeas-2-dev blueprint-compiler xvfb xauth dbus-x11 dbus-bin \
            gettext locales desktop-file-utils appstream python3-gi gnome-keyring \
            libxml2-dev at-spi2-core nodejs \
            glib-networking gjs adwaita-icon-theme librsvg2-common \
            gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav
          sudo localedef -i en_US -f UTF-8 en_US.UTF-8
          # The default root app requires the libpeas-2 ABI, not libpeas-1.0.
          pkg-config --modversion libpeas-2
      - name: Select reviewed ordinary profile tools
        if: runner.os == 'Linux' && (inputs.profile == 'groundhog.linux' || inputs.profile == 'grotto.linux')
        run: |
          set -euo pipefail
          # Hosted PATH also contains newer CMake/Ninja; apt installation alone
          # does not select the distro tools bound by the exact-33 review.
          tool_bin="$RUNNER_TEMP/dependency-ordinary-tools"
          mkdir "$tool_bin"
          for tool in cmake ctest cpack ninja; do
            test -x "/usr/bin/$tool"
            ln -s "/usr/bin/$tool" "$tool_bin/$tool"
            "$tool_bin/$tool" --version
          done
          # Only these tools precede PATH: keep pinned Blueprint and other setup.
          # The selector still checks the full reviewed toolchain fingerprint.
          echo "$tool_bin" >> "$GITHUB_PATH"
      - name: Go toolchain for ordinary runtime peers
        if: runner.os == 'Linux' && (inputs.profile == 'groundhog.linux' || inputs.profile == 'grotto.linux')
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Install pinned nak for ordinary runtime peers
        if: runner.os == 'Linux' && (inputs.profile == 'groundhog.linux' || inputs.profile == 'grotto.linux')
        run: |
          set -euo pipefail
          go install -ldflags='-X main.version=v0.19.7' github.com/fiatjaf/nak@v0.19.7
          tool_bin="$(go env GOPATH)/bin"
          test -x "$tool_bin/nak"
          "$tool_bin/nak" --version
          echo "$tool_bin" >> "$GITHUB_PATH"
      - name: Verify ordinary peer and keyring executable setup
        if: runner.os == 'Linux' && (inputs.profile == 'groundhog.linux' || inputs.profile == 'grotto.linux')
        run: python3 .github/workflows/dependency_contract.py ordinary-tools --sha "$REQUESTED_SHA"
      # Both original MDK profiles author the nak capability for their signer
      # producers. Same pinned toolchain/module as the ordinary peers, but in
      # disjoint steps: the ordinary-only steps and their verifier stay ordinary.
      - name: Go toolchain for original MDK signer producers
        if: runner.os == 'Linux' && (inputs.profile == 'groundhog.mdk08' || inputs.profile == 'groundhog.mdk011')
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Install pinned nak for original MDK signer producers
        if: runner.os == 'Linux' && (inputs.profile == 'groundhog.mdk08' || inputs.profile == 'groundhog.mdk011')
        run: |
          set -euo pipefail
          go install -ldflags='-X main.version=v0.19.7' github.com/fiatjaf/nak@v0.19.7
          tool_bin="$(go env GOPATH)/bin"
          test -x "$tool_bin/nak"
          version="$("$tool_bin/nak" --version 2>&1)"
          printf '%s\n' "$version"
          # Same pin check as dependency_contract.py's ordinary nak verifier.
          printf '%s\n' "$version" | grep -Eq '(^|[[:space:]])v?0\.19\.7([[:space:]]|$)'
          echo "$tool_bin" >> "$GITHUB_PATH"
      - name: Install pinned Blueprint compiler for application profiles
        if: runner.os == 'Linux' && (inputs.profile == 'core.linux' || inputs.profile == 'core.linux.asan' || startsWith(inputs.profile, 'grotto.linux') || inputs.profile == 'groundhog.linux' || inputs.profile == 'groundhog.mdk08' || inputs.profile == 'groundhog.mdk011')
        run: |
          set -euo pipefail
          curl -fL https://download.gnome.org/sources/blueprint-compiler/0.22/blueprint-compiler-0.22.2.tar.xz -o "$RUNNER_TEMP/blueprint.tar.xz"
          echo "231d72efbac931c235ac3e022fe94982095c20d88721d9a8dcf60152f2017e07  $RUNNER_TEMP/blueprint.tar.xz" | sha256sum -c
          mkdir "$RUNNER_TEMP/blueprint"
          tar -xJf "$RUNNER_TEMP/blueprint.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/blueprint"
          meson setup "$RUNNER_TEMP/blueprint-build" "$RUNNER_TEMP/blueprint" --prefix=/usr/local \
            -Dpython.purelibdir="$(python3 -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          meson compile -C "$RUNNER_TEMP/blueprint-build"
          sudo meson install -C "$RUNNER_TEMP/blueprint-build"
          blueprint-compiler --version | grep -x 0.22.2
      - name: Match standalone libgo Linux CMake toolchain
        if: runner.os == 'Linux' && inputs.profile == 'libgo.linux.asan'
        run: |
          python3 -m pip install --break-system-packages 'cmake==3.31.6'
          # The pip entrypoint is a Python launcher; CMake records its real binary.
          # Select that same binary for configure/build rather than weakening identity checks.
          python3 -c 'import cmake; print(cmake.CMAKE_BIN_DIR)' >> "$GITHUB_PATH"
      - name: Install matching Groundhog sanitizer symbols
        if: runner.os == 'Linux' && inputs.profile == 'groundhog.linux.sanitizers'
        run: |
          set -euo pipefail
          version="$(dpkg-query -W -f='${Version}' libsecret-1-0)"
          arch="$(dpkg --print-architecture)"
          curl --fail --location \
            "https://ddebs.ubuntu.com/ubuntu/pool/main/libs/libsecret/libsecret-1-0-dbgsym_${version}_${arch}.ddeb" \
            --output "$RUNNER_TEMP/libsecret-dbgsym.ddeb"
          sudo dpkg-deb --extract "$RUNNER_TEMP/libsecret-dbgsym.ddeb" /
      - name: Matching third-party symbols for narrow GUI LSan exceptions
        if: runner.os == 'Linux' && inputs.profile == 'grotto.linux.asan_ubsan'
        run: |
          set -eu
          # Same packages as linux-ci.Dockerfile (nostrc-ydtdf / nostrc-ojtu3).
          sudo apt-get install -y --no-install-recommends ubuntu-dbgsym-keyring
          for suite in noble noble-updates noble-proposed; do
            echo "deb [signed-by=/usr/share/keyrings/ubuntu-dbgsym-keyring.gpg] http://ddebs.ubuntu.com $suite main universe"
          done | sudo tee /etc/apt/sources.list.d/ddebs.list
          sudo apt-get update
          gtk_version="$(dpkg-query -W -f='${Version}' libgtk-4-1)"
          if ! apt-cache madison libgtk-4-1-dbgsym | grep -qF "| $gtk_version |"; then
            # Noble updates' 4.14.5+ds-0ubuntu0.10 has no amd64 dbgsym.
            # Keep GTK runtime, headers and tools at a version with real symbols.
            gtk_version="$(apt-cache policy libgtk-4-1-dbgsym | awk '/Candidate:/ {print $2}')"
            test -n "$gtk_version"
            test "$gtk_version" != '(none)'
            echo "::warning::Installed GTK has no matching dbgsym; using GTK $gtk_version with matching symbols for sanitizer coverage"
            sudo apt-get install -y --no-install-recommends --no-remove --allow-downgrades \
              "libgtk-4-1=$gtk_version" "libgtk-4-common=$gtk_version" \
              "libgtk-4-dev=$gtk_version" "libgtk-4-bin=$gtk_version" \
              "gir1.2-gtk-4.0=$gtk_version" "libgtk-4-media-gstreamer=$gtk_version"
          fi
          set --
          for package in libfontconfig1 libgtk-4-1 libglib2.0-0t64 libpangoft2-1.0-0; do
            version="$(dpkg-query -W -f='${Version}' "$package")"
            echo "Required symbols: $package-dbgsym=$version"
            set -- "$@" "$package-dbgsym=$version"
          done
          # Exact dependencies fail closed; never skip symbols or widen suppressions.
          sudo apt-get install -y --no-install-recommends --no-remove "$@"
      - name: Install existing native standalone libgo prerequisites
        if: runner.os == 'macOS' && inputs.profile == 'libgo.macos.asan'
        run: brew install ninja libsoup@3 nsync
      - name: Install native root ASan prerequisites
        if: runner.os == 'macOS' && inputs.profile == 'core.macos.asan'
        run: |
          brew install ninja pkg-config jansson secp256k1 libwebsockets libsodium openssl@3 libsoup@3 nsync flatcc json-glib libgit2 dbus
          command -v dbus-daemon
      - name: Provision per-job namespace-custody AppArmor profile
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          case "$PROFILE:${DEPENDENCY_ROUTE:-plan}" in
            static.policy:*|core.linux:*|grotto.linux:*|groundhog.linux:*|homed.linux.ci:*|*:pidns)
              # Only namespace-custody lanes; kernel settings are never changed.
              bash tests/selection/namespace_apparmor_setup.sh "$RUNNER_TEMP/dependency/namespace-apparmor" ;;
            *) echo "not a namespace-custody lane: no AppArmor provisioning" ;;
          esac
      - name: Prepare source-bound provisioned policy image
        if: runner.os == 'Linux' && inputs.profile == 'static.policy'
        shell: bash
        run: |
          python3 scripts/test_selection_policy.py prepare-image --source "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/dependency/policy-testhost-setup.json"
      - name: Resolve, audit, build and execute exact selected checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dependency/receipts/$PROFILE"
          lane="$PROFILE"
          # DEPENDENCY_ROUTE comes from the validated profile (verify step).
          if [[ "${DEPENDENCY_ROUTE:-plan}" == pidns ]]; then lane=pidns; fi
          case "$lane" in
            pidns|homed.linux.ci|core.linux|grotto.linux|groundhog.linux)
              # The outer gate owns private services and post-namespace-exit
              # sealing. Unsupported runner kernels retain refusal, not green.
              # The per-job profile flows from its retained journal into the
              # helper argv; without provisioning the helper keeps its refusal.
              apparmor_args=()
              apparmor_setup="$RUNNER_TEMP/dependency/namespace-apparmor/setup.json"
              if [[ -f "$apparmor_setup" ]]; then
                apparmor_args=(--namespace-apparmor-profile
                  "$(python3 -I -c 'import json, sys; print(json.load(open(sys.argv[1]))["name"])' "$apparmor_setup")")
              fi
              set +e
              bash scripts/test-gate.sh --head "$REQUESTED_SHA" \
                --plan "$RUNNER_TEMP/dependency/plan.json" --profile "$PROFILE" \
                --native-custody pidns ${apparmor_args[@]+"${apparmor_args[@]}"} \
                --evidence-dir "$RUNNER_TEMP/dependency/evidence" \
                2>&1 | tee "$RUNNER_TEMP/dependency/receipts/$PROFILE/worker.log"
              gate_status=${PIPESTATUS[0]}
              set -e
              GATE_STATUS="$gate_status" python3 - <<'PY'
          import json, os, shutil, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from test_selection_services import verify_native_public_receipt
          base = Path(os.environ['RUNNER_TEMP']) / 'dependency'
          matches = []
          for path in (base / 'evidence').glob('*/0/lane-*/native-receipt.json'):
              raw = json.loads(path.read_text())
              if (raw.get('plan_id') == os.environ['PLAN_ID'] and raw.get('profile') == os.environ['PROFILE']
                      and raw.get('source_identity') == dict(kind='committed', sha=os.environ['REQUESTED_SHA'])):
                  verify_native_public_receipt(raw)
                  matches.append(path)
          if len(matches) > 1 or (not matches and os.environ['GATE_STATUS'] == '0'):
              raise SystemExit('missing/ambiguous exact-plan retained native receipt')
          if matches:
              shutil.copyfile(matches[0], base / 'receipts' / os.environ['PROFILE'] / 'receipt.json')
          PY
              exit "$gate_status"
              ;;
          esac
          parallel_args=(--parallel 2)
          # Preserve Grotto's authored build2/test1 without changing legacy lanes.
          case "$PROFILE" in
            grotto.linux*) parallel_args=(--build-parallel 2 --test-parallel 1) ;;
          esac
          wrapper=(env)
          if [[ "$RUNNER_OS" == Linux ]]; then
            wrapper=(xvfb-run -a dbus-run-session --)
            case "$PROFILE" in
              static.policy) wrapper=(env) ;;
              grotto.linux*) wrapper=(dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24') ;;
            esac
          fi
          "${wrapper[@]}" python3 scripts/test-plan.py run \
            --plan "$RUNNER_TEMP/dependency/plan.json" --profile "$PROFILE" \
            --build-dir "$RUNNER_TEMP/dependency-build" --configure --phase all "${parallel_args[@]}" \
            --evidence-dir "$RUNNER_TEMP/dependency/evidence" \
            --output "$RUNNER_TEMP/dependency/receipts/$PROFILE/receipt.json" \
            2>&1 | tee "$RUNNER_TEMP/dependency/receipts/$PROFILE/worker.log"
      # The CLI consumes the exact profile args/environment/phase metadata from the plan's
      # inventory. Unsupported runtimes/live-peer lifecycles fail only this selected lane;
      # neither a failed command nor a missing receipt is promoted to success.
      - name: Remove only this job's AppArmor profile after its consumers exited
        if: always() && runner.os == 'Linux'
        shell: bash
        # Unconditional (failure/cancellation too); a never-provisioned lane
        # records not_provisioned. Any surviving consumer or policy delta fails.
        run: bash tests/selection/namespace_apparmor_teardown.sh "$RUNNER_TEMP/dependency/namespace-apparmor"
      # Only after the pidns gate exited and the teardown above removed this job's
      # profile. Profiles without the authored normal contract are a no-op. The
      # raw receipt stays the lane receipt unless in-place AND relocated portable
      # requalification pass; then receipt.json is atomically replaced (raw bytes
      # kept as original-native-receipt.json and inside the sealed bundle).
      - name: Qualify normal lane after pidns exit and AppArmor teardown
        id: qualify
        if: success() && runner.os == 'Linux'
        shell: bash
        run: |
          python3 scripts/test_selection_execution.py worker-qualify --repo "$GITHUB_WORKSPACE" \
            --plan "$RUNNER_TEMP/dependency/plan.json" --profile "$PROFILE" \
            --evidence-root "$RUNNER_TEMP/dependency/evidence" \
            --apparmor-evidence "$RUNNER_TEMP/dependency/namespace-apparmor" \
            --receipts-dir "$RUNNER_TEMP/dependency/receipts/$PROFILE"
      # A lane that could provision the signer publishes its raw receipt/evidence
      # sets only after exact-token-checked qualification; otherwise (failure,
      # cancellation, refusal, scan failure, exposure, or this gate failing) both
      # stay unuploaded on the ephemeral worker and only nonsecret metadata is kept.
      - name: Decide signer-safe evidence publication
        id: publication
        if: always()
        shell: bash
        env:
          QUALIFY_OUTCOME: ${{ steps.qualify.outcome }}
        run: |
          set -euo pipefail
          decision=$(python3 scripts/test_selection_execution.py publication-gate --repo "$GITHUB_WORKSPACE" \
            --plan "$RUNNER_TEMP/dependency/plan.json" --plan-id "$PLAN_ID" --sha "$REQUESTED_SHA" \
            --profile "$PROFILE" --receipts-dir "$RUNNER_TEMP/dependency/receipts/$PROFILE" \
            --evidence-root "$RUNNER_TEMP/dependency/evidence" --qualify-outcome "$QUALIFY_OUTCOME" \
            --metadata "$RUNNER_TEMP/dependency/withheld/withheld.json")
          case "$decision" in
            publish=true|publish=false) echo "$decision" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
      - name: Retain incomplete evidence on failure or cancellation
        if: always() && steps.publication.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-receipt-${{ inputs.plan_id }}-${{ inputs.profile }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency/receipts
          if-no-files-found: warn
      - name: Retain resolved plans and raw backend evidence separately
        if: always() && steps.publication.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-evidence-${{ inputs.plan_id }}-${{ inputs.profile }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dependency/evidence
            ${{ runner.temp }}/dependency/ordinary-tool-setup.json
            ${{ runner.temp }}/dependency/policy-testhost-setup.json
            ${{ runner.temp }}/dependency/namespace-apparmor
            ${{ runner.temp }}/dependency/policy-image-*
            ${{ runner.temp }}/dependency-build/namespace-policy
            ${{ runner.temp }}/dependency-build/nostrc-test-inventory*
            ${{ runner.temp }}/dependency-build/nostrc-test-descriptors*
          if-no-files-found: warn
      - name: Record withheld signer-sensitive publication (nonsecret metadata only)
        if: always() && steps.publication.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-withheld-${{ inputs.plan_id }}-${{ inputs.profile }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dependency/withheld/withheld.json
          if-no-files-found: warn
