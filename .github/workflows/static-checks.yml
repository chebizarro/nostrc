name: Static checks

# Repository-wide checks that need no build. The pre-push gate
# (scripts/pre-push) runs the same scripts before every push.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: No call modifies a variable another argument uses
        # nostrc-td3b: argument evaluation order is unspecified; x86_64 GCC
        # goes right to left, so such a call breaks only on x86_64 runners.
        run: python3 scripts/check-unsequenced-args.py --self-test

      - name: Local Linux image mirrors the CI package lists
        run: python3 scripts/check-linux-ci-packages.py --self-test

      - name: Pre-push gate behaviour
        run: bash scripts/test-pre-push.sh

      - name: Linux gate smoke run keeps and counts reruns
        # nostrc-16yi: a rerun that passes still prints the first failure.
        run: bash scripts/test-linux-gate-smoke.sh
