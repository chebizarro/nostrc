name: Static checks

# Operational regressions and cheap guards. Universal profile/custody
# qualification is an explicitly dispatched diagnostic, not ordinary CI.
on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      artifact_prefix:
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify requested checkout
        if: inputs.sha != ''
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"

      - name: Package boundary guard regressions
        run: python3 scripts/test-package-boundaries.py
      - name: Package boundaries (shrinking baseline)
        run: scripts/check-package-boundaries.sh

      - name: Operational selection and workflow regressions
        run: python3 scripts/test-selection-operational.py

      - name: No call modifies a variable another argument uses
        run: python3 scripts/check-unsequenced-args.py --self-test
      - name: Every GUI test installs narrow GDK frame tolerance
        run: python3 scripts/check-gui-test-gdk-frame.py --self-test
      - name: Local Linux image mirrors the CI package lists
        run: python3 scripts/check-linux-ci-packages.py --self-test
      - name: Pre-push hook behaviour
        run: bash scripts/test-pre-push.sh
      - name: Opt-in full gate behaviour
        run: bash scripts/test-full-gate.sh
      - name: Linux gate smoke run keeps and counts reruns
        run: bash scripts/test-linux-gate-smoke.sh
      - name: Sanitizer gate reads the CI job and filters pushes
        run: bash scripts/test-sanitizer-gate.sh
      - name: Old signer names stay gone (W31)
        run: bash scripts/check-grotto-names.sh
      - name: Keychain guard self-test (nostrc-2hmd)
        run: bash scripts/test-check-macos-keychain.sh
