name: FIPS CI
on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      artifact_prefix:
        type: string
        default: ''
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    name: ${{ matrix.os }} • FIPS • ${{ matrix.configuration }}
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        configuration: [asan_ubsan, tsan, optimized]
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - name: Verify requested checkout
        if: inputs.sha != ''
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config clang libclang-rt-18-dev libjansson-dev libyaml-dev libsecp256k1-dev libsodium-dev libssl-dev libcurl4-openssl-dev libwebsockets-dev libglib2.0-dev libsoup-3.0-dev libnsync-dev libnftables-dev libncurses-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm cmake ninja pkg-config jansson libyaml secp256k1 libsodium openssl@3 curl libwebsockets glib libsoup@3 nsync
          {
            echo "CC=$(brew --prefix llvm)/bin/clang"
            echo "CXX=$(brew --prefix llvm)/bin/clang++"
            echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig:${PKG_CONFIG_PATH}"
            echo "ASAN_OPTIONS=detect_leaks=0:strict_string_checks=1:halt_on_error=1"
          } >> "$GITHUB_ENV"
      - name: Configure
        shell: bash
        run: |
          args=(-DCMAKE_BUILD_TYPE=Debug -DGO_WARNINGS_AS_ERRORS=ON)
          case '${{ matrix.configuration }}' in
            asan_ubsan) args+=(-DGO_ENABLE_ASAN=ON -DGO_ENABLE_UBSAN=ON -DFIPS_ENABLE_FUZZERS=ON) ;;
            tsan) args+=(-DGO_ENABLE_TSAN=ON) ;;
            optimized) args+=(-DCMAKE_BUILD_TYPE=Release '-DCMAKE_C_FLAGS_RELEASE=-O2 -DNDEBUG') ;;
          esac
          cmake -S . -B build -G Ninja "${args[@]}" \
            -DBUILD_FIPS=ON -DBUILD_APPS=OFF -DBUILD_RELAYD=OFF \
            -DBUILD_LIBHANAMI=OFF -DBUILD_LIBMARMOT=OFF -DBUILD_MARMOT_GOBJECT=OFF \
            -DBUILD_NOSTR_GOBJECT=OFF -DBUILD_NOSTR_GTK=OFF -DSIGNET_ENABLE=OFF \
            -DWITH_NOSTRDB=OFF -DLIBNOSTR_WITH_NOSTRDB=OFF
      - name: Build FIPS targets
        shell: bash
        run: |
          targets=(fipsd fipsd_tests)
          if [[ "$RUNNER_OS" == Linux ]]; then targets+=(fips-gateway); fi
          if [[ '${{ matrix.configuration }}' != tsan ]]; then
            targets+=(fips_core_skeleton_test fips_core_host_test)
          fi
          if [[ '${{ matrix.configuration }}' == asan_ubsan ]]; then targets+=(fips_fuzz_host fips_fuzz_codec fips_fuzz_identity fips_fuzz_aead fips_fuzz_coord fips_fuzz_link fips_fuzz_stp fips_fuzz_bloom fips_fuzz_fmp fips_fuzz_handshake fips_fuzz_routing fips_fuzz_lookup fips_fuzz_fsp fips_fuzz_session fips_fuzz_mmp fips_fuzz_probe fips_fuzz_rekey fips_fuzz_path fips_fuzz_rekey_profile fipsd_fuzz_control fipsd_fuzz_config); fi
          cmake --build build --parallel 3 --target "${targets[@]}"
      - name: Test FIPS
        shell: bash
        run: |
          args=()
          # Core-only tests are intentionally not a threading qualification.
          if [[ '${{ matrix.configuration }}' == tsan ]]; then args+=(-E '^FipsCore'); fi
          ctest --test-dir build -R '^Fips' "${args[@]}" --no-tests=error --output-on-failure
      - name: Fuzz smoke (10 seconds per target)
        if: matrix.configuration == 'asan_ubsan'
        run: |
          mkdir -p build/corpus build/fuzz-artifacts
          for target in fips_fuzz_host fips_fuzz_codec fips_fuzz_identity fips_fuzz_aead fips_fuzz_coord fips_fuzz_link fips_fuzz_stp fips_fuzz_bloom fips_fuzz_fmp fips_fuzz_handshake fips_fuzz_routing fips_fuzz_lookup fips_fuzz_fsp fips_fuzz_session fips_fuzz_mmp fips_fuzz_probe fips_fuzz_rekey fips_fuzz_path fips_fuzz_rekey_profile fipsd_fuzz_control fipsd_fuzz_config; do
            component=libfips-core
            if [[ "$target" == fipsd_* ]]; then component=fipsd; fi
            if [[ -d "$component/fuzz/corpus/$target" ]]; then cp -R "$component/fuzz/corpus/$target" build/corpus/; else mkdir -p "build/corpus/$target"; fi
            "build/$component/fuzz/$target" -max_total_time=10 -timeout=5 -artifact_prefix=build/fuzz-artifacts/ "build/corpus/$target"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ inputs.artifact_prefix }}fips-${{ matrix.os }}-${{ matrix.configuration }}
          path: |
            build/Testing/Temporary/
            build/fuzz-artifacts/
  interop-udp:
    name: ${{ matrix.os }} • FIPS • C<->Rust UDP interop
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - name: Verify requested checkout
        if: inputs.sha != ''
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
      # The pin lives in one place: libfips-core/UPSTREAM.md.
      - name: Read the upstream pin
        id: pin
        run: |
          pin=$(sed -n 's/^Pinned commit: .\([0-9a-f]\{40\}\).*/\1/p' libfips-core/UPSTREAM.md)
          test -n "$pin"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      - name: Check out upstream FIPS at the pin
        uses: actions/checkout@v4
        with:
          repository: jmcorgan/fips
          ref: ${{ steps.pin.outputs.pin }}
          path: upstream-fips
          persist-credentials: false
      - name: Verify the upstream checkout
        env:
          PIN: ${{ steps.pin.outputs.pin }}
        run: test "$(git -C upstream-fips rev-parse HEAD)" = "$PIN"
      # The built daemon is cached on OS, architecture, pin and toolchain; a hit
      # skips the Rust build entirely, a miss rebuilds from the pinned source.
      - name: Restore the pinned Rust daemon
        id: daemon
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fips-rust-target/release/fips
          key: fips-daemon-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.pin }}-${{ hashFiles('upstream-fips/rust-toolchain.toml') }}-v1
      - name: Restore the cargo registry
        if: steps.daemon.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('upstream-fips/Cargo.lock') }}
      - name: Build the pinned Rust daemon
        if: steps.daemon.outputs.cache-hit != 'true'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fips-rust-target
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' upstream-fips/rust-toolchain.toml)
          # upstream fips links libdbus (BLE) on Linux; pkg-config must find dbus-1
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y libdbus-1-dev pkg-config
          fi
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal
          cd upstream-fips
          cargo "+$channel" build --locked --release --bin fips
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config clang libclang-rt-18-dev libjansson-dev libyaml-dev libsecp256k1-dev libsodium-dev libssl-dev libcurl4-openssl-dev libwebsockets-dev libglib2.0-dev libsoup-3.0-dev libnsync-dev libnftables-dev libncurses-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm cmake ninja pkg-config jansson libyaml secp256k1 libsodium openssl@3 curl libwebsockets glib libsoup@3 nsync
          {
            echo "CC=$(brew --prefix llvm)/bin/clang"
            echo "CXX=$(brew --prefix llvm)/bin/clang++"
            echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig:${PKG_CONFIG_PATH}"
            echo "ASAN_OPTIONS=detect_leaks=0:strict_string_checks=1:halt_on_error=1"
          } >> "$GITHUB_ENV"
      - name: Configure (ASan/UBSan)
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DGO_WARNINGS_AS_ERRORS=ON \
            -DGO_ENABLE_ASAN=ON -DGO_ENABLE_UBSAN=ON \
            -DBUILD_FIPS=ON -DBUILD_APPS=OFF -DBUILD_RELAYD=OFF \
            -DBUILD_LIBHANAMI=OFF -DBUILD_LIBMARMOT=OFF -DBUILD_MARMOT_GOBJECT=OFF \
            -DBUILD_NOSTR_GOBJECT=OFF -DBUILD_NOSTR_GTK=OFF -DSIGNET_ENABLE=OFF \
            -DWITH_NOSTRDB=OFF -DLIBNOSTR_WITH_NOSTRDB=OFF \
            "-DFIPSD_UDP_INTEROP_RUST_BINARY=${RUNNER_TEMP}/fips-rust-target/release/fips"
      - name: Build fipsd
        run: cmake --build build --parallel 3 --target fipsd fipsd_test_tmpdir_run
      - name: C<->Rust UDP interop (both roles, IPv4 and IPv6)
        run: ctest --test-dir build -R '^FipsdInteropUdp' --no-tests=error --output-on-failure
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ inputs.artifact_prefix }}fips-interop-udp-${{ matrix.os }}
          path: build/Testing/Temporary/
  nightly-fuzz:
    name: Linux • FIPS nightly fuzz (60 seconds per target)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config clang libclang-rt-18-dev libjansson-dev libyaml-dev libsecp256k1-dev libsodium-dev libssl-dev libcurl4-openssl-dev libwebsockets-dev libglib2.0-dev libsoup-3.0-dev libnsync-dev libnftables-dev libncurses-dev
      - name: Configure fuzzers
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DGO_WARNINGS_AS_ERRORS=ON -DGO_ENABLE_ASAN=ON -DGO_ENABLE_UBSAN=ON -DFIPS_ENABLE_FUZZERS=ON \
            -DBUILD_FIPS=ON -DBUILD_APPS=OFF -DBUILD_RELAYD=OFF \
            -DBUILD_LIBHANAMI=OFF -DBUILD_LIBMARMOT=OFF -DBUILD_MARMOT_GOBJECT=OFF \
            -DBUILD_NOSTR_GOBJECT=OFF -DBUILD_NOSTR_GTK=OFF -DSIGNET_ENABLE=OFF \
            -DWITH_NOSTRDB=OFF -DLIBNOSTR_WITH_NOSTRDB=OFF
      - run: cmake --build build --parallel 3 --target fips_fuzz_host fips_fuzz_codec fips_fuzz_identity fips_fuzz_aead fips_fuzz_coord fips_fuzz_link fips_fuzz_stp fips_fuzz_bloom fips_fuzz_fmp fips_fuzz_handshake fips_fuzz_routing fips_fuzz_lookup fips_fuzz_fsp fips_fuzz_session fips_fuzz_mmp fips_fuzz_probe fips_fuzz_rekey fips_fuzz_path fips_fuzz_rekey_profile fipsd_fuzz_control fipsd_fuzz_config
      - name: Fuzz (60 seconds per target)
        run: |
          mkdir -p build/corpus build/fuzz-artifacts
          for target in fips_fuzz_host fips_fuzz_codec fips_fuzz_identity fips_fuzz_aead fips_fuzz_coord fips_fuzz_link fips_fuzz_stp fips_fuzz_bloom fips_fuzz_fmp fips_fuzz_handshake fips_fuzz_routing fips_fuzz_lookup fips_fuzz_fsp fips_fuzz_session fips_fuzz_mmp fips_fuzz_probe fips_fuzz_rekey fips_fuzz_path fips_fuzz_rekey_profile fipsd_fuzz_control fipsd_fuzz_config; do
            component=libfips-core
            if [[ "$target" == fipsd_* ]]; then component=fipsd; fi
            if [[ -d "$component/fuzz/corpus/$target" ]]; then cp -R "$component/fuzz/corpus/$target" build/corpus/; else mkdir -p "build/corpus/$target"; fi
            "build/$component/fuzz/$target" -max_total_time=60 -timeout=5 -artifact_prefix=build/fuzz-artifacts/ "build/corpus/$target"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fips-nightly-fuzz-crashes
          path: build/fuzz-artifacts/
  chaos-netns:
    name: Linux • FIPS nightly netns chaos (link flap, MTU, NAT traversal, netem)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      # The pin lives in one place: libfips-core/UPSTREAM.md.
      - name: Read the upstream pin
        id: pin
        run: |
          pin=$(sed -n 's/^Pinned commit: .\([0-9a-f]\{40\}\).*/\1/p' libfips-core/UPSTREAM.md)
          test -n "$pin"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      - name: Check out upstream FIPS at the pin
        uses: actions/checkout@v4
        with:
          repository: jmcorgan/fips
          ref: ${{ steps.pin.outputs.pin }}
          path: upstream-fips
          persist-credentials: false
      - name: Verify the upstream checkout
        env:
          PIN: ${{ steps.pin.outputs.pin }}
        run: test "$(git -C upstream-fips rev-parse HEAD)" = "$PIN"
      # The built daemon is cached on OS, architecture, pin and toolchain; a hit
      # skips the Rust build entirely, a miss rebuilds from the pinned source.
      - name: Restore the pinned Rust daemon
        id: daemon
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fips-rust-target/release/fips
          key: fips-daemon-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.pin }}-${{ hashFiles('upstream-fips/rust-toolchain.toml') }}-v1
      - name: Restore the cargo registry
        if: steps.daemon.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('upstream-fips/Cargo.lock') }}
      - name: Build the pinned Rust daemon
        if: steps.daemon.outputs.cache-hit != 'true'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fips-rust-target
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' upstream-fips/rust-toolchain.toml)
          # upstream fips links libdbus (BLE) on Linux; pkg-config must find dbus-1
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y libdbus-1-dev pkg-config
          fi
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal
          cd upstream-fips
          cargo "+$channel" build --locked --release --bin fips
      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config clang libclang-rt-18-dev libjansson-dev libyaml-dev libsecp256k1-dev libsodium-dev libssl-dev libcurl4-openssl-dev libwebsockets-dev libglib2.0-dev libsoup-3.0-dev libnsync-dev libnftables-dev libncurses-dev
      - name: Install the chaos lab tools (iproute2, nftables, iperf3, conntrack)
        run: sudo apt-get install -y iproute2 nftables iperf3 conntrack
      - name: Configure (ASan/UBSan)
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DGO_WARNINGS_AS_ERRORS=ON \
            -DGO_ENABLE_ASAN=ON -DGO_ENABLE_UBSAN=ON \
            -DBUILD_FIPS=ON -DBUILD_APPS=OFF -DBUILD_RELAYD=OFF \
            -DBUILD_LIBHANAMI=OFF -DBUILD_LIBMARMOT=OFF -DBUILD_MARMOT_GOBJECT=OFF \
            -DBUILD_NOSTR_GOBJECT=OFF -DBUILD_NOSTR_GTK=OFF -DSIGNET_ENABLE=OFF \
            -DWITH_NOSTRDB=OFF -DLIBNOSTR_WITH_NOSTRDB=OFF
      - name: Build fipsd
        run: cmake --build build --parallel 3 --target fipsd
      # Root for ip netns, nftables and tc; -E keeps the sanitizer options.
      - name: Chaos scenarios in network namespaces (C<->C and C<->Rust)
        env:
          FIPSD_UDP_INTEROP_RUST_BINARY: ${{ runner.temp }}/fips-rust-target/release/fips
        run: |
          sudo -E env "PATH=$PATH" Testing/fips-chaos/run.sh --fipsd build/fipsd/fipsd \
            --rust "$FIPSD_UDP_INTEROP_RUST_BINARY" --output build/chaos-results
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fips-nightly-chaos-netns
          path: build/chaos-results/
  bench:
    name: Linux • FIPS Release performance regression
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang
      CXX: clang++
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - name: Verify requested checkout
        if: inputs.sha != ''
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
      # The pin lives in one place: libfips-core/UPSTREAM.md.
      - name: Read the upstream pin
        id: pin
        run: |
          pin=$(sed -n 's/^Pinned commit: .\([0-9a-f]\{40\}\).*/\1/p' libfips-core/UPSTREAM.md)
          test -n "$pin"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      - name: Check out upstream FIPS at the pin
        uses: actions/checkout@v4
        with:
          repository: jmcorgan/fips
          ref: ${{ steps.pin.outputs.pin }}
          path: upstream-fips
          persist-credentials: false
      - name: Verify the upstream checkout
        env:
          PIN: ${{ steps.pin.outputs.pin }}
        run: test "$(git -C upstream-fips rev-parse HEAD)" = "$PIN"
      # The built daemon is cached on OS, architecture, pin and toolchain; a hit
      # skips the Rust build entirely, a miss rebuilds from the pinned source.
      - name: Restore the pinned Rust daemon
        id: daemon
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fips-rust-target/release/fips
          key: fips-daemon-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.pin }}-${{ hashFiles('upstream-fips/rust-toolchain.toml') }}-v1
      - name: Restore the cargo registry
        if: steps.daemon.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('upstream-fips/Cargo.lock') }}
      - name: Build the pinned Rust daemon
        if: steps.daemon.outputs.cache-hit != 'true'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fips-rust-target
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' upstream-fips/rust-toolchain.toml)
          # upstream fips links libdbus (BLE) on Linux; pkg-config must find dbus-1
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y libdbus-1-dev pkg-config
          fi
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal
          cd upstream-fips
          cargo "+$channel" build --locked --release --bin fips
      - name: Verify the Rust baseline pin
        env:
          PIN: ${{ steps.pin.outputs.pin }}
        run: |
          python3 - <<'PYBASE'
          import json, os
          baseline = json.load(open('fipsd/tests/perf_baseline.json'))
          if baseline['rust_commit'] != os.environ['PIN']:
              raise SystemExit('UPSTREAM.md differs from the immutable Rust performance baseline')
          PYBASE
      - name: Read the immutable C baseline revision
        id: baseline
        run: |
          python3 - <<'PYBASE'
          import json, os, re
          baseline = json.load(open('fipsd/tests/perf_baseline.json'))
          commit = baseline['reference_commit']
          assert re.fullmatch(r'[0-9a-f]{40}', commit)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'commit={commit}\n')
          PYBASE
      - name: Check out the C baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.baseline.outputs.commit }}
          path: perf-reference
          submodules: recursive
          persist-credentials: false
      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config clang libclang-rt-18-dev libjansson-dev libyaml-dev libsecp256k1-dev libsodium-dev libssl-dev libcurl4-openssl-dev libwebsockets-dev libglib2.0-dev libsoup-3.0-dev libnsync-dev libnftables-dev libncurses-dev
      - name: Apply identical test-only workload to the reference
        # The baseline predates this harness. Never copy shipped source into it:
        # both builds measure the same current workloads against their own core.
        run: |
          cp libfips-core/bench/* perf-reference/libfips-core/bench/
          cp fipsd/tests/perf_native.c perf-reference/fipsd/tests/
          cat >> perf-reference/fipsd/tests/CMakeLists.txt <<'CMAKE'
          if(FIPS_ENABLE_BENCH)
            add_executable(fipsd_perf_native perf_native.c)
            target_link_libraries(fipsd_perf_native PRIVATE fipsnative_static Threads::Threads)
            set_target_properties(fipsd_perf_native PROPERTIES C_STANDARD 11 C_STANDARD_REQUIRED YES C_EXTENSIONS NO)
            apply_warnings(fipsd_perf_native)
            apply_sanitizers(fipsd_perf_native)
          endif()
          CMAKE
      - name: Build candidate and reference (Release, Werror)
        shell: bash
        run: |
          for source in "$PWD" "$PWD/perf-reference"; do
            cmake -S "$source" -B "$source/build-bench" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DGO_WARNINGS_AS_ERRORS=ON -DFIPS_ENABLE_BENCH=ON \
              -DBUILD_FIPS=ON -DBUILD_APPS=OFF -DBUILD_RELAYD=OFF \
              -DBUILD_LIBHANAMI=OFF -DBUILD_LIBMARMOT=OFF -DBUILD_MARMOT_GOBJECT=OFF \
              -DBUILD_NOSTR_GOBJECT=OFF -DBUILD_NOSTR_GTK=OFF -DSIGNET_ENABLE=OFF \
              -DWITH_NOSTRDB=OFF -DLIBNOSTR_WITH_NOSTRDB=OFF
            cmake --build "$source/build-bench" --parallel 3 --target fipsd fips_benches fipsd_perf_native
          done
      - name: Test the comparer (including injected 11 percent regression)
        run: python3 fipsd/tests/test_perf_compare.py
      - name: Measure three sequential runs per build
        env:
          BASELINE_COMMIT: ${{ steps.baseline.outputs.commit }}
          RUST_COMMIT: ${{ steps.pin.outputs.pin }}
        run: |
          python3 fipsd/tests/perf_run.py --build "$PWD/perf-reference/build-bench" \
            --rust "${{ runner.temp }}/fips-rust-target/release/fips" \
            --source-commit "$BASELINE_COMMIT" --rust-commit "$RUST_COMMIT" \
            --output "$PWD/bench-results/reference.json" \
            --work-dir "${{ runner.temp }}/fips-perf"
          python3 fipsd/tests/perf_run.py --build "$PWD/build-bench" \
            --rust "${{ runner.temp }}/fips-rust-target/release/fips" \
            --source-commit "$(git rev-parse HEAD)" --rust-commit "$RUST_COMMIT" \
            --output "$PWD/bench-results/candidate.json" \
            --work-dir "${{ runner.temp }}/fips-perf"
      - name: Enforce the baseline's 10 percent limit
        run: |
          python3 fipsd/tests/perf_compare.py bench-results/candidate.json \
            --baseline fipsd/tests/perf_baseline.json --reference bench-results/reference.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fips-bench-results
          path: |
            bench-results/
            fipsd/tests/perf_baseline.json
          if-no-files-found: error
