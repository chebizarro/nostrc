name: FIPS CI
on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
      artifact_prefix:
        type: string
        default: ''
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    name: ${{ matrix.os }} • FIPS • ${{ matrix.configuration }}
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        configuration: [asan_ubsan, tsan, optimized]
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - name: Verify requested checkout
        if: inputs.sha != ''
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config clang libclang-rt-18-dev libjansson-dev libyaml-dev libsecp256k1-dev libsodium-dev libssl-dev libcurl4-openssl-dev libwebsockets-dev libglib2.0-dev libsoup-3.0-dev libnsync-dev libnftables-dev libncurses-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm cmake ninja pkg-config jansson libyaml secp256k1 libsodium openssl@3 curl libwebsockets glib libsoup@3 nsync
          {
            echo "CC=$(brew --prefix llvm)/bin/clang"
            echo "CXX=$(brew --prefix llvm)/bin/clang++"
            echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig:${PKG_CONFIG_PATH}"
            echo "ASAN_OPTIONS=detect_leaks=0:strict_string_checks=1:halt_on_error=1"
          } >> "$GITHUB_ENV"
      - name: Configure
        shell: bash
        run: |
          args=(-DCMAKE_BUILD_TYPE=Debug -DGO_WARNINGS_AS_ERRORS=ON)
          case '${{ matrix.configuration }}' in
            asan_ubsan) args+=(-DGO_ENABLE_ASAN=ON -DGO_ENABLE_UBSAN=ON -DFIPS_ENABLE_FUZZERS=ON) ;;
            # TSan only sees locks it can instrument: a packaged nsync is opaque
            # to it, so every nsync-guarded access in fipsd/libnostr would be
            # reported. Build the vendored copy with -fsanitize=thread instead.
            tsan) args+=(-DGO_ENABLE_TSAN=ON -DNOSTR_USE_SYSTEM_NSYNC=OFF) ;;
            optimized) args+=(-DCMAKE_BUILD_TYPE=Release '-DCMAKE_C_FLAGS_RELEASE=-O2 -DNDEBUG') ;;
          esac
          cmake -S . -B build -G Ninja "${args[@]}" \
            -DBUILD_FIPS=ON -DBUILD_APPS=OFF -DBUILD_RELAYD=OFF \
            -DBUILD_LIBHANAMI=OFF -DBUILD_LIBMARMOT=OFF -DBUILD_MARMOT_GOBJECT=OFF \
            -DBUILD_NOSTR_GOBJECT=OFF -DBUILD_NOSTR_GTK=OFF -DSIGNET_ENABLE=OFF \
            -DWITH_NOSTRDB=OFF -DLIBNOSTR_WITH_NOSTRDB=OFF
      - name: Build FIPS targets
        shell: bash
        run: |
          targets=(fipsd fipsd_tests)
          if [[ "$RUNNER_OS" == Linux ]]; then targets+=(fips-gateway); fi
          if [[ '${{ matrix.configuration }}' != tsan ]]; then
            targets+=(fips_core_skeleton_test fips_core_host_test)
          fi
          if [[ '${{ matrix.configuration }}' == asan_ubsan ]]; then targets+=(fips_fuzz_host fips_fuzz_codec fips_fuzz_identity fips_fuzz_aead fips_fuzz_coord fips_fuzz_link fips_fuzz_stp fips_fuzz_bloom fips_fuzz_fmp fips_fuzz_handshake fips_fuzz_routing fips_fuzz_lookup fips_fuzz_fsp fips_fuzz_session fips_fuzz_mmp fips_fuzz_probe fips_fuzz_rekey fips_fuzz_path fips_fuzz_rekey_profile fipsd_fuzz_control fipsd_fuzz_config); fi
          cmake --build build --parallel 3 --target "${targets[@]}"
      - name: Test FIPS
        shell: bash
        run: |
          args=()
          # Core-only tests are intentionally not a threading qualification.
          if [[ '${{ matrix.configuration }}' == tsan ]]; then args+=(-E '^FipsCore'); fi
          ctest --test-dir build -R '^Fips' "${args[@]}" --no-tests=error --output-on-failure
      - name: Fuzz smoke (10 seconds per target)
        if: matrix.configuration == 'asan_ubsan'
        run: |
          mkdir -p build/corpus build/fuzz-artifacts
          for target in fips_fuzz_host fips_fuzz_codec fips_fuzz_identity fips_fuzz_aead fips_fuzz_coord fips_fuzz_link fips_fuzz_stp fips_fuzz_bloom fips_fuzz_fmp fips_fuzz_handshake fips_fuzz_routing fips_fuzz_lookup fips_fuzz_fsp fips_fuzz_session fips_fuzz_mmp fips_fuzz_probe fips_fuzz_rekey fips_fuzz_path fips_fuzz_rekey_profile fipsd_fuzz_control fipsd_fuzz_config; do
            component=libfips-core
            if [[ "$target" == fipsd_* ]]; then component=fipsd; fi
            if [[ -d "$component/fuzz/corpus/$target" ]]; then cp -R "$component/fuzz/corpus/$target" build/corpus/; else mkdir -p "build/corpus/$target"; fi
            "build/$component/fuzz/$target" -max_total_time=10 -timeout=5 -artifact_prefix=build/fuzz-artifacts/ "build/corpus/$target"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ inputs.artifact_prefix }}fips-${{ matrix.os }}-${{ matrix.configuration }}
          path: |
            build/Testing/Temporary/
            build/fuzz-artifacts/
  interop-udp:
    name: ${{ matrix.os }} • FIPS • C<->Rust UDP interop
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - name: Verify requested checkout
        if: inputs.sha != ''
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
      # The pin lives in one place: libfips-core/UPSTREAM.md.
      - name: Read the upstream pin
        id: pin
        run: |
          pin=$(sed -n 's/^Pinned commit: .\([0-9a-f]\{40\}\).*/\1/p' libfips-core/UPSTREAM.md)
          test -n "$pin"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      - name: Check out upstream FIPS at the pin
        uses: actions/checkout@v4
        with:
          repository: jmcorgan/fips
          ref: ${{ steps.pin.outputs.pin }}
          path: upstream-fips
          persist-credentials: false
      - name: Verify the upstream checkout
        env:
          PIN: ${{ steps.pin.outputs.pin }}
        run: test "$(git -C upstream-fips rev-parse HEAD)" = "$PIN"
      # The built daemon is cached on OS, architecture, pin and toolchain; a hit
      # skips the Rust build entirely, a miss rebuilds from the pinned source.
      - name: Restore the pinned Rust daemon
        id: daemon
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fips-rust-target/release/fips
          key: fips-daemon-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.pin }}-${{ hashFiles('upstream-fips/rust-toolchain.toml') }}-v1
      - name: Restore the cargo registry
        if: steps.daemon.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('upstream-fips/Cargo.lock') }}
      - name: Build the pinned Rust daemon
        if: steps.daemon.outputs.cache-hit != 'true'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fips-rust-target
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' upstream-fips/rust-toolchain.toml)
          # upstream fips links libdbus (BLE) on Linux; pkg-config must find dbus-1
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y libdbus-1-dev pkg-config
          fi
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal
          cd upstream-fips
          cargo "+$channel" build --locked --release --bin fips
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config clang libclang-rt-18-dev libjansson-dev libyaml-dev libsecp256k1-dev libsodium-dev libssl-dev libcurl4-openssl-dev libwebsockets-dev libglib2.0-dev libsoup-3.0-dev libnsync-dev libnftables-dev libncurses-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm cmake ninja pkg-config jansson libyaml secp256k1 libsodium openssl@3 curl libwebsockets glib libsoup@3 nsync
          {
            echo "CC=$(brew --prefix llvm)/bin/clang"
            echo "CXX=$(brew --prefix llvm)/bin/clang++"
            echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig:${PKG_CONFIG_PATH}"
            echo "ASAN_OPTIONS=detect_leaks=0:strict_string_checks=1:halt_on_error=1"
          } >> "$GITHUB_ENV"
      - name: Configure (ASan/UBSan)
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DGO_WARNINGS_AS_ERRORS=ON \
            -DGO_ENABLE_ASAN=ON -DGO_ENABLE_UBSAN=ON \
            -DBUILD_FIPS=ON -DBUILD_APPS=OFF -DBUILD_RELAYD=OFF \
            -DBUILD_LIBHANAMI=OFF -DBUILD_LIBMARMOT=OFF -DBUILD_MARMOT_GOBJECT=OFF \
            -DBUILD_NOSTR_GOBJECT=OFF -DBUILD_NOSTR_GTK=OFF -DSIGNET_ENABLE=OFF \
            -DWITH_NOSTRDB=OFF -DLIBNOSTR_WITH_NOSTRDB=OFF \
            "-DFIPSD_UDP_INTEROP_RUST_BINARY=${RUNNER_TEMP}/fips-rust-target/release/fips"
      - name: Build fipsd
        run: cmake --build build --parallel 3 --target fipsd fipsd_test_tmpdir_run fipsd_native_client_tool
      - name: C<->Rust UDP interop (both roles, IPv4 and IPv6)
        run: ctest --test-dir build -R '^FipsdInteropUdp' --no-tests=error --output-on-failure
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ inputs.artifact_prefix }}fips-interop-udp-${{ matrix.os }}
          path: build/Testing/Temporary/
  windows:
    # fipsd/README.md "Building on Windows (MSYS2)" and "Windows CI": the
    # Windows subset, then the privileged TUN, two-node and service smokes
    # (hosted Windows runners are elevated), which must run rather than skip.
    name: Windows 11 ARM64 • FIPS • MSYS2 CLANGARM64
    if: github.event_name != 'schedule'
    runs-on: windows-11-arm
    timeout-minutes: 120
    env:
      SECP256K1_TAG: v0.6.0
      WINTUN_SHA256: 07C256185D6EE3652E09FA55C0B673E2624B565E02C4B9091C79CA7D2F24EF51
    steps:
      # Goldens are compared byte for byte: no CRLF conversion on checkout.
      - name: Check out with LF line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - name: Verify requested checkout
        if: inputs.sha != ''
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
      - name: Set up MSYS2 CLANGARM64
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: false
          install: >-
            git
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-ninja
            mingw-w64-clang-aarch64-pkgconf
            mingw-w64-clang-aarch64-openssl
            mingw-w64-clang-aarch64-libsodium
            mingw-w64-clang-aarch64-jansson
            mingw-w64-clang-aarch64-libyaml
            mingw-w64-clang-aarch64-nsync
            mingw-w64-clang-aarch64-libwebsockets
            mingw-w64-clang-aarch64-curl
            mingw-w64-clang-aarch64-glib2
            mingw-w64-clang-aarch64-python
            mingw-w64-clang-aarch64-ncurses
      # MSYS2 has no libsecp256k1 package: build a pinned tag once per
      # toolchain into its own prefix, cached.
      - name: Restore libsecp256k1
        id: secp256k1
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/secp256k1
          key: secp256k1-${{ runner.os }}-${{ runner.arch }}-clangarm64-${{ env.SECP256K1_TAG }}-v1
      - name: Build libsecp256k1
        if: steps.secp256k1.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          tmp="$(cygpath -u "$RUNNER_TEMP")"
          git clone --depth 1 --branch "$SECP256K1_TAG" https://github.com/bitcoin-core/secp256k1.git "$tmp/secp256k1-src"
          cmake -S "$tmp/secp256k1-src" -B "$tmp/secp256k1-build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_INSTALL_PREFIX="$tmp/secp256k1" -DSECP256K1_ENABLE_MODULE_RECOVERY=ON \
            -DSECP256K1_ENABLE_MODULE_ECDH=ON -DSECP256K1_ENABLE_MODULE_SCHNORRSIG=ON \
            -DSECP256K1_ENABLE_MODULE_EXTRAKEYS=ON -DSECP256K1_BUILD_TESTS=OFF \
            -DSECP256K1_BUILD_EXHAUSTIVE_TESTS=OFF -DSECP256K1_BUILD_BENCHMARK=OFF
          cmake --build "$tmp/secp256k1-build"
          cmake --install "$tmp/secp256k1-build"
      - name: Use libsecp256k1
        shell: msys2 {0}
        run: |
          prefix="$(cygpath -u "$RUNNER_TEMP")/secp256k1"
          test -f "$prefix/lib/pkgconfig/libsecp256k1.pc"
          echo "SECP256K1_PREFIX=$prefix" >> "$GITHUB_ENV"
      - name: PSScriptAnalyzer (packaging/windows)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          }
          $settings = 'fipsd/packaging/windows/PSScriptAnalyzerSettings.psd1'
          $results = @(Invoke-ScriptAnalyzer -Path fipsd/packaging/windows/*.ps1 -Settings $settings) +
            @(Invoke-ScriptAnalyzer -Path fipsd/tests/windows_service_smoke.ps1 -Settings $settings)
          if ($results.Count) {
            $results | Format-Table -AutoSize -Wrap ScriptName, Line, RuleName, Message
            Write-Error "PSScriptAnalyzer found $($results.Count) issue(s)"
            exit 1
          }
          Write-Host 'PSScriptAnalyzer: no issues'
      # The README's configure line: no PYTHONUTF8, no -DFIPSD_ENABLE_BLE.
      - name: Configure
        shell: msys2 {0}
        run: |
          git config --global --add safe.directory '*'
          # libfips-core finds it through pkg-config, libnostr with find_library/find_path.
          export PKG_CONFIG_PATH="$SECP256K1_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$(cygpath -m "$SECP256K1_PREFIX")" \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DGO_WARNINGS_AS_ERRORS=ON -DBUILD_TESTING=ON -DBUILD_FIPS=ON \
            -DBUILD_TESTING_FRAMEWORK=OFF -DBUILD_SIGNER_TESTS=OFF -DLIBNOSTR_BUILD_TESTS=OFF \
            -DBUILD_LIBMARMOT=OFF -DBUILD_MARMOT_GOBJECT=OFF -DBUILD_LIBHANAMI=OFF \
            -DBUILD_GNOSTR_APP=OFF -DBUILD_GROUNDHOG=OFF -DBUILD_RELAYD=OFF -DSIGNET_ENABLE=OFF \
            -DENABLE_NIP55L=OFF -DENABLE_NIP5F=OFF -DENABLE_NIP57=OFF \
            -DWITH_NOSTRDB=OFF -DLIBNOSTR_WITH_NOSTRDB=OFF -DBUILD_NOSTR_GOBJECT=OFF \
            -DBUILD_NOSTR_GTK=OFF -DBUILD_APPS=OFF -DBUILD_LIBBLOSSOM=OFF \
            -DBUILD_LIBPORTHOME=OFF -DBUILD_LIBVAULT=OFF -DBUILD_LIBVAULT_MARMOT=OFF -DENABLE_BUD02=OFF
          grep -E '^(FIPSD_ENABLE_BLE|FIPSD_BUILD_FIPSTOP):' build/CMakeCache.txt
      - name: Build FIPS targets
        id: build
        shell: msys2 {0}
        run: |
          cmake --build build --parallel 4 --target fipsd fipsd_tests fipsctl fipstop
          cmake --build build --parallel 4 --target libfips-core/all libgo/all test_channel_incremental
      - name: Fetch wintun.dll
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'wintun-0.14.1.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash
          if ($hash -ne $env:WINTUN_SHA256) { throw "wintun-0.14.1.zip SHA-256 is $hash" }
          $dir = Join-Path $env:RUNNER_TEMP 'wintun'
          Expand-Archive -Path $zip -DestinationPath $dir
          $dll = Join-Path $dir 'wintun\bin\arm64\wintun.dll'
          $signature = Get-AuthenticodeSignature $dll
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=WireGuard LLC') {
            throw "wintun.dll signature: $($signature.Status)"
          }
          Copy-Item $dll build/fipsd/
          Copy-Item $dll build/fipsd/tests/
          "FIPSD_WINTUN_ZIP=$zip" >> $env:GITHUB_ENV
      - name: Test FIPS (Windows subset)
        shell: msys2 {0}
        run: |
          export PATH="$SECP256K1_PREFIX/bin:$PATH"
          ctest --test-dir build -R '^Go|^FipsCore|^FipsDiff|^Fipsd|^FipsTop' -LE privileged -j 2 \
            --timeout 600 --no-tests=error --output-on-failure
      # Elevated runner: the TUN, two-node and service smokes must run.
      - name: Privileged smokes (Wintun, two nodes, the fipsd service)
        shell: msys2 {0}
        run: |
          export PATH="$SECP256K1_PREFIX/bin:$PATH"
          export FIPSD_TUN_PRIVILEGED_SMOKE=1 FIPSD_SERVICE_PRIVILEGED_SMOKE=1
          ctest --test-dir build -R '^Fipsd' -L privileged --timeout 600 --no-tests=error --output-on-failure -V \
            | tee build/privileged.log
          status=${PIPESTATUS[0]}
          if grep -E '\*\*\*Skipped|SKIP:' build/privileged.log; then
            echo "::error::a privileged smoke skipped on an elevated runner"; exit 1
          fi
          test "$(grep -cE 'Test +#[0-9]+: Fipsd.* +Passed' build/privileged.log)" -eq 4
          exit "$status"
      - name: Package (build-zip.ps1)
        if: (success() || failure()) && steps.build.outcome == 'success'
        shell: pwsh
        run: |
          $bin = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'clangarm64\bin'
          $secp = Join-Path $env:RUNNER_TEMP 'secp256k1\bin'
          ./fipsd/packaging/windows/build-zip.ps1 -BuildDir build -DllPath $bin, $secp -WintunZip $env:FIPSD_WINTUN_ZIP
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: ${{ inputs.artifact_prefix }}fipsd-windows-arm64
          path: |
            build/deploy/*.zip
            build/Testing/Temporary/
            build/privileged.log
          if-no-files-found: ignore
  nightly-fuzz:
    name: Linux • FIPS nightly fuzz (60 seconds per target)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config clang libclang-rt-18-dev libjansson-dev libyaml-dev libsecp256k1-dev libsodium-dev libssl-dev libcurl4-openssl-dev libwebsockets-dev libglib2.0-dev libsoup-3.0-dev libnsync-dev libnftables-dev libncurses-dev
      - name: Configure fuzzers
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DGO_WARNINGS_AS_ERRORS=ON -DGO_ENABLE_ASAN=ON -DGO_ENABLE_UBSAN=ON -DFIPS_ENABLE_FUZZERS=ON \
            -DBUILD_FIPS=ON -DBUILD_APPS=OFF -DBUILD_RELAYD=OFF \
            -DBUILD_LIBHANAMI=OFF -DBUILD_LIBMARMOT=OFF -DBUILD_MARMOT_GOBJECT=OFF \
            -DBUILD_NOSTR_GOBJECT=OFF -DBUILD_NOSTR_GTK=OFF -DSIGNET_ENABLE=OFF \
            -DWITH_NOSTRDB=OFF -DLIBNOSTR_WITH_NOSTRDB=OFF
      - run: cmake --build build --parallel 3 --target fips_fuzz_host fips_fuzz_codec fips_fuzz_identity fips_fuzz_aead fips_fuzz_coord fips_fuzz_link fips_fuzz_stp fips_fuzz_bloom fips_fuzz_fmp fips_fuzz_handshake fips_fuzz_routing fips_fuzz_lookup fips_fuzz_fsp fips_fuzz_session fips_fuzz_mmp fips_fuzz_probe fips_fuzz_rekey fips_fuzz_path fips_fuzz_rekey_profile fipsd_fuzz_control fipsd_fuzz_config
      - name: Fuzz (60 seconds per target)
        run: |
          mkdir -p build/corpus build/fuzz-artifacts
          for target in fips_fuzz_host fips_fuzz_codec fips_fuzz_identity fips_fuzz_aead fips_fuzz_coord fips_fuzz_link fips_fuzz_stp fips_fuzz_bloom fips_fuzz_fmp fips_fuzz_handshake fips_fuzz_routing fips_fuzz_lookup fips_fuzz_fsp fips_fuzz_session fips_fuzz_mmp fips_fuzz_probe fips_fuzz_rekey fips_fuzz_path fips_fuzz_rekey_profile fipsd_fuzz_control fipsd_fuzz_config; do
            component=libfips-core
            if [[ "$target" == fipsd_* ]]; then component=fipsd; fi
            if [[ -d "$component/fuzz/corpus/$target" ]]; then cp -R "$component/fuzz/corpus/$target" build/corpus/; else mkdir -p "build/corpus/$target"; fi
            "build/$component/fuzz/$target" -max_total_time=60 -timeout=5 -artifact_prefix=build/fuzz-artifacts/ "build/corpus/$target"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fips-nightly-fuzz-crashes
          path: build/fuzz-artifacts/
  chaos-netns:
    name: Linux • FIPS nightly netns chaos (link flap, MTU, NAT traversal, netem)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      # The pin lives in one place: libfips-core/UPSTREAM.md.
      - name: Read the upstream pin
        id: pin
        run: |
          pin=$(sed -n 's/^Pinned commit: .\([0-9a-f]\{40\}\).*/\1/p' libfips-core/UPSTREAM.md)
          test -n "$pin"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      - name: Check out upstream FIPS at the pin
        uses: actions/checkout@v4
        with:
          repository: jmcorgan/fips
          ref: ${{ steps.pin.outputs.pin }}
          path: upstream-fips
          persist-credentials: false
      - name: Verify the upstream checkout
        env:
          PIN: ${{ steps.pin.outputs.pin }}
        run: test "$(git -C upstream-fips rev-parse HEAD)" = "$PIN"
      # The built daemon is cached on OS, architecture, pin and toolchain; a hit
      # skips the Rust build entirely, a miss rebuilds from the pinned source.
      - name: Restore the pinned Rust daemon
        id: daemon
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fips-rust-target/release/fips
          key: fips-daemon-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.pin }}-${{ hashFiles('upstream-fips/rust-toolchain.toml') }}-v1
      - name: Restore the cargo registry
        if: steps.daemon.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('upstream-fips/Cargo.lock') }}
      - name: Build the pinned Rust daemon
        if: steps.daemon.outputs.cache-hit != 'true'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fips-rust-target
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' upstream-fips/rust-toolchain.toml)
          # upstream fips links libdbus (BLE) on Linux; pkg-config must find dbus-1
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y libdbus-1-dev pkg-config
          fi
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal
          cd upstream-fips
          cargo "+$channel" build --locked --release --bin fips
      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config clang libclang-rt-18-dev libjansson-dev libyaml-dev libsecp256k1-dev libsodium-dev libssl-dev libcurl4-openssl-dev libwebsockets-dev libglib2.0-dev libsoup-3.0-dev libnsync-dev libnftables-dev libncurses-dev
      - name: Install the chaos lab tools (iproute2, nftables, iperf3, conntrack)
        run: sudo apt-get install -y iproute2 nftables iperf3 conntrack
      - name: Configure (ASan/UBSan)
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DGO_WARNINGS_AS_ERRORS=ON \
            -DGO_ENABLE_ASAN=ON -DGO_ENABLE_UBSAN=ON \
            -DBUILD_FIPS=ON -DBUILD_APPS=OFF -DBUILD_RELAYD=OFF \
            -DBUILD_LIBHANAMI=OFF -DBUILD_LIBMARMOT=OFF -DBUILD_MARMOT_GOBJECT=OFF \
            -DBUILD_NOSTR_GOBJECT=OFF -DBUILD_NOSTR_GTK=OFF -DSIGNET_ENABLE=OFF \
            -DWITH_NOSTRDB=OFF -DLIBNOSTR_WITH_NOSTRDB=OFF
      - name: Build fipsd
        run: cmake --build build --parallel 3 --target fipsd
      # Root for ip netns, nftables and tc; -E keeps the sanitizer options.
      - name: Chaos scenarios in network namespaces (C<->C and C<->Rust)
        env:
          FIPSD_UDP_INTEROP_RUST_BINARY: ${{ runner.temp }}/fips-rust-target/release/fips
        run: |
          sudo -E env "PATH=$PATH" Testing/fips-chaos/run.sh --fipsd build/fipsd/fipsd \
            --rust "$FIPSD_UDP_INTEROP_RUST_BINARY" --output build/chaos-results
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fips-nightly-chaos-netns
          path: build/chaos-results/
  bench:
    name: Linux • FIPS Release performance regression
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: clang
      CXX: clang++
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - name: Verify requested checkout
        if: inputs.sha != ''
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
      # The pin lives in one place: libfips-core/UPSTREAM.md.
      - name: Read the upstream pin
        id: pin
        run: |
          pin=$(sed -n 's/^Pinned commit: .\([0-9a-f]\{40\}\).*/\1/p' libfips-core/UPSTREAM.md)
          test -n "$pin"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
      - name: Check out upstream FIPS at the pin
        uses: actions/checkout@v4
        with:
          repository: jmcorgan/fips
          ref: ${{ steps.pin.outputs.pin }}
          path: upstream-fips
          persist-credentials: false
      - name: Verify the upstream checkout
        env:
          PIN: ${{ steps.pin.outputs.pin }}
        run: test "$(git -C upstream-fips rev-parse HEAD)" = "$PIN"
      # The built daemon is cached on OS, architecture, pin and toolchain; a hit
      # skips the Rust build entirely, a miss rebuilds from the pinned source.
      - name: Restore the pinned Rust daemon
        id: daemon
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fips-rust-target/release/fips
          key: fips-daemon-${{ runner.os }}-${{ runner.arch }}-${{ steps.pin.outputs.pin }}-${{ hashFiles('upstream-fips/rust-toolchain.toml') }}-v1
      - name: Restore the cargo registry
        if: steps.daemon.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('upstream-fips/Cargo.lock') }}
      - name: Build the pinned Rust daemon
        if: steps.daemon.outputs.cache-hit != 'true'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/fips-rust-target
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' upstream-fips/rust-toolchain.toml)
          # upstream fips links libdbus (BLE) on Linux; pkg-config must find dbus-1
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y libdbus-1-dev pkg-config
          fi
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal
          cd upstream-fips
          cargo "+$channel" build --locked --release --bin fips
      - name: Verify the Rust baseline pin
        env:
          PIN: ${{ steps.pin.outputs.pin }}
        run: |
          python3 - <<'PYBASE'
          import json, os
          baseline = json.load(open('fipsd/tests/perf_baseline.json'))
          if baseline['rust_commit'] != os.environ['PIN']:
              raise SystemExit('UPSTREAM.md differs from the immutable Rust performance baseline')
          PYBASE
      - name: Read the immutable C baseline revision
        id: baseline
        run: |
          python3 - <<'PYBASE'
          import json, os, re
          baseline = json.load(open('fipsd/tests/perf_baseline.json'))
          commit = baseline['reference_commit']
          assert re.fullmatch(r'[0-9a-f]{40}', commit)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'commit={commit}\n')
          PYBASE
      - name: Check out the C baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.baseline.outputs.commit }}
          path: perf-reference
          submodules: recursive
          persist-credentials: false
      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config clang libclang-rt-18-dev libjansson-dev libyaml-dev libsecp256k1-dev libsodium-dev libssl-dev libcurl4-openssl-dev libwebsockets-dev libglib2.0-dev libsoup-3.0-dev libnsync-dev libnftables-dev libncurses-dev
      - name: Apply identical test-only workload to the reference
        # The baseline already defines the bench targets (fips_benches,
        # fipsd_perf_native); only the workload sources are refreshed. Never copy
        # shipped source into it: both builds measure the same current workloads
        # against their own core.
        run: |
          cp libfips-core/bench/* perf-reference/libfips-core/bench/
          cp fipsd/tests/perf_native.c perf-reference/fipsd/tests/
      - name: Build candidate and reference (Release, Werror)
        shell: bash
        run: |
          for source in "$PWD" "$PWD/perf-reference"; do
            cmake -S "$source" -B "$source/build-bench" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DGO_WARNINGS_AS_ERRORS=ON -DFIPS_ENABLE_BENCH=ON \
              -DBUILD_FIPS=ON -DBUILD_APPS=OFF -DBUILD_RELAYD=OFF \
              -DBUILD_LIBHANAMI=OFF -DBUILD_LIBMARMOT=OFF -DBUILD_MARMOT_GOBJECT=OFF \
              -DBUILD_NOSTR_GOBJECT=OFF -DBUILD_NOSTR_GTK=OFF -DSIGNET_ENABLE=OFF \
              -DWITH_NOSTRDB=OFF -DLIBNOSTR_WITH_NOSTRDB=OFF
            cmake --build "$source/build-bench" --parallel 3 --target fipsd fips_benches fipsd_perf_native
          done
      - name: Test the comparer (including injected 11 percent regression)
        run: python3 fipsd/tests/test_perf_compare.py
      - name: Measure three sequential runs per build
        env:
          BASELINE_COMMIT: ${{ steps.baseline.outputs.commit }}
          RUST_COMMIT: ${{ steps.pin.outputs.pin }}
        run: |
          python3 fipsd/tests/perf_run.py --build "$PWD/perf-reference/build-bench" \
            --rust "${{ runner.temp }}/fips-rust-target/release/fips" \
            --source-commit "$BASELINE_COMMIT" --rust-commit "$RUST_COMMIT" \
            --output "$PWD/bench-results/reference.json" \
            --work-dir "${{ runner.temp }}/fips-perf"
          python3 fipsd/tests/perf_run.py --build "$PWD/build-bench" \
            --rust "${{ runner.temp }}/fips-rust-target/release/fips" \
            --source-commit "$(git rev-parse HEAD)" --rust-commit "$RUST_COMMIT" \
            --output "$PWD/bench-results/candidate.json" \
            --work-dir "${{ runner.temp }}/fips-perf"
      # Hosted policy (fipsd/docs/perf.md): against the same-runner reference,
      # goodput and micro medians fail beyond 10%; loopback latency percentiles
      # and CPU per datagram are reported in the job summary, never gated.
      - name: Enforce the 10 percent limit on goodput and micro medians
        run: |
          python3 fipsd/tests/perf_compare.py bench-results/candidate.json --hosted \
            --baseline fipsd/tests/perf_baseline.json --reference bench-results/reference.json \
            --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fips-bench-results
          path: |
            bench-results/
            fipsd/tests/perf_baseline.json
          if-no-files-found: error
