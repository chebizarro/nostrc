name: Rust installed-library consumer

on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-consumer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - name: Verify requested checkout
        if: inputs.sha != ''
        env:
          REQUESTED_SHA: ${{ inputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
      - name: Cache apt package downloads
        id: apt-cache
        uses: ./.github/actions/cache-apt

      - name: Install C and binding-generator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config clang libclang-dev \
            libssl-dev libcurl4-openssl-dev libjansson-dev libsecp256k1-dev \
            libwebsockets-dev libsodium-dev libnsync-dev
      - name: Save apt package downloads even after failure
        if: always() && steps.apt-cache.outputs.key != '' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /var/cache/nostrc-apt/archives/*.deb
          key: ${{ steps.apt-cache.outputs.key }}${{ job.status != 'success' && format('-partial-{0}-{1}-{2}', github.run_id, github.run_attempt, strategy.job-index || 0) || '' }}

      - name: Select Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install C closure and build/test Rust consumer
        run: bash bindings/rust/test-installed.sh
