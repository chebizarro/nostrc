name: Groundhog opt-in CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# This is a focused compile/test gate, not messaging-protocol or GNOME manual
# accessibility acceptance. Groundhog remains opt-in and incomplete.
jobs:
  groundhog:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libgtk-4-dev libadwaita-1-dev libglib2.0-dev libsecret-1-dev \
            libjansson-dev libsecp256k1-dev libwebsockets-dev libsodium-dev \
            libssl-dev libcurl4-openssl-dev libsoup-3.0-dev libjson-glib-dev \
            libgit2-dev libsqlite3-dev libnsync-dev libsqlcipher-dev \
            desktop-file-utils appstream xvfb xauth dbus-bin at-spi2-core \
            blueprint-compiler gnome-keyring adwaita-icon-theme librsvg2-common
          # Ubuntu 24.04 ships blueprint-compiler 0.12, Groundhog's minimum;
          # groundhog-blueprint compares its output with the committed .ui.
          blueprint-compiler --version
          # libsqlcipher-dev (4.5.6) backs the encrypted store; groundhog-store-sqlite
          # (ST-4) proves every sqlite3_* binding in groundhog resolves to it, ahead
          # of the libsqlite3 that libsoup links.
          pkg-config --modversion sqlcipher

      - name: Configure Groundhog and in-tree adapters
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON -DBUILD_GROUNDHOG=ON \
            -DBUILD_NOSTR_GOBJECT=ON -DBUILD_NOSTR_GTK=OFF \
            -DBUILD_APPS=OFF -DBUILD_RELAYD=OFF -DSIGNET_ENABLE=OFF

      - name: Build Groundhog and every focused test target
        run: |
          cmake --build build --parallel 2 --target \
            groundhog test-groundhog-resource test-groundhog-shell test-groundhog-identity \
            test-groundhog-account test-groundhog-account-relays test-groundhog-dm-send \
            test-groundhog-account-ui test-groundhog-relay test-groundhog-relay-wire \
            test-groundhog-relay-publish test-groundhog-relay-publish-wire \
            test-groundhog-nip29 test-groundhog-conversations test-groundhog-dm-inbox test-groundhog-store-key test-groundhog-store-key-keyring test-groundhog-store test-groundhog-store-sqlite \
            test-groundhog-store-marmot test-groundhog-store-conversations test-groundhog-outbox test-groundhog-conversation-list \
            test-groundhog-account-store test-groundhog-conversation-view test-groundhog-link-policy test-groundhog-background test-groundhog-preferences nostrc-test-bus-selftest \
            test-groundhog-inbox-setup test-groundhog-onboarding

      - name: Require complete Groundhog test registration
        run: |
          python3 - <<'PY'
          import json
          import subprocess

          data = json.loads(subprocess.check_output(
              ['ctest', '--test-dir', 'build', '--show-only=json-v1'], text=True))
          found = {test['name'] for test in data['tests']}
          required = {
              'groundhog-resource', 'groundhog-shell', 'groundhog-identity', 'groundhog-account',
              'groundhog-account-relays', 'groundhog-dm-send', 'groundhog-account-ui', 'groundhog-relay', 'groundhog-relay-wire',
              'groundhog-relay-publish', 'groundhog-relay-publish-wire', 'groundhog-nip29',
              'groundhog-conversations', 'groundhog-dm-inbox', 'groundhog-conversation-list',
              'groundhog-version', 'groundhog-launch', 'groundhog-schema',
              'groundhog-data', 'groundhog-desktop', 'groundhog-metainfo',
              'groundhog-blueprint', 'groundhog-privacy-static', 'groundhog-store-key', 'groundhog-store-key-keyring', 'groundhog-store', 'groundhog-store-sqlite',
              'groundhog-store-marmot', 'groundhog-store-conversations', 'groundhog-outbox',
              'groundhog-account-store', 'groundhog-conversation-view', 'groundhog-link-policy', 'groundhog-background', 'groundhog-background-gui', 'groundhog-background-desktop', 'groundhog-preferences', 'nostrc-test-bus-selftest',
              'groundhog-inbox-setup', 'groundhog-onboarding',
          }
          missing = required - found
          print('Groundhog tests:', ', '.join(sorted(found & required)))
          if missing:
              raise SystemExit('Missing Groundhog tests: ' + ', '.join(sorted(missing)))
          PY

      - name: Run all Groundhog tests under a controlled display
        run: |
          set -euo pipefail
          # Give GTK a private session bus with the AT-SPI bus service installed;
          # Xvfb alone cannot activate org.a11y.Bus for the widget tests.
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' \
            ctest --test-dir build --output-on-failure \
              --output-junit "$PWD/build/groundhog-ctest.xml" \
              -R '^(groundhog-|nostrc-test-bus-selftest$)' | tee build/groundhog-ctest.log
          if grep -Eq '\*\*\*Skipped|Not Run' build/groundhog-ctest.log; then
            echo 'Groundhog test unexpectedly skipped or did not run' >&2
            exit 1
          fi

      - name: KC-6 store key against the session's unlocked gnome-keyring
        run: |
          set -euo pipefail
          # The run above already exercised KC-6 against a private keyring the
          # test starts itself (a skip fails that step). This repeats it the
          # way a desktop session looks: gnome-keyring-daemon unlocks the login
          # keyring on the session bus, as PAM does at login, and the test must
          # find that service (it fails, never skips, in this mode).
          export XDG_DATA_HOME="$RUNNER_TEMP/kc6-data" XDG_RUNTIME_DIR="$RUNNER_TEMP/kc6-run"
          mkdir -p "$XDG_DATA_HOME"
          install -d -m 700 "$XDG_RUNTIME_DIR"
          dbus-run-session -- bash -euo pipefail -c '
            printf %s ci-keyring | gnome-keyring-daemon --unlock --components=secrets --daemonize >/dev/null
            GH_STORE_KEY_TEST_SESSION_KEYRING=1 ctest --test-dir build --output-on-failure \
              --no-tests=error -R "^groundhog-store-key-keyring$" | tee build/groundhog-kc6-session.log
          '

      - name: Require the build to leave committed UI untouched
        run: |
          # data/ui/*.ui are committed Blueprint output; builds compile into
          # build/ and must never rewrite or add files in the source tree.
          git diff --exit-code
          if [ -n "$(git status --porcelain --untracked-files=all -- . ':!build')" ]; then
            git status --porcelain --untracked-files=all -- . ':!build'
            echo 'Build modified the source tree' >&2
            exit 1
          fi

      - name: Upload focused test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groundhog-ctest-linux
          path: |
            build/groundhog-ctest.log
            build/groundhog-ctest.xml
            build/groundhog-kc6-session.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
