name: Groundhog opt-in CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# This is a focused compile/test gate, not messaging-protocol or GNOME manual
# accessibility acceptance. Groundhog remains opt-in and incomplete.
jobs:
  groundhog:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libgtk-4-dev libadwaita-1-dev libglib2.0-dev libsecret-1-dev \
            libjansson-dev libsecp256k1-dev libwebsockets-dev libsodium-dev \
            libssl-dev libcurl4-openssl-dev libsoup-3.0-dev libjson-glib-dev \
            libgit2-dev libsqlite3-dev libnsync-dev libsqlcipher-dev \
            desktop-file-utils appstream xvfb xauth dbus-bin at-spi2-core \
            blueprint-compiler gnome-keyring adwaita-icon-theme librsvg2-common
          # Ubuntu 24.04 ships blueprint-compiler 0.12, Groundhog's minimum;
          # groundhog-blueprint compares its output with the committed .ui.
          blueprint-compiler --version
          # libsqlcipher-dev (4.5.6) backs the encrypted store; groundhog-store-sqlite
          # (ST-4) proves every sqlite3_* binding in groundhog resolves to it, ahead
          # of the libsqlite3 that libsoup links.
          pkg-config --modversion sqlcipher

      - name: Configure Groundhog and in-tree adapters
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON -DBUILD_GROUNDHOG=ON \
            -DBUILD_NOSTR_GOBJECT=ON -DBUILD_NOSTR_GTK=OFF \
            -DBUILD_APPS=OFF -DBUILD_RELAYD=OFF -DSIGNET_ENABLE=OFF

      - name: Build Groundhog and every focused test target
        run: |
          cmake --build build --parallel 2 --target \
            groundhog test-groundhog-resource test-groundhog-shell test-groundhog-identity \
            test-groundhog-account test-groundhog-account-relays test-groundhog-dm-send \
            test-groundhog-account-ui test-groundhog-relay test-groundhog-relay-wire \
            test-groundhog-relay-publish test-groundhog-relay-publish-wire \
            test-groundhog-nip29 test-groundhog-conversations test-groundhog-dm-inbox test-groundhog-store-key test-groundhog-store-key-keyring test-groundhog-store test-groundhog-store-sqlite \
            test-groundhog-store-marmot test-groundhog-store-conversations test-groundhog-outbox test-groundhog-conversation-list \
            test-groundhog-account-store test-groundhog-conversation-view test-groundhog-link-policy test-groundhog-background test-groundhog-preferences test-groundhog-notifier nostrc-test-bus-selftest \
            test-groundhog-inbox-setup test-groundhog-onboarding \
            test-groundhog-composer test-groundhog-e2e-dm test-groundhog-expiry \
            test-groundhog-auth-policy test-groundhog-contact-directory \
            test-groundhog-privacy-e2e \
            test-groundhog-new-message test-groundhog-requests \
            test-groundhog-privacy-summary test-groundhog-conversation-info \
            test-groundhog-nip29-service \
            test-groundhog-net \
            test-groundhog-group-ui \
            test-groundhog-conversation-menu

      - name: Require complete Groundhog test registration
        run: |
          python3 - <<'PY'
          import json
          import subprocess

          data = json.loads(subprocess.check_output(
              ['ctest', '--test-dir', 'build', '--show-only=json-v1'], text=True))
          found = {test['name'] for test in data['tests']}
          required = {
              'groundhog-resource', 'groundhog-shell', 'groundhog-identity', 'groundhog-account',
              'groundhog-account-relays', 'groundhog-dm-send', 'groundhog-account-ui', 'groundhog-relay', 'groundhog-relay-wire',
              'groundhog-relay-publish', 'groundhog-relay-publish-wire', 'groundhog-nip29',
              'groundhog-conversations', 'groundhog-dm-inbox', 'groundhog-conversation-list',
              'groundhog-version', 'groundhog-launch', 'groundhog-schema',
              'groundhog-data', 'groundhog-desktop', 'groundhog-metainfo',
              'groundhog-blueprint', 'groundhog-privacy-static', 'groundhog-store-key', 'groundhog-store-key-keyring', 'groundhog-store', 'groundhog-store-sqlite',
              'groundhog-store-marmot', 'groundhog-store-conversations', 'groundhog-outbox',
              'groundhog-account-store', 'groundhog-account-store-gui', 'groundhog-conversation-view', 'groundhog-link-policy', 'groundhog-background', 'groundhog-background-gui', 'groundhog-background-desktop', 'groundhog-preferences', 'groundhog-notifier', 'groundhog-notifier-gui', 'nostrc-test-bus-selftest',
              'groundhog-inbox-setup', 'groundhog-onboarding',
              'groundhog-composer', 'groundhog-e2e-dm', 'groundhog-expiry',
              'groundhog-auth-policy', 'groundhog-contact-directory',
              'groundhog-privacy-e2e',
              'groundhog-new-message', 'groundhog-requests', 'groundhog-requests-gui',
              'groundhog-privacy-summary', 'groundhog-conversation-info',
              'groundhog-conversation-info-gui', 'groundhog-nip29-service',
              'groundhog-net',
              'groundhog-group-ui', 'groundhog-group-ui-gui',
              'groundhog-conversation-menu', 'groundhog-conversation-menu-gui',
          }
          missing = required - found
          print('Groundhog tests:', ', '.join(sorted(found & required)))
          if missing:
              raise SystemExit('Missing Groundhog tests: ' + ', '.join(sorted(missing)))
          PY

      - name: Run all Groundhog tests under a controlled display
        run: |
          set -euo pipefail
          # Give GTK a private session bus with the AT-SPI bus service installed;
          # Xvfb alone cannot activate org.a11y.Bus for the widget tests.
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x800x24' \
            ctest --test-dir build --output-on-failure \
              --output-junit "$PWD/build/groundhog-ctest.xml" \
              -R '^(groundhog-|nostrc-test-bus-selftest$)' | tee build/groundhog-ctest.log
          if grep -Eq '\*\*\*Skipped|Not Run' build/groundhog-ctest.log; then
            echo 'Groundhog test unexpectedly skipped or did not run' >&2
            exit 1
          fi

      - name: KC-6 store key against the session's unlocked gnome-keyring
        run: |
          set -euo pipefail
          # The run above already exercised KC-6 against a private keyring the
          # test starts itself (a skip fails that step). This repeats it the
          # way a desktop session looks: gnome-keyring-daemon unlocks the login
          # keyring on the session bus, as PAM does at login, and the test must
          # find that service (it fails, never skips, in this mode).
          export XDG_DATA_HOME="$RUNNER_TEMP/kc6-data" XDG_RUNTIME_DIR="$RUNNER_TEMP/kc6-run"
          mkdir -p "$XDG_DATA_HOME"
          install -d -m 700 "$XDG_RUNTIME_DIR"
          dbus-run-session -- bash -euo pipefail -c '
            printf %s ci-keyring | gnome-keyring-daemon --unlock --components=secrets --daemonize >/dev/null
            GH_STORE_KEY_TEST_SESSION_KEYRING=1 ctest --test-dir build --output-on-failure \
              --no-tests=error -R "^groundhog-store-key-keyring$" | tee build/groundhog-kc6-session.log
          '

      - name: Require the build to leave committed UI untouched
        run: |
          # data/ui/*.ui are committed Blueprint output; builds compile into
          # build/ and must never rewrite or add files in the source tree.
          git diff --exit-code
          if [ -n "$(git status --porcelain --untracked-files=all -- . ':!build')" ]; then
            git status --porcelain --untracked-files=all -- . ':!build'
            echo 'Build modified the source tree' >&2
            exit 1
          fi

      - name: Upload focused test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groundhog-ctest-linux
          path: |
            build/groundhog-ctest.log
            build/groundhog-ctest.xml
            build/groundhog-kc6-session.log
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  groundhog-sanitizers:
    # nostrc-qp24.15.2: the display-free Groundhog tests, the G24 privacy
    # harness among them, under AddressSanitizer with leak detection and
    # UndefinedBehaviorSanitizer; any report fails its test. A leak of a
    # library outside Groundhog that Groundhog cannot free is suppressed in
    # gnome/groundhog/tests/lsan.supp, each entry naming its bead; a leak in
    # Groundhog code is fixed instead. The widget tests stay in the job above.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GROUNDHOG_SANITIZER_TESTS: >-
        groundhog-identity groundhog-account groundhog-account-relays groundhog-dm-send
        groundhog-relay groundhog-relay-wire groundhog-relay-publish groundhog-relay-publish-wire
        groundhog-nip29 groundhog-conversations groundhog-dm-inbox groundhog-store-key
        groundhog-store-key-keyring groundhog-store groundhog-store-sqlite groundhog-store-marmot
        groundhog-store-conversations groundhog-outbox groundhog-account-store
        groundhog-link-policy groundhog-background groundhog-notifier groundhog-inbox-setup
        groundhog-expiry groundhog-auth-policy groundhog-contact-directory
        groundhog-privacy-e2e groundhog-new-message groundhog-requests
        groundhog-privacy-summary groundhog-conversation-info groundhog-nip29-service
        groundhog-net groundhog-group-ui groundhog-conversation-menu nostrc-test-bus-selftest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libgtk-4-dev libadwaita-1-dev libglib2.0-dev libsecret-1-dev \
            libjansson-dev libsecp256k1-dev libwebsockets-dev libsodium-dev \
            libssl-dev libcurl4-openssl-dev libsoup-3.0-dev libjson-glib-dev \
            libgit2-dev libsqlite3-dev libnsync-dev libsqlcipher-dev \
            dbus-bin blueprint-compiler gnome-keyring

      - name: Configure with ASAN and UBSAN
        run: |
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON -DBUILD_GROUNDHOG=ON \
            -DBUILD_NOSTR_GOBJECT=ON -DBUILD_NOSTR_GTK=OFF \
            -DBUILD_APPS=OFF -DBUILD_RELAYD=OFF -DSIGNET_ENABLE=OFF \
            -DGNOSTR_ENABLE_ASAN=ON -DGNOSTR_ENABLE_UBSAN=ON

      - name: Build the display-free tests
        run: |
          # groundhog itself: groundhog-background and groundhog-store-sqlite run it.
          targets=(groundhog)
          for test in $GROUNDHOG_SANITIZER_TESTS; do
            case "$test" in groundhog-*) targets+=("test-$test") ;; *) targets+=("$test") ;; esac
          done
          cmake --build build-asan --parallel 2 --target "${targets[@]}"

      - name: Run them under the sanitizers
        env:
          # halt_on_error: a UBSAN report fails its test as an ASAN one does.
          # verify_asan_link_order=0: ST-4's mutation check (groundhog-store-
          # sqlite) starts a process with plain libsqlite3 preloaded ahead of
          # the ASAN runtime on purpose.
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:verify_asan_link_order=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          G_SLICE: always-malloc
        run: |
          set -euo pipefail
          export LSAN_OPTIONS="suppressions=$PWD/gnome/groundhog/tests/lsan.supp:print_suppressions=1"
          read -ra tests <<< "$GROUNDHOG_SANITIZER_TESTS"
          regex="^($(IFS='|'; echo "${tests[*]}"))\$"
          # Every listed test is registered: none may silently drop out.
          expected=$(printf '%s\n' "${tests[@]}" | sort)
          registered=$(ctest --test-dir build-asan -N -R "$regex" |
                       sed -n 's/^ *Test *#[0-9]*: *//p' | sort)
          if [ "$registered" != "$expected" ]; then
            diff <(echo "$expected") <(echo "$registered") || true
            echo 'The sanitizer test set is incomplete' >&2
            exit 1
          fi
          ctest --test-dir build-asan --parallel 2 --output-on-failure --no-tests=error \
            --output-junit "$PWD/build-asan/groundhog-asan-ctest.xml" \
            -R "$regex" | tee build-asan/groundhog-asan-ctest.log
          if grep -Eq '\*\*\*Skipped|Not Run' build-asan/groundhog-asan-ctest.log; then
            echo 'A sanitizer test was skipped or did not run' >&2
            exit 1
          fi

      - name: Upload sanitizer test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groundhog-asan-ctest-linux
          path: |
            build-asan/groundhog-asan-ctest.log
            build-asan/groundhog-asan-ctest.xml
            build-asan/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
