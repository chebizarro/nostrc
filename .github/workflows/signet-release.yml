name: Signet release
on:
  push:
    tags: ['signet-v*']
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: Publish commit-addressed candidate images (never a version tag)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: signet-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  identity:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      tag: ${{ steps.identity.outputs.tag }}
      image: ${{ steps.identity.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - id: identity
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 signet/deploy/check-release.py --tag "$RELEASE_TAG" > identity.json
          {
            echo "sha=$(jq -r .sha identity.json)"
            echo "tag=$(jq -r .image_tag identity.json)"
            echo "image=ghcr.io/${REPOSITORY,,}-signet"
          } >> "$GITHUB_OUTPUT"
  signet-ci:
    needs: identity
    uses: ./.github/workflows/signet-ci.yml
    with:
      sha: ${{ needs.identity.outputs.sha }}
      artifact_prefix: signet-release-
  package:
    needs: [identity, signet-ci]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            passkeys: 'OFF'
            suffix: ''
          - variant: passkeys
            passkeys: 'ON'
            suffix: '-passkeys'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Outbound TLS regression and SQLite/SQLCipher Meson suites in clean image
        env:
          PASSKEYS: ${{ matrix.passkeys }}
        run: signet/deploy/build-image.sh "$PASSKEYS" --target test --progress plain
      - name: Build candidate (no registry write)
        env:
          PASSKEYS: ${{ matrix.passkeys }}
          IMAGE: ${{ needs.identity.outputs.image }}:${{ needs.identity.outputs.tag }}${{ matrix.suffix }}
          SIGNET_BUILD_VERSION: ${{ needs.identity.outputs.tag }}
          SIGNET_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          mkdir evidence
          signet/deploy/build-image.sh "$PASSKEYS" --load --tag "$IMAGE" --metadata-file evidence/build.json
          bash signet/tests/test_deployment_smoke.sh --image "$IMAGE"
          docker image inspect "$IMAGE" > evidence/image.json
          docker save "$IMAGE" -o evidence/image.tar
          sha256sum evidence/image.tar > evidence/image.tar.sha256
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ needs.identity.outputs.image }}:${{ needs.identity.outputs.tag }}${{ matrix.suffix }}
          format: spdx-json
          output-file: evidence/sbom.spdx.json
          upload-artifact: false
      - name: Validate expiring vulnerability exceptions
        run: python3 signet/deploy/check-release.py --ignore-output .trivyignore
      - name: Vulnerability report
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ needs.identity.outputs.image }}:${{ needs.identity.outputs.tag }}${{ matrix.suffix }}
          format: json
          output: evidence/vulnerabilities.json
          exit-code: '0'
      - name: Refuse unaccepted high/critical findings
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ needs.identity.outputs.image }}:${{ needs.identity.outputs.tag }}${{ matrix.suffix }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signet-${{ matrix.variant }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
  publish:
    # BOTH variants, runtime CI and scanners must pass before any registry write.
    needs: [identity, signet-ci, package]
    if: github.event_name == 'push' || inputs.publish_candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - variant: default
            suffix: ''
          - variant: passkeys
            suffix: '-passkeys'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signet-${{ matrix.variant }}
          path: evidence
      - name: Require existing package to remain private
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ needs.identity.outputs.image }}
        run: |
          package=${IMAGE##*/}
          owner_type=$(gh api "users/$OWNER" --jq .type)
          if [ "$owner_type" = Organization ]; then scope=orgs; else scope=users; fi
          status=$(curl -sS -o package.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/$scope/$OWNER/packages/container/$package")
          case "$status" in
            200) test "$(jq -r .visibility package.json)" = private ;;
            404) ;; # First GHCR publication is private; verify again after push.
            *) echo "Package privacy lookup failed: $status" >&2; exit 1 ;;
          esac
          echo "PACKAGE_API=$scope/$OWNER/packages/container/$package" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push exactly the scanned image
        id: push
        env:
          IMAGE: ${{ needs.identity.outputs.image }}:${{ needs.identity.outputs.tag }}${{ matrix.suffix }}
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum --check evidence/image.tar.sha256
          docker load -i evidence/image.tar
          test "$(docker image inspect "$IMAGE" --format '{{.Id}}')" = "$(jq -r '.[0].Id' evidence/image.json)"
          docker push "$IMAGE"
          digest=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf '%s@%s\n' "${IMAGE%:*}" "$digest" > evidence/digest.txt
          test "$(gh api "$PACKAGE_API" --jq .visibility)" = private
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ needs.identity.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-sbom@v3
        with:
          subject-name: ${{ needs.identity.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: evidence/sbom.spdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@v4
        with:
          name: signet-published-${{ matrix.variant }}
          path: evidence/digest.txt
  bundle:
    needs: [identity, publish]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.identity.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: signet-published-*
          path: published
      - name: Assemble per-release digest bundle
        run: |
          python3 signet/deploy/make-bundle.py \
            --default-image "$(cat published/signet-published-default/digest.txt)" \
            --passkeys-image "$(cat published/signet-published-passkeys/digest.txt)" \
            --output bundles
          tar -czf signet-deployment.tar.gz -C bundles .
          sha256sum signet-deployment.tar.gz > signet-deployment.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: signet-deployment-bundle
          path: |
            signet-deployment.tar.gz
            signet-deployment.tar.gz.sha256
