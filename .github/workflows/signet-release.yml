name: Signet release
on:
  push:
    tags: ['signet-v*']
  workflow_dispatch:
    inputs:
      publish_candidate:
        description: Publish commit-addressed candidate images (never a version tag)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: signet-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  identity:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      tag: ${{ steps.identity.outputs.tag }}
      image: ${{ steps.identity.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {persist-credentials: false}
      - id: identity
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 signet/deploy/check-release.py --tag "$RELEASE_TAG" > identity.json
          {
            echo "sha=$(jq -r .sha identity.json)"
            echo "tag=$(jq -r .image_tag identity.json)"
            echo "image=ghcr.io/${REPOSITORY,,}-signet"
          } >> "$GITHUB_OUTPUT"
  signet-ci:
    needs: identity
    uses: ./.github/workflows/signet-ci.yml
    with:
      sha: ${{ needs.identity.outputs.sha }}
      artifact_prefix: signet-release-
  package:
    needs: [identity, signet-ci]
    runs-on: ubuntu-24.04
    outputs:
      identity_default: ${{ steps.build.outputs.identity_default }}
      identity_passkeys: ${{ steps.build.outputs.identity_passkeys }}
      sbom_default: ${{ steps.sbom.outputs.sbom_default }}
      sbom_passkeys: ${{ steps.sbom.outputs.sbom_passkeys }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            passkeys: 'OFF'
            suffix: ''
          - variant: passkeys
            passkeys: 'ON'
            suffix: '-passkeys'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.identity.outputs.sha }}
          submodules: recursive
          persist-credentials: false
      - name: Create isolated builder
        run: docker buildx create --use
      - name: Outbound TLS regression and SQLite/SQLCipher Meson suites in clean image
        env:
          PASSKEYS: ${{ matrix.passkeys }}
        run: signet/deploy/build-image.sh "$PASSKEYS" --target test --progress plain
      - name: Build and seal candidate identity (no registry write)
        id: build
        env:
          VARIANT: ${{ matrix.variant }}
          PASSKEYS: ${{ matrix.passkeys }}
          IMAGE: ${{ needs.identity.outputs.image }}:${{ needs.identity.outputs.tag }}${{ matrix.suffix }}
          SIGNET_BUILD_VERSION: ${{ needs.identity.outputs.tag }}
          SIGNET_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          mkdir evidence
          signet/deploy/build-image.sh "$PASSKEYS" --load --tag "$IMAGE" --metadata-file evidence/build.json
          bash signet/tests/test_deployment_smoke.sh --image "$IMAGE"
          docker image inspect "$IMAGE" > evidence/image.json
          docker save "$IMAGE" -o evidence/image.tar
          sha256sum evidence/image.tar > evidence/image.tar.sha256
          # Job outputs, not scanner-writable evidence files, anchor publication.
          image_id=$(jq -er '."containerimage.config.digest"' evidence/build.json)
          test "$image_id" = "$(docker image inspect "$IMAGE" --format '{{.Id}}')"
          identity=$(jq -cn --arg image_id "$image_id" \
            --arg archive_sha256 "$(sha256sum evidence/image.tar | cut -d' ' -f1)" \
            --arg build_sha256 "$(sha256sum evidence/build.json | cut -d' ' -f1)" \
            '{image_id: $image_id, archive_sha256: $archive_sha256, build_sha256: $build_sha256}')
          {
            echo "image_id=$image_id"
            echo "identity_$VARIANT=$identity"
          } >> "$GITHUB_OUTPUT"
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.build.outputs.image_id }}
          format: spdx-json
          output-file: evidence/sbom.spdx.json
          upload-artifact: false
      - name: Seal SBOM before subsequent actions
        id: sbom
        env:
          VARIANT: ${{ matrix.variant }}
        run: echo "sbom_$VARIANT=$(sha256sum evidence/sbom.spdx.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Validate expiring vulnerability exceptions
        run: python3 signet/deploy/check-release.py --ignore-output .trivyignore
      - name: Vulnerability report
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ steps.build.outputs.image_id }}
          format: json
          output: evidence/vulnerabilities.json
          exit-code: '0'
      - name: Refuse unaccepted high/critical findings
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ steps.build.outputs.image_id }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: .trivyignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: signet-${{ matrix.variant }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14
  publish:
    # BOTH variants, runtime CI and scanners must pass before any registry write.
    needs: [identity, signet-ci, package]
    if: github.event_name == 'push' || inputs.publish_candidate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - variant: default
            suffix: ''
          - variant: passkeys
            suffix: '-passkeys'
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signet-${{ matrix.variant }}
          path: evidence
      - name: Check public package publication preconditions
        env:
          GH_TOKEN: ${{ secrets.GHCR_READ_TOKEN }} # Optional metadata enrichment only.
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ needs.identity.outputs.image }}:${{ needs.identity.outputs.tag }}${{ matrix.suffix }}
        run: |
          set -euo pipefail
          repository=${IMAGE%:*}
          repository=${repository#ghcr.io/}
          if ! response=$(curl -q -sS --connect-timeout 10 --max-time 30 -w '\n%{http_code}' \
            "https://ghcr.io/token?scope=repository:$repository:pull"); then
            echo '::error::Anonymous GHCR token request failed; refusing publication.' >&2
            exit 1
          fi
          authorization='Authorization:'
          case "${response##*$'\n'}" in
            200)
              if ! token=$(jq -er '.token | select(type == "string" and length > 0)' <<< "${response%$'\n'*}"); then
                echo '::error::Malformed anonymous GHCR token response.' >&2
                exit 1
              fi
              authorization="Authorization: Bearer $token" ;;
            401|403|404) ;; # GHCR can deny anonymous tokens for absent or inaccessible packages.
            *) echo '::error::Unexpected anonymous GHCR token response.' >&2; exit 1 ;;
          esac
          if ! status=$(curl -q -sS --connect-timeout 10 --max-time 30 -o /dev/null -w '%{http_code}' \
            -H "$authorization" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json' \
            "https://ghcr.io/v2/$repository/manifests/${IMAGE##*:}"); then
            echo '::error::Anonymous GHCR probe failed; refusing publication.' >&2
            exit 1
          fi
          case "$status" in
            200) echo 'Anonymous GHCR manifest: HTTP 200 (existing public image).' ;;
            401|403|404) echo "Anonymous GHCR manifest: HTTP $status (absent or inaccessible; push may proceed)." ;;
            *) echo "::error::Unexpected anonymous GHCR response: HTTP $status" >&2; exit 1 ;;
          esac
          # The repository GITHUB_TOKEN cannot supply user-owned package metadata.
          if [ -n "$GH_TOKEN" ]; then
            package=${repository##*/}
            if visibility=$(gh api "users/$OWNER/packages/container/$package" --jq .visibility); then
              echo "Package REST visibility: $visibility"
            else
              echo '::warning::Optional GHCR_READ_TOKEN metadata unavailable; anonymous gate passed.' >&2
            fi
          fi
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push exactly the scanned image
        id: push
        env:
          IMAGE: ${{ needs.identity.outputs.image }}:${{ needs.identity.outputs.tag }}${{ matrix.suffix }}
          EXPECTED_IDENTITY: ${{ needs.package.outputs[format('identity_{0}', matrix.variant)] }}
          EXPECTED_SBOM: ${{ needs.package.outputs[format('sbom_{0}', matrix.variant)] }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            "$(jq -er .archive_sha256 <<< "$EXPECTED_IDENTITY")" evidence/image.tar \
            "$(jq -er .build_sha256 <<< "$EXPECTED_IDENTITY")" evidence/build.json \
            "$EXPECTED_SBOM" evidence/sbom.spdx.json | sha256sum --check --strict
          docker load -i evidence/image.tar
          test "$(docker image inspect "$IMAGE" --format '{{.Id}}')" = "$(jq -er .image_id <<< "$EXPECTED_IDENTITY")"
          docker push "$IMAGE"
          digest=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf '%s@%s\n' "${IMAGE%:*}" "$digest" > evidence/digest.txt
          repository=${IMAGE%:*}
          repository=${repository#ghcr.io/}
          if ! response=$(curl -q -sS --connect-timeout 10 --max-time 30 -w '\n%{http_code}' \
            "https://ghcr.io/token?scope=repository:$repository:pull"); then
            echo '::error::Anonymous GHCR token request failed after push.' >&2
            exit 1
          fi
          authorization='Authorization:'
          case "${response##*$'\n'}" in
            200)
              if ! token=$(jq -er '.token | select(type == "string" and length > 0)' <<< "${response%$'\n'*}"); then
                echo '::error::Malformed anonymous GHCR token response.' >&2
                exit 1
              fi
              authorization="Authorization: Bearer $token" ;;
            401|403|404) ;; # GHCR can deny anonymous tokens for absent or inaccessible packages.
            *) echo '::error::Unexpected anonymous GHCR token response.' >&2; exit 1 ;;
          esac
          if ! status=$(curl -q -sS --connect-timeout 10 --max-time 30 -o evidence/anonymous-manifest.json -w '%{http_code}' \
            -H "$authorization" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json' \
            "https://ghcr.io/v2/$repository/manifests/${IMAGE##*:}"); then
            echo '::error::Anonymous GHCR probe failed after push.' >&2
            exit 1
          fi
          case "$status" in
            200) echo 'Anonymous GHCR manifest: HTTP 200 (published tag is publicly readable).' ;;
            *) echo "::error::Published tag must be anonymously readable: HTTP $status" >&2; exit 1 ;;
          esac
          manifest_digest="sha256:$(sha256sum evidence/anonymous-manifest.json | cut -d' ' -f1)"
          if [ "$manifest_digest" != "$digest" ]; then
            echo "::error::Anonymous tag manifest digest $manifest_digest differs from pushed digest $digest" >&2
            exit 1
          fi
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ needs.identity.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3.0.0
        with:
          subject-name: ${{ needs.identity.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: evidence/sbom.spdx.json
          push-to-registry: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signet-published-${{ matrix.variant }}
          path: evidence/digest.txt
  bundle:
    needs: [identity, publish]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.identity.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: signet-published-*
          path: published
      - name: Assemble per-release digest bundle
        run: |
          python3 signet/deploy/make-bundle.py \
            --default-image "$(cat published/signet-published-default/digest.txt)" \
            --passkeys-image "$(cat published/signet-published-passkeys/digest.txt)" \
            --output bundles
          tar -czf signet-deployment.tar.gz -C bundles .
          sha256sum signet-deployment.tar.gz > signet-deployment.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signet-deployment-bundle
          path: |
            signet-deployment.tar.gz
            signet-deployment.tar.gz.sha256
