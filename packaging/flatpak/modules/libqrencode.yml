# Shared flatpak-builder module (copied from the Groundhog manifest,
# gnome/groundhog/packaging/flatpak/org.nostr.Groundhog.yml), used by the
# gnostr and Grotto manifests.
name: libqrencode
buildsystem: cmake-ninja
config-opts:
  - -DBUILD_SHARED_LIBS=ON
  - -DWITH_TOOLS=OFF
  - -DWITH_TESTS=OFF
  - -DCMAKE_INSTALL_LIBDIR=lib
  - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
sources:
  - type: git
    url: https://github.com/fukuchi/libqrencode.git
    tag: v4.1.1
    commit: 715e29fd4cd71b6e452ae0f4e36d917b43122ce8
