# Shared flatpak-builder module (copied from the Groundhog manifest,
# gnome/groundhog/packaging/flatpak/org.nostr.Groundhog.yml), used by the
# gnostr and Grotto manifests.
name: jansson
buildsystem: cmake-ninja
config-opts:
  - -DCMAKE_BUILD_TYPE=Release
  - -DJANSSON_BUILD_SHARED_LIBS=ON
  - -DJANSSON_BUILD_DOCS=OFF
  - -DJANSSON_WITHOUT_TESTS=ON
  - -DJANSSON_EXAMPLES=OFF
  # Upstream still declares a CMake minimum the SDK's CMake rejects.
  - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
sources:
  - type: git
    url: https://github.com/akheron/jansson.git
    tag: v2.14
    commit: 684e18c927e89615c2d501737e90018f4930d6c5
