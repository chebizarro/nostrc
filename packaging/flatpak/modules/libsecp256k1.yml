# Shared flatpak-builder module (copied from the Groundhog manifest,
# gnome/groundhog/packaging/flatpak/org.nostr.Groundhog.yml), used by the
# gnostr and Grotto manifests.
name: libsecp256k1
buildsystem: autotools
config-opts:
  - --enable-module-recovery
  - --enable-module-extrakeys
  - --enable-module-schnorrsig
  - --enable-module-ecdh
  - --disable-benchmark
  - --disable-tests
  - --disable-exhaustive-tests
  - --disable-static
sources:
  - type: git
    url: https://github.com/bitcoin-core/secp256k1.git
    tag: v0.5.1
    commit: 642c885b6102725e25623738529895a95addc4f4
