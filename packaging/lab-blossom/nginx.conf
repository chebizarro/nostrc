# nginx.conf — TLS terminator in front of the lab Blossom server.
#
# Replace `blossom.lab.example.com` with the DNS name that resolves to
# THIS host's public IP. The letsencrypt paths assume you ran
# certbot certonly --standalone -d blossom.lab.example.com prior to
# starting docker compose.
#
# For a self-signed lab cert, generate with:
#   openssl req -x509 -newkey rsa:4096 -keyout privkey.pem \
#               -out fullchain.pem -days 30 -nodes \
#               -subj "/CN=blossom.lab.example.com"
# and point the ssl_certificate paths at those files.

server {
    listen 443 ssl http2;
    server_name blossom.lab.example.com;

    ssl_certificate     /etc/letsencrypt/live/blossom.lab.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blossom.lab.example.com/privkey.pem;

    # Match the docker-compose size cap so nginx doesn't 413 a legit
    # 4 MiB porthome chunk. Leave headroom above MAX_FILE_SIZE.
    client_max_body_size 16m;

    # Blossom is idempotent PUT — long-poll clients aren't a thing, but
    # a slow chunk write over a lossy uplink shouldn't kill the connection.
    proxy_read_timeout  120s;
    proxy_send_timeout  120s;

    location / {
        proxy_pass         http://blossom-lab:3000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        # Preserve the raw request body — critical for BUD-02: the server
        # hashes the body and compares to the "x" tag on the auth event.
        proxy_request_buffering off;
    }
}

# Redirect plaintext to TLS so `curl -sSf https://<host>` works from
# whatever ambient client happens to hit the box. Comment this out if
# you're intentionally sharing a port with another service.
server {
    listen 80;
    server_name blossom.lab.example.com;
    return 301 https://$host$request_uri;
}
