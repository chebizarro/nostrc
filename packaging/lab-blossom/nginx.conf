# The HTTP listener is container-network-only; host publication is TLS.
server {
    listen 80;
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/vsp01-certs/fullchain.pem;
    ssl_certificate_key /etc/vsp01-certs/privkey.pem;
    client_max_body_size 16m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    # Upstream uses public immutable caching; that must not survive private
    # ingress or a shared cache could serve a member's blob to a nonmember.
    add_header Cache-Control "no-store" always;
    add_header Vary "Authorization" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-SHA-256, X-Content-Type, X-Content-Length" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Expose-Headers "WWW-Authenticate, X-Reason" always;

    location = / {
        default_type application/json;
        return 200 '{"name":"VSP-01 lab","private":true}';
    }
    location = /.well-known/blossom.json {
        default_type application/json;
        return 200 '{"name":"VSP-01 lab","private":true}';
    }
    location = /_vsp_auth {
        internal;
        proxy_pass http://vsp-auth:3001;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Host $host;
    }
    location / {
        if ($request_method = OPTIONS) { return 204; }
        auth_request /_vsp_auth;
        proxy_pass http://blossom-lab:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        # Do not map missing blobs to 401 after lookup. Unauthorized requests
        # must never reach the store at all. Keep authorized 404s literal.
        proxy_hide_header Cache-Control;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
    }
}
