# Schema: blossom-server 6.4.1. Authorization is enforced by vsp-auth +
# nginx, before any store lookup (including nonexistent hashes).
port: 3000
host: 0.0.0.0
database:
  path: /app/data/sqlite.db
storage:
  backend: local
  local:
    dir: /app/data/blobs
  rules:
    - type: "*"
      expiration: 1 year
upload:
  enabled: true
  requireAuth: true
  requirePubkeyInRule: false
  maxSize: 8388608
  workers: 1
  maxJobsPerWorker: 2
mirror:
  enabled: true
  requireAuth: true
list:
  enabled: true
  requireAuth: true
  allowListOthers: false
delete:
  requireAuth: true
media:
  enabled: false
report:
  enabled: false
landing:
  enabled: false
# 6.4.1 uploads use the declared Content-Type, not file-type sniffing.
# Wildcard retention accepts application/octet-stream with no rewriting.
