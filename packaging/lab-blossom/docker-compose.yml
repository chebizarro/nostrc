# VSP-01 reference lab. Only nginx is published; never expose blossom-lab
# directly, since authorization and existence hiding happen at its front door.
services:
  blossom-lab:
    image: ghcr.io/hzrd149/blossom-server:6.4.1@sha256:446fa6c4b0ca529a1fbceabf5ea75839b5b76dfb0d0e1d150f3bae5f9a52b3b8
    restart: unless-stopped
    environment:
      BLOSSOM_REQUIRE_CONFIG: "1"
    volumes:
      - blossom-data:/app/data
      - ./blossom-server.config.yaml:/app/config.yml:ro
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "deno", "eval", "await fetch('http://127.0.0.1:3000/')"]
      interval: 2s
      timeout: 5s
      retries: 30

  vsp-auth:
    # Reuse the server's locked, cached Nostr verifier; no runtime npm install.
    image: ghcr.io/hzrd149/blossom-server:6.4.1@sha256:446fa6c4b0ca529a1fbceabf5ea75839b5b76dfb0d0e1d150f3bae5f9a52b3b8
    entrypoint: ["deno", "run", "--cached-only", "--allow-net", "--allow-read", "--allow-env=DEBUG", "/app/vsp01-auth.ts"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${VSP01_ALLOWLIST:-./allowlist.txt}:/config/allowlist.txt:ro
      - ./vsp01-auth.ts:/app/vsp01-auth.ts:ro
      - ./vsp01-conformance.ts:/app/vsp01-conformance.ts:ro
    expose: ["3001"]
    healthcheck:
      test: ["CMD", "deno", "eval", "await fetch('http://127.0.0.1:3001/')"]
      interval: 2s
      timeout: 5s
      retries: 30

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      blossom-lab:
        condition: service_healthy
      vsp-auth:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${VSP01_PORT:-8443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${VSP01_CERT_DIR:-./certs}:/etc/vsp01-certs:ro

volumes:
  blossom-data:
