# packaging/lab-blossom/docker-compose.yml
#
# A permissive Blossom server for the lab / CI two-machine porthome demo
# (nostrc-4f9v). Use this when neither of the community servers cooperates
# with random-bytes uploads:
#
#   - blossom.sharegap.net  (raw)  — usually fine
#   - blossom.primal.net   (PNG-shim required) — occasionally 500s
#   - blossom.band          — 500 unknown error, out of the community set
#
# This recipe stands up a small, un-opinionated Blossom server (BUD-01/02)
# behind an optional nginx TLS terminator. The upstream reference server
# from hzrd149/blossom-server is Node/TypeScript; we pin a tag and mount
# only a blobs volume and a single config file. No auth beyond BUD-02's
# native kind-24242 event verification, no thumbnailing, no size cap
# below 8 MiB.
#
# HOW TO USE
# ==========
# 1) Put this file on a host with a public IPv4/IPv6. The SSRF pre-check
#    inside nostr-home-fetch refuses private ranges — see README §3.
# 2) `docker compose up -d`
# 3) Point your pusher at it:
#      nostr-homed-provision --blossom https://<your-host>:8443 ...
# 4) The volume `./blobs/` persists uploaded objects. Wipe it to start
#    over; the reference server rehydrates its index on next start.
#
# WHAT THIS IS NOT
# ================
# - Not audited: for lab / CI use only. Do not host anyone else's data.
# - Not distributed with a valid TLS cert. The nginx sidecar reads
#    /etc/letsencrypt/live/<host>/ — you must run certbot on the host
#    (or drop a self-signed cert in and accept the client warning; see
#    README §4).
# - Not a substitute for a hardened production Blossom deployment.

version: "3.9"

services:
  # ------------------------------------------------------------------
  # blossom-lab — hzrd149's reference Blossom server (upstream image).
  # We pin by digest in production; the tag below is the last known-good
  # release at the time this recipe was written. Bump when needed.
  # ------------------------------------------------------------------
  blossom-lab:
    image: ghcr.io/hzrd149/blossom-server:v1.0.0
    container_name: blossom-lab
    restart: unless-stopped
    environment:
      # BUD-02 default enforced — the upstream server verifies kind-24242
      # events on PUT / DELETE without extra config.
      - PORT=3000
      # 8 MiB cap — porthome's canonical chunk is 4 MiB + ~14 KiB of
      # AEAD overhead + 41-byte shim, so 8 MiB comfortably clears a
      # doubled worst-case chunk without letting the lab become a
      # blob dumping ground.
      - MAX_FILE_SIZE=8388608
    volumes:
      - ./blobs:/data/blobs:rw
      - ./blossom-server.config.yaml:/config/config.yaml:ro
    command: ["--config", "/config/config.yaml"]
    # Only bind on the loopback of the docker host; nginx does the
    # public TLS termination. Comment this out and expose 3000 directly
    # if you're intentionally running without TLS on a lab VLAN.
    expose:
      - "3000"

  # ------------------------------------------------------------------
  # nginx — TLS terminator + reverse proxy. Optional: skip if you want
  # to test against a plaintext http://blossom-lab:3000 URL, but the
  # porthome pusher enforces https:// unless NH_PORTHOME_ALLOW_INSECURE=1
  # is set on the client (lab-only escape hatch — see README §5).
  # ------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: blossom-lab-tls
    depends_on:
      - blossom-lab
    restart: unless-stopped
    ports:
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/blossom.conf:ro
      # If you use letsencrypt, mount /etc/letsencrypt from the host:
      - /etc/letsencrypt:/etc/letsencrypt:ro

# No named volumes — everything binds to ./ so the operator can inspect
# the blob store on the host filesystem without shelling into a
# container.
