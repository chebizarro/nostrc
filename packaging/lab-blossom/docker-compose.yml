# Permissive two-machine porthome lab (nostrc-4f9v). Default mode requires
# only native BUD-02 upload auth, not a service pubkey allowlist. GET is public.
# Use a public host for nostr-home-fetch's SSRF guard; see README sections 3-5.
#
# The original v1.0.0 image tag returns manifest unknown. 6.4.1 is pinned by
# digest and uses /app/config.yml; upload.maxSize replaces the old ignored
# MAX_FILE_SIZE env knob. The 8 MiB limit is enforced in the YAML in BOTH modes:
# porthome's 4 MiB chunk + ~14 KiB AEAD overhead + 41-byte PNG shim needs
# headroom, without turning the lab into an unlimited blob dumping ground.
#
# Opt-in private mode: add -f docker-compose.vsp01.yml (README section 9).
services:
  blossom-lab:
    image: ghcr.io/hzrd149/blossom-server:6.4.1@sha256:446fa6c4b0ca529a1fbceabf5ea75839b5b76dfb0d0e1d150f3bae5f9a52b3b8
    restart: unless-stopped
    environment:
      BLOSSOM_REQUIRE_CONFIG: "1"
    volumes:
      # Preserve the operator-visible ./blobs store; new upstream SQLite state
      # lives separately in ./data. No old-format index migration is implied.
      - ${BLOSSOM_DATA_DIR:-./data}:/app/data
      - ${BLOSSOM_BLOBS_DIR:-./blobs}:/app/data/blobs
      - ./blossom-server.config.yaml:/app/config.yml:ro
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "deno", "eval", "await fetch('http://127.0.0.1:3000/')"]
      interval: 2s
      timeout: 5s
      retries: 30

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      blossom-lab:
        condition: service_healthy
    restart: unless-stopped
    # Public host binding is intentional for the two-machine demo. VSP-01's
    # override replaces this list, rather than retaining a public mapping.
    ports:
      - "${BLOSSOM_PORT:-8443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${BLOSSOM_LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
