[package]
name = "mdk09-probe-driver"
version = "0.1.0"
edition = "2024"
publish = false
description = "MDK 0.9.0 expected-incompatible probe (KeyPackages only) for nostrc's interop matrix (nostrc-a5u5)"
license = "MIT"

# MDK v0.9.0 (a102b196): the first cgka-engine cohort, with the superseded
# 0xF2F1 v1 account proof (not the adopted 0x8009 v2). A probe, not a peer:
# it makes and publishes KeyPackages as MDK 0.9's marmot-app does, so the
# interop test can assert that MDK 0.11 and Groundhog refuse them honestly.
[dependencies]
cgka-session = { git = "https://github.com/marmot-protocol/mdk", rev = "a102b1966267c5bfcbe3a822212c0e343ac109ef" }
cgka-engine = { git = "https://github.com/marmot-protocol/mdk", rev = "a102b1966267c5bfcbe3a822212c0e343ac109ef" }
cgka-traits = { git = "https://github.com/marmot-protocol/mdk", rev = "a102b1966267c5bfcbe3a822212c0e343ac109ef" }
storage-sqlite = { git = "https://github.com/marmot-protocol/mdk", rev = "a102b1966267c5bfcbe3a822212c0e343ac109ef" }
transport-nostr-peeler = { git = "https://github.com/marmot-protocol/mdk", rev = "a102b1966267c5bfcbe3a822212c0e343ac109ef" }
transport-nostr-adapter = { git = "https://github.com/marmot-protocol/mdk", rev = "a102b1966267c5bfcbe3a822212c0e343ac109ef" }
# MDK v0.9.0's own nostr pin (its workspace dependency).
nostr = { version = "0.44.2", default-features = false, features = ["std", "nip59"] }
serde_json = "1"
hex = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "net", "io-std", "io-util", "time"] }
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
