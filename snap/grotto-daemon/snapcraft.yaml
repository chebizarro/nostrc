# Built from the repository root: CI copies this file to snap/snapcraft.yaml
# (see the snap jobs in .github/workflows/release.yml), so `source: .` is
# the whole tree, submodules included.
name: grotto-daemon
base: core24
version: 0.1.1-alpha1
title: Grotto Daemon
summary: Background Nostr signing service without a graphical interface
description: |
  Grotto Daemon handles Nostr signing, encryption and decryption requests
  through NIP-55L and explicitly configured NIP-46 remote signing. This
  package contains only the background service, not the Grotto identity
  manager or graphical approval interface. Sandboxed signer packages are
  experimental; use the native Linux package for desktop integration.
icon: apps/grotto/data/icons/hicolor/256x256/apps/org.nostr.Grotto.png

grade: stable
confinement: strict

apps:
  grotto-daemon:
    command: usr/bin/grotto-daemon
    daemon: simple
    restart-condition: on-failure
    plugs: [network, network-bind]

parts:
  app:
    plugin: nil
    source: .
    # Configuring the tree needs the GUI libraries too; only the daemon is built.
    build-packages:
      - build-essential
      - cmake
      - ninja-build
      - gettext
      - pkg-config
      - git
      - python3-pip
      - python3-gi
      - libgtk-4-dev
      - libadwaita-1-dev
      - libjson-glib-dev
      - libsoup-3.0-dev
      - libsecret-1-dev
      - libjansson-dev
      - libwebsockets-dev
      - libssl-dev
      - libpeas-2-dev
      - libsqlite3-dev
      - libqrencode-dev
      - libsecp256k1-dev
      - libsodium-dev
      - libcurl4-openssl-dev
      - libzbar-dev
      - libgstreamer1.0-dev
      - libgstreamer-plugins-base1.0-dev
      - libxml2-dev
      - librsvg2-dev
      - libgdk-pixbuf-2.0-dev
    stage-packages:
      - libglib2.0-0t64
      - libjansson4
      - libwebsockets19t64
      - libsecret-1-0
      - libsecp256k1-1
      - libsodium23
    override-build: scripts/ci/build-snap-part.sh daemon
