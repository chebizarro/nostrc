# Built from the repository root: CI copies this file to snap/snapcraft.yaml
# (see the snap jobs in .github/workflows/release.yml), so `source: .` is
# the whole tree, submodules included.
name: grotto-daemon
base: core24
version: 0.1.0
summary: Grotto Daemon
description: |
  Background daemon for Grotto to handle signing and IPC.

grade: stable
confinement: strict

apps:
  grotto-daemon:
    command: usr/bin/grotto-daemon
    daemon: simple
    restart-condition: on-failure
    plugs: [network, network-bind]

parts:
  app:
    plugin: nil
    source: .
    # Configuring the tree needs the GUI libraries too; only the daemon is built.
    build-packages:
      - build-essential
      - cmake
      - ninja-build
      - pkg-config
      - git
      - python3-pip
      - libgtk-4-dev
      - libadwaita-1-dev
      - libjson-glib-dev
      - libsoup-3.0-dev
      - libsecret-1-dev
      - libjansson-dev
      - libwebsockets-dev
      - libssl-dev
      - libpeas-2-dev
      - libsqlite3-dev
      - libqrencode-dev
      - libsecp256k1-dev
      - libsodium-dev
      - libcurl4-openssl-dev
    stage-packages:
      - libglib2.0-0t64
      - libjansson4
      - libwebsockets19t64
      - libsecret-1-0
      - libsecp256k1-1
      - libsodium23
    override-build: scripts/ci/build-snap-part.sh daemon
