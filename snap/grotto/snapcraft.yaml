# Built from the repository root: CI copies this file to snap/snapcraft.yaml
# (see the snap jobs in .github/workflows/release.yml), so `source: .` is
# the whole tree, submodules included.
name: grotto
base: core24
version: 0.1.0
summary: Grotto, a Nostr signer (GTK)
description: |
  Grotto securely authorizes Nostr app requests (NIP-55L, NIP-46).

grade: stable
confinement: strict

apps:
  grotto:
    command: usr/bin/grotto
    desktop: usr/share/applications/org.nostr.Grotto.desktop
    extensions: [gnome]
    plugs: [network, network-bind, password-manager-service]
    environment:
      LD_LIBRARY_PATH: $SNAP/usr/lib:$LD_LIBRARY_PATH

parts:
  app:
    plugin: nil
    source: .
    build-packages:
      - build-essential
      - cmake
      - ninja-build
      - pkg-config
      - git
      - python3-pip
      - libjansson-dev
      - libwebsockets-dev
      - libssl-dev
      - libpeas-2-dev
      - libsqlite3-dev
      - libqrencode-dev
      - libsecp256k1-dev
      - libsodium-dev
      - libcurl4-openssl-dev
    stage-packages:
      - libjansson4
      - libwebsockets19t64
      - libpeas-2-0
      - libqrencode4
      - libsecp256k1-2
      - libsodium23
    override-build: scripts/ci/build-snap-part.sh all
    prime:
      - -usr/bin/gnostr
      - -usr/share/gnostr
      - -usr/share/applications/org.gnostr.gnostr.desktop
      - -usr/include
      - -usr/lib/pkgconfig
      - -usr/lib/cmake
