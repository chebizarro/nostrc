# Built from the repository root: CI copies this file to snap/snapcraft.yaml
# (see the snap jobs in .github/workflows/release.yml), so `source: .` is
# the whole tree, submodules included.
name: grotto
base: core24
version: 0.1.2-alpha1
# Keep the explicit version in lockstep with GROTTO_VERSION_FULL. AppStream
# supplies the listing title, summary and description from the installed file.
adopt-info: app
icon: apps/grotto/data/icons/hicolor/256x256/apps/org.nostr.Grotto.png

grade: stable
confinement: strict

apps:
  grotto:
    command: usr/bin/grotto
    desktop: usr/share/applications/org.nostr.Grotto.desktop
    extensions: [gnome]
    plugs: [network, network-bind, password-manager-service]
    environment:
      LD_LIBRARY_PATH: $SNAP/usr/lib:$LD_LIBRARY_PATH

parts:
  app:
    plugin: nil
    source: .
    parse-info: [usr/share/metainfo/org.nostr.Grotto.metainfo.xml]
    build-packages:
      - build-essential
      - cmake
      - ninja-build
      - gettext
      - pkg-config
      - git
      - python3-pip
      - python3-gi
      - libjansson-dev
      - libwebsockets-dev
      - libssl-dev
      - libpeas-2-dev
      - libsqlite3-dev
      - libqrencode-dev
      - libsecp256k1-dev
      - libsodium-dev
      - libcurl4-openssl-dev
      - libzbar-dev
      - libgstreamer1.0-dev
      - libgstreamer-plugins-base1.0-dev
    stage-packages:
      - libjansson4
      - libwebsockets19t64
      - libpeas-2-0
      - libqrencode4
      - libsecp256k1-1
      - libsodium23
      - libzbar0t64
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
    override-build: scripts/ci/build-snap-part.sh all
    prime:
      - -usr/bin/gnostr
      - -usr/share/gnostr
      - -usr/share/applications/org.gnostr.gnostr.desktop
      - -usr/include
      - -usr/lib/pkgconfig
      - -usr/lib/cmake
