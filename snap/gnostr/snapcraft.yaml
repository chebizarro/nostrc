# Built from the repository root: CI copies this file to snap/snapcraft.yaml
# (see the snap jobs in .github/workflows/release.yml), so `source: .` is
# the whole tree, submodules included.
name: gnostr
base: core24
version: 0.1.0
summary: GNostr Client (GTK)
description: |
  GTK desktop client for Nostr using the GNostr stack.

grade: stable
confinement: strict

apps:
  gnostr:
    command: usr/bin/gnostr
    desktop: usr/share/applications/org.gnostr.gnostr.desktop
    extensions: [gnome]
    plugs: [network, password-manager-service]
    environment:
      GNOSTR_PLUGIN_PATH: $SNAP/usr/share/gnostr/plugins
      LD_LIBRARY_PATH: $SNAP/usr/lib:$LD_LIBRARY_PATH

parts:
  app:
    plugin: nil
    source: .
    build-packages:
      - build-essential
      - cmake
      - ninja-build
      - pkg-config
      - git
      - python3-pip
      - libjansson-dev
      - libwebsockets-dev
      - libssl-dev
      - libpeas-2-dev
      - libsqlite3-dev
      - libqrencode-dev
      - libsecp256k1-dev
      - libsodium-dev
      - libcurl4-openssl-dev
    stage-packages:
      - libjansson4
      - libwebsockets19t64
      - libpeas-2-0
      - libqrencode4
      - libsecp256k1-1
      - libsodium23
    override-build: scripts/ci/build-snap-part.sh all
    prime:
      - -usr/bin/grotto
      - -usr/bin/grotto-daemon
      - -usr/share/applications/org.nostr.Grotto.desktop
      - -usr/share/dbus-1/services/org.nostr.Signer.service
      - -usr/share/dbus-1/services/org.nostr.Grotto.service
      - -usr/share/systemd
      - -usr/include
      - -usr/lib/pkgconfig
      - -usr/lib/cmake
