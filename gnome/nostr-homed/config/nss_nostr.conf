# /etc/nss_nostr.conf — nostr-homed NSS module configuration
#
# Read by libnss_nostr.so.2 (the read-only NSS projection reader). No other
# path is consulted; the file must be root-owned, mode 0644, and every parent
# directory must also be root-owned and not group/world-writable — see
# src/nss/nss_nostr.c:trusted_file() for the exact security requirements.
#
# Packaging note: this file is a distro conffile. Debian and Fedora packaging
# MUST mark it as such — %config(noreplace) on Fedora, `debian/conffiles` or
# the automatic dh_installdeb detection for files under /etc/ on Debian — so
# admin edits survive package upgrades.
#
# Recognised keys
# ---------------
#
# projection_path (string, REQUIRED)
#   Absolute path to the read-only NSS projection database (SQLite) that
#   nostr-authd atomically re-publishes with `nh_identity_store_publish_projection`.
#   The NSS module opens it read-only; only nostr-authd (running as root)
#   may write it.
#
# Any other keys currently in this file are rejected as invalid; the module
# fails closed rather than silently ignoring lines it does not understand.
projection_path=/var/lib/nostr-auth/nss.db
