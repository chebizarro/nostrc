# sysusers.d(5) — provision the greeter-artifact confidentiality group.
#
# The nostr-authd broker publishes /run/nostr-auth/greeter/current.{json,png}
# and avatar.png at mode 0640, owned root:nostr-auth-greeter, so the
# one-time NIP-46 `secret=` pairing token embedded in current.json (and
# encoded into the QR modules of current.png) is not readable by every
# local uid on the machine.  gdm and the seated user (during
# unlock-dialog, via pam_group) join this group and can therefore
# render the QR; any other local shell is denied.  See
# docs/reviews/greeter-artifact-secret-confidentiality-2026-09-22.md
# and beads nostrc-3c7n (references nostrc-zcll.6).
#
# systemd-sysusers(8) processes this at boot / on package install.
# gid is deliberately unset so the distro can pick from its system-gid
# range — the broker resolves the group by NAME at write time, not by
# a hardcoded gid.
#
# Distro-packaging follow-up: postinst / %post scripts should also add
# `gdm` to this group so the greeter itself can read the artifact
# without waiting for gdm's next login (`gpasswd -a gdm
# nostr-auth-greeter` on Debian/Ubuntu, `usermod -a -G nostr-auth-greeter
# gdm` on Fedora). The unlock-dialog path is handled by pam_group at
# session start; see packaging/pam/nostr-auth-greeter.group.conf.sample.
g nostr-auth-greeter -
