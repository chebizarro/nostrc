# sysusers.d(5) — provision the dedicated helper account that owns
# the porthome/FUSE-materialized mountpoint the standalone Samba
# instance serves.  Plan §4.2 B5 (2026-09-25), beads nostrc-69pw.
#
# `nostr-smbd.service` (the dedicated smbd) runs as `root` but every
# share stanza in smb.conf.standalone.sample `force user`s to
# `nostr-smb-share`.  All file writes therefore land as this uid,
# matching what `nostr-home-fuse` expects to sync back out to
# Blossom.  Group `nostr-smb-share` mediates read access from
# additional helpers (e.g. a future `nostr-smb-audit` reader) via
# ACL — the default share stanza gates entry with `valid users =
# @nostr-smb-share`.
#
# The mountpoint (default /var/lib/nostr-auth/share-root) is
# owned by this user + group at mode 0750 by nostr-home-fuse when
# it materializes.  Nostr-smbd never chowns the directory itself;
# ownership is a property of the mount, not of smbd.
#
# We reserve BOTH the user and its primary group.  Naming the group
# explicitly (systemd-sysusers's implicit default would match) keeps
# the group name stable if we later add supplementary members from
# other services.  GECOS is short — this account never logs in
# interactively; the passwd row exists only so operators can see
# why the uid is present.
#
# Home dir and shell are unset ("- -") — the account never logs in
# interactively.  Fallback in the smb code path: if this user is
# missing (packaging skipped, sysusers-d not applied, container
# image with no systemd), the share stanza's `force user` refuses
# access rather than silently downgrading to `nobody` — a
# CVE-fingered mistake we do NOT want to inherit.
#
# gid deliberately unset ("-"); the distro picks from its system-uid
# range.  Downstream code resolves the user by NAME (getpwnam), never
# by a hardcoded uid.
u nostr-smb-share - "Nostr standalone-Samba share owner" -
