# sysusers.d(5) — provision the dedicated helper account used by the
# portable-home fetch sandbox (bead nostrc-ww50).
#
# The nostr-authd broker's PROVISION_HOME job forks the
# `nostr-home-fetch` binary (bead nostrc-9k4g) — an unprivileged
# clone of nostr-homed-profile-image's hardening (design §7.2, §8.2).
# The parent (root) drops to THIS uid before exec: setgroups(1,&gid)
# + setgid + setuid; PR_SET_NO_NEW_PRIVS + PR_SET_DUMPABLE=0;
# RLIMIT_AS/CPU/FSIZE/NOFILE caps; every non-stdio fd closed. See
# gnome/nostr-homed/src/porthome/nh_porthome_sandbox.c.
#
# We reserve BOTH the user and its private group. The primary-group
# name matches the user name (systemd-sysusers's implicit default);
# spelling it explicitly keeps the group name stable if we later add
# supplementary members. GECOS is intentionally short — the passwd
# database is the only place a curious operator sees this account,
# and "Nostr portable-home fetch helper" tells them why it exists.
#
# Home dir and shell are unset ("- -") because the account never logs
# in interactively. Fallback in the sandbox: if this user is missing
# (packaging skipped, sysusers-d not applied, container image with no
# systemd), the sandbox falls back to `nobody` at spawn time — the
# hardening posture is preserved either way.
#
# gid deliberately unset ("-"); the distro picks from its system-uid
# range. The sandbox resolves the user by NAME via getpwnam(), never
# by a hardcoded uid.
u nostr-home-fetch - "Nostr portable-home fetch helper" -
