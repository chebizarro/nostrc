[Codex]
subtitle=OpenAI Codex CLI coding agent
docs=https://github.com/marmot-protocol/mdk/blob/master/integrations/codex/marmot/README.md
prompt=Connect this Codex setup to Groundhog through Marmot. Read the Codex guide at <https://github.com/marmot-protocol/mdk/blob/master/integrations/codex/marmot/README.md> and the connector guide at <https://github.com/marmot-protocol/mdk/blob/master/crates/agent-connector/README.md>. Explain the changes and confirm Codex CLI is installed and authenticated. Propose setup for my public npub {npub}, then ask approval before changing anything. After approval, use the checksum-verified install flow, verify the connector, reply with your agent npub, and ask me to invite it to a Marmot chat in Groundhog. Do not call setup complete until a round-trip chat reply is verified; otherwise say device verification is required.

