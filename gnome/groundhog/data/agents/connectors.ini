[Hermes]
subtitle=Terminal agent by Nous Research
docs=https://github.com/marmot-protocol/mdk/blob/master/crates/agent-connector/README.md
prompt=Connect this Hermes installation to Groundhog through Marmot. Read the connector guide at <https://github.com/marmot-protocol/mdk/blob/master/crates/agent-connector/README.md>. Explain how the connector works and what installation will change. Propose steps for my public npub {npub}, then ask my approval before changing anything. After approval, install and verify the connector, reply with your agent npub, and ask me to invite it to a Marmot chat in Groundhog.

