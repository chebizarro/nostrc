# SPDX-License-Identifier: MIT
# See deploy/README.md. Production is started only by signet-compose.service.
# Supply BOTH site deploy.env and the selected release.env; no build fallback.
name: signet
x-hardened: &hardened
  image: ${SIGNET_IMAGE:?digest-pinned SIGNET_IMAGE required from release.env}
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: ["/tmp:size=10M,mode=1777,noexec,nosuid,nodev"]
  ulimits:
    core: 0
    memlock: {soft: -1, hard: -1}
  mem_limit: 512m
  cpus: 1.0
  restart: "no"
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  signetd:
    <<: *hardened
    network_mode: host
    command: ["-c", "/etc/signet/signet.conf"]
    stop_grace_period: 30s
    environment:
      SIGNET_REQUIRE_ENCRYPTED_DB: "true"
      SIGNET_DB_KEY_FILE: /run/secrets/signet_db_key
      SIGNET_BUNKER_NSEC_FILE: /run/secrets/signet_bunker_nsec
    volumes:
      - type: bind
        source: /opt/signet/config
        target: /etc/signet
        bind: {create_host_path: false}
      - type: bind
        source: /srv/signet/state
        target: /data
        bind: {create_host_path: false}
      - type: bind
        source: /opt/signet/secrets/db.key
        target: /run/secrets/signet_db_key
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /opt/signet/secrets/bunker.nsec
        target: /run/secrets/signet_bunker_nsec
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:${SIGNET_HEALTH_PORT:?pin health port in deploy.env and INI}/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
  signet-ops:
    <<: *hardened
    profiles: [ops]
    network_mode: none
    entrypoint: ["signetctl", "-c", "/etc/signet/signet.conf"]
    healthcheck: {disable: true}
    environment:
      SIGNET_REQUIRE_ENCRYPTED_DB: "true"
      SIGNET_DB_KEY_FILE: /run/secrets/signet_db_key
      SIGNET_BACKUP_KEY_FILE: /run/secrets/signet_backup_key
    volumes:
      - type: bind
        source: /opt/signet/config
        target: /etc/signet
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /srv/signet/state
        target: /data
        bind: {create_host_path: false}
      - type: bind
        source: /srv/signet/backups
        target: /backups
        bind: {create_host_path: false}
      - type: bind
        source: /opt/signet/secrets/db.key
        target: /run/secrets/signet_db_key
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /opt/signet/secrets/backup.key
        target: /run/secrets/signet_backup_key
        read_only: true
        bind: {create_host_path: false}
