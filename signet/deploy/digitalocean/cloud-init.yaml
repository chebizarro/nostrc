#cloud-config
# Template rendered by create-droplet.sh; contains public provisioning inputs only.
disable_root: true
ssh_pwauth: false
users:
  - name: signet-admin
    groups: [sudo]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys: []
apt:
  primary:
    - arches: [default]
      uri: https://mirrors.digitalocean.com/ubuntu/
  security:
    - arches: [default]
      uri: https://security.ubuntu.com/ubuntu/
package_update: true
packages: [ca-certificates, curl, gnupg, python3, python3-jsonschema, awscli, util-linux]
write_files: []
runcmd:
  - [bash, /root/signet-host-init.sh]
final_message: "Signet host initialization finished. Inspect cloud-init status; install release and custody files before starting Signet."
